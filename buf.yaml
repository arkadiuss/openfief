# Protobuf contracts (D-11), Apache-2.0 (proto/LICENSE, D-5). Run through task: proto:lint, proto:breaking, proto:gen.
version: v2
modules:
  - path: proto
# google/api/annotations.proto: the read API's HTTP rules (D-50), served as REST by Vanguard. Pinned in buf.lock.
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
