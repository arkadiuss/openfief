# Go code for the contracts goes into the Apache-2.0 Go SDK module (sdk/go), which the core imports.
# The plugins are the pinned local binaries in .bin/ (Taskfile.yml), never remote plugins.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/arkadiuss/openfief/sdk/go/gen
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: sdk/go/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: sdk/go/gen
    opt: paths=source_relative
