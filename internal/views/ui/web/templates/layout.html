<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
<title>{{.Title}} · OpenFief</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
{{block "scripts" .}}{{end}}
</head>
<body>
<header class="top">
  <a class="brand" href="/">OpenFief</a>
  {{with .Session}}
  <nav aria-label="Main">
    <a href="/">Overview</a>
    <a href="/assertions">Flagged assertions</a>
    <a href="/plugins">Plugins</a>
    {{if .Owner}}<a href="/settings">Settings</a>{{end}}
  </nav>
  <span class="scope" title="What this session may do">{{.ScopeLabel}} access</span>
  <form method="post" action="/logout" class="inline">
    <button type="submit" class="link">Sign out</button>
  </form>
  {{end}}
</header>
<main>
<h1>{{.Title}}</h1>
{{template "content" .}}
</main>
</body>
</html>
