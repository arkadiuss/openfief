name: Set up OpenFief tooling
description: >-
  Go and Task (at the Taskfile's TASK_VERSION); unless `tools` is false, also Node and `task setup:ci`
  (pinned tools, kibi and this branch's knowledge base). Every later step only calls task targets.
inputs:
  tools:
    description: Also install Node, the pinned tools and kibi through `task setup:ci`
    required: false
    default: 'true'
  node:
    description: Also install Node when `tools` is false, for a job that needs only the npm packages
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Go (go.mod)
      if: hashFiles('go.mod') != ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          **/go.sum
          Taskfile.yml

    - name: Set up Go (no go.mod yet)
      if: hashFiles('go.mod') == ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: 1.27.4
        cache-dependency-path: Taskfile.yml

    # The pinned tools (.bin/: Go tools, the envtest API server and etcd, the flux CLI, CloudNativePG's manifest) are
    # cached by their pinned versions: every `*_VERSION` and checksum variable of the Taskfile plus go.mod's go and
    # toolchain lines, so a bump of any of them builds a new cache and nothing else does. The tool targets skip an
    # install whose binary is there at the pinned version (their `status`), so a hit makes `task setup:ci` almost
    # free and a miss costs what it did before. The e2e job's own state under .bin/e2e is never cached. The key
    # names the job, since jobs install different subsets and a cache is written once.
    - name: Hash the pinned tool versions
      id: tools-key
      shell: bash
      run: |
        sum="$({ grep -E '^  [A-Z0-9_]+_(VERSION|SHA256|SHA512)[A-Z0-9_]*:' Taskfile.yml; grep -E '^(go|toolchain) ' go.mod; } | sha256sum | cut -d' ' -f1)"
        echo "sum=$sum" >>"$GITHUB_OUTPUT"

    - name: Cache the pinned tools
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          .bin
          !.bin/e2e
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.tools-key.outputs.sum }}

    # The only tool installed outside a task target: Task must exist before any target can run.
    # The version is read from Taskfile.yml, so it stays pinned in one place.
    - name: Install Task
      shell: bash
      run: |
        version="$(sed -nE 's/^  TASK_VERSION: *([^ #]+).*/\1/p' Taskfile.yml)"
        GOBIN="$GITHUB_WORKSPACE/.bin" bash scripts/retry.sh go install "github.com/go-task/task/v3/cmd/task@${version}"
        echo "$GITHUB_WORKSPACE/.bin" >>"$GITHUB_PATH"

    # kibi compiles one store per branch and refuses to write on a detached HEAD, which is what
    # actions/checkout gives (a PR's merge ref, or a pushed commit). KIBI_BRANCH names the branch.
    - name: Name the kibi branch
      shell: bash
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: echo "KIBI_BRANCH=$BRANCH" >>"$GITHUB_ENV"

    - name: Set up Node
      if: inputs.tools == 'true' || inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # renovate: datasource=node-version depName=node
        node-version: 22.23.4
        cache: npm

    - name: task setup:ci
      if: inputs.tools == 'true'
      shell: bash
      run: task setup:ci
