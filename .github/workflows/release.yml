# Release workflow (docs/dev/sdlc.md#releases): started by hand, always plans and builds as a dry run first,
# and publishes only when dry_run is false, from main, by the repository owner.
#   beta:   YYYY.M.N-beta.K, signed images, the signed openfief CLI and a tag on a GitHub pre-release; publishes
#           the demo artifact, which a demo machine's Flux applies.
#   stable: YYYY.M.N, signed images, the signed openfief CLI, a tag and a GitHub release with the CRDs and
#           bootstrap install (packaged from deploy/).
# Order (D-88): the plugin images are built and signed first; the catalog job adds each to the catalog with the
# digest it signed, on a release commit; the other images and the CLI, which embed the catalog, are built from that
# commit, which the tag points at. A pull request brings the catalog commit back to main.
# Release notes come from Conventional Commits through scripts/release-notes.sh (task release:notes).
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [beta, stable]
        required: true
      version:
        description: YYYY.M.N for stable, YYYY.M.N-beta.K for beta (no v prefix)
        type: string
        required: true
      dry_run:
        description: Validate and build only; publish nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ !inputs.dry_run }}
    steps:
      - name: Only the owner publishes, from main
        if: ${{ !inputs.dry_run && (github.actor != github.repository_owner || github.ref != 'refs/heads/main') }}
        run: |
          echo "release: only $OWNER publishes, and only from main (actor $ACTOR, ref $REF); use dry_run" >&2
          exit 1
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release notes and the tag check need every commit and tag.
          fetch-depth: 0
          persist-credentials: false
      # Full tooling: release:assets builds the docs site, which needs kibi, Node packages and Hugo.
      - uses: ./.github/actions/setup
      - name: task release:check
        run: task release:check CHANNEL="$CHANNEL" VERSION="$VERSION"
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
      - name: task release:notes
        run: task release:notes VERSION="$VERSION" >>"$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}
      - name: task release:assets
        run: task release:assets VERSION="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

  plugin-images:
    name: plugin images
    needs: plan
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ needs.plan.outputs.publish == 'true' }}
      version: ${{ inputs.version }}
      kind: plugins

  catalog:
    # D-88: each first-party plugin enters the catalog with the digest this release signed. Publishing only: a
    # dry run pushes no image, so there is no signed digest to add.
    name: catalog
    needs: [plan, plugin-images]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push the release branch with the catalog commit
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the commit step pushes the release branch
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: dist/digests
          merge-multiple: true
      - name: task release:catalog
        run: task release:catalog VERSION="$VERSION" PREFIX="$PREFIX" DIGESTS=dist/digests VERIFY=1
        env:
          VERSION: ${{ inputs.version }}
          PREFIX: ghcr.io/${{ github.repository }}
      - name: Commit the catalog on release/${{ inputs.version }}
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/$VERSION"
          git add internal/plugins/catalog/plugins.json
          git commit -s -m "chore(release): catalog the first-party plugins of $VERSION (D-88)"
          git push origin "release/$VERSION"
          echo "ref=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

  images:
    name: images
    needs: [plan, catalog]
    # On a dry run the catalog job is skipped and the images build from this commit.
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ needs.plan.outputs.publish == 'true' }}
      version: ${{ inputs.version }}
      kind: commands
      ref: ${{ needs.catalog.outputs.ref }}

  cli:
    # The openfief CLI for Linux and macOS on amd64 and arm64, with an SBOM and keyless cosign signatures
    # (docs/dev/sdlc.md#releases), built from the release commit so it embeds the release's catalog.
    name: cli
    needs: [plan, catalog]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.catalog.outputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task release:cli
        run: task release:cli VERSION="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.plan.outputs.publish == 'true'
      - name: task release:cli:sign
        if: needs.plan.outputs.publish == 'true'
        run: task release:cli:sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/cli
          if-no-files-found: error

  publish:
    name: publish
    needs: [plan, catalog, images, cli]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # bring the catalog commit back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.catalog.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      # Full tooling: release:assets builds the docs site, which needs kibi, Node packages and Hugo.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist/cli
      - name: task release:publish
        run: task release:publish CHANNEL="$CHANNEL" VERSION="$VERSION"
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  deploy-demo:
    # Betas deploy to demo: the beta's signed digests are published as the demo's signed manifests artifact, and
    # Flux applies it. Skipped until the demo machine exists: see the deploy-demo job in ci.yml.
    name: deploy demo
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true' && inputs.channel == 'beta'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    with:
      version: ${{ inputs.version }}
