# Release workflow (docs/dev/sdlc.md#releases): started by hand, always plans and builds as a dry run first,
# and publishes only when dry_run is false, from main, by the repository owner.
#   alpha:  YYYY.M.N-alpha.K, published exactly like a beta.
#   beta:   YYYY.M.N-beta.K, a tag on a GitHub pre-release; publishes the demo artifact, which a demo machine's Flux
#           applies.
#   stable: YYYY.M.N, a tag on a GitHub release.
# A dry run (the default) runs every job but catalog and publish and publishes nothing: no tag, no GitHub release,
# no release branch, no pushed image or `latest`. It builds every image without pushing it, renders the bundle at
# placeholder digests and verifies the images main's last build signed with the identity the install guide gives,
# and builds the CLI and, when the owner started the run, signs it keylessly for real (a Rekor entry is all that
# leaves the run) and verifies it as the guide does, at the run's own ref. The bundle and CLI stay on the run as
# artifacts. Start one with
#   gh workflow run release.yml --ref main -f channel=alpha -f version=2026.11.0-alpha.1 -f dry_run=true
# Every channel ships signed images, the signed openfief CLI, the docs, and the bundle: the CRDs and the bootstrap
# install, each image pinned to the digest this run signed, the openfief-db database cluster, and CloudNativePG's
# release manifest, checked against the sha256 the Taskfile pins (task release:bundle).
# Order (D-88): the plugin images are built and signed first; the catalog job adds each to the catalog with the
# digest it signed, on a release commit; the other images and the CLI, which embed the catalog, are built from that
# commit, which the tag points at, and the bundle job pins the images' signed digests. A pull request brings the
# catalog commit back to main.
# Release notes come from Conventional Commits through scripts/release-notes.sh (task release:notes), with a Known
# limits section from .github/release-notes/<version>/known-limits.md when the release commit has one.
# Publishing is resumable: when publish fails part-way, "Re-run failed jobs" re-runs publish and deploy-demo on the
# same release commit; task release:publish (scripts/release-publish.sh) keeps a tag already at that commit, uploads
# only the assets an existing release lacks and opens no second pull request. Opening that pull request needs the
# repository setting "Allow GitHub Actions to create and approve pull requests" (docs/dev/pipeline.md#releases).
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [alpha, beta, stable]
        required: true
      version:
        description: YYYY.M.N for stable, YYYY.M.N-beta.K for beta, YYYY.M.N-alpha.K for alpha (no v prefix)
        type: string
        required: true
      dry_run:
        description: Validate and build only; publish nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ !inputs.dry_run }}
    steps:
      - name: Only the owner publishes, from main
        if: ${{ !inputs.dry_run && (github.actor != github.repository_owner || github.ref != 'refs/heads/main') }}
        run: |
          echo "release: only $OWNER publishes, and only from main (actor $ACTOR, ref $REF); use dry_run" >&2
          exit 1
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release notes and the tag check need every commit and tag.
          fetch-depth: 0
          persist-credentials: false
      # Full tooling: release:assets builds the docs site, which needs kibi, Node packages and Hugo.
      - uses: ./.github/actions/setup
      - name: task release:check
        run: task release:check CHANNEL="$CHANNEL" VERSION="$VERSION"
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
      - name: task release:notes
        run: task release:notes VERSION="$VERSION" >>"$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}
      - name: task release:assets
        run: task release:assets VERSION="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

  ui-browser:
    # The built-in UI's browser checks on the release ref (docs/dev/testing.md): a release needs them green, so
    # no image is built, signed or published until they pass.
    name: ui-browser
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/ui-browser.yml

  plugin-images:
    name: plugin images
    needs: [plan, ui-browser]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ needs.plan.outputs.publish == 'true' }}
      version: ${{ inputs.version }}
      kind: plugins

  catalog:
    # D-88: each first-party plugin enters the catalog with the digest this release signed. Publishing only: a
    # dry run pushes no image, so there is no signed digest to add.
    name: catalog
    needs: [plan, plugin-images]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push the release branch with the catalog commit
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the commit step pushes the release branch
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - uses: ./.github/actions/install-cosign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: dist/digests
          merge-multiple: true
      - name: task release:catalog
        run: task release:catalog VERSION="$VERSION" PREFIX="$PREFIX" DIGESTS=dist/digests VERIFY=1
        env:
          VERSION: ${{ inputs.version }}
          PREFIX: ghcr.io/${{ github.repository }}
      - name: Commit the catalog on release/${{ inputs.version }}
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "release/$VERSION" >/dev/null; then
            echo "::error::release/$VERSION already exists, so an earlier run made this release's catalog commit; re-run the failed jobs to resume"
            exit 1
          fi
          git switch -c "release/$VERSION"
          git add internal/plugins/catalog/plugins.json
          git commit -s -m "chore(release): catalog the first-party plugins of $VERSION (D-88)"
          git push origin "release/$VERSION"
          echo "ref=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

  images:
    name: images
    needs: [plan, catalog]
    # On a dry run the catalog job is skipped and the images build from this commit.
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ needs.plan.outputs.publish == 'true' }}
      version: ${{ inputs.version }}
      kind: commands
      ref: ${{ needs.catalog.outputs.ref }}

  bundle:
    # The CRDs and the bootstrap install (docs/dev/sdlc.md#releases), every image pinned to the digest images.yml
    # pushed and signed in this run: the digest-<name> artifacts of both image jobs; with the database it brings by
    # default, openfief-db, and CloudNativePG's release manifest, downloaded and checked against its pinned sha256. task release:bundle checks each
    # digest's keyless signature before it pins it. A dry run pushes nothing, so it pins all-zeros placeholders
    # instead and checks the rest of the bundle. Either way, task release:images:verify then checks the install's
    # images with the guide's identity (docs/guides/install.md): on a real run the pinned digests, on a dry run the
    # images tagged main, which images.yml signed on main's last build.
    name: bundle
    needs: [plan, catalog, images]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.catalog.outputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - uses: ./.github/actions/install-cosign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.publish == 'true'
        with:
          pattern: digest-*
          path: dist/digests
          merge-multiple: true
      - name: task release:bundle
        if: needs.plan.outputs.publish == 'true'
        run: task release:bundle VERSION="$VERSION" DIGESTS=dist/digests PREFIX="$PREFIX" VERIFY=1 REPO="$REPO"
        env:
          VERSION: ${{ inputs.version }}
          PREFIX: ghcr.io/${{ github.repository }}
          REPO: ${{ github.repository }}
      - name: task release:bundle (dry run, placeholder digests)
        if: needs.plan.outputs.publish != 'true'
        run: task release:bundle VERSION="$VERSION" PLACEHOLDER=1 PREFIX="$PREFIX"
        env:
          VERSION: ${{ inputs.version }}
          PREFIX: ghcr.io/${{ github.repository }}
      - name: task release:images:verify
        run: task release:images:verify FILE="dist/bundle/openfief-install-$VERSION.yaml" REPO="$REPO" TAG="$TAG"
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.publish != 'true' && 'main' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/bundle
          if-no-files-found: error

  cli:
    # The openfief CLI for Linux and macOS on amd64 and arm64, with an SBOM and keyless cosign signatures
    # (docs/dev/sdlc.md#releases), built from the release commit so it embeds the release's catalog. The owner's dry
    # run signs and verifies too, for real: the certificate names release.yml at the run's ref, and only Rekor
    # records it. Anyone else's dry run builds without signing, so release.yml's identity on main stays the owner's.
    name: cli
    needs: [plan, catalog]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.catalog.outputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task release:cli
        run: task release:cli VERSION="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: ./.github/actions/install-cosign
        if: github.actor == github.repository_owner
      - name: task release:cli:sign
        if: github.actor == github.repository_owner
        run: task release:cli:sign
      # As the install guide verifies it; a real run is from main (the plan job's guard), so REF is refs/heads/main.
      - name: task release:cli:verify
        if: github.actor == github.repository_owner
        run: task release:cli:verify REPO="$REPO" REF="$REF"
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/cli
          if-no-files-found: error

  publish:
    # Tags the release commit, publishes the release and opens the catalog's pull request, each only when an earlier
    # attempt of this run didn't, so re-running the failed jobs finishes a publish that stopped part-way.
    name: publish
    needs: [plan, catalog, images, bundle, cli]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # bring the catalog commit back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.catalog.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      # Full tooling: release:assets builds the docs site, which needs kibi, Node packages and Hugo.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: dist/cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist/bundle
      - name: task release:publish
        run: task release:publish CHANNEL="$CHANNEL" VERSION="$VERSION"
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  smoke:
    # The post-release smoke test (docs/dev/pipeline.md#releases): installs the release just published on a fresh
    # kind cluster from its GitHub release's assets, exactly as docs/guides/install.md says, through the first
    # passkey. It runs after publish, so a failure doesn't hold the release back; it marks this run failed, and
    # "Re-run failed jobs" runs it again on the same release.
    name: smoke test
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ inputs.version }}

  deploy-demo:
    # Alphas and betas deploy to demo (docs/dev/sdlc.md#releases): the pre-release's signed digests are published as
    # the demo's signed manifests artifact, and Flux applies it. Without a demo machine nothing pulls it: see the
    # deploy-demo job in ci.yml.
    name: deploy demo
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true' && inputs.channel != 'stable'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    with:
      version: ${{ inputs.version }}
