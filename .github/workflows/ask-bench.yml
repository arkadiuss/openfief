# The Ask box bench (D-217 to D-219): `task ask:bench` asks a real model, through OpenRouter, the bench's 28 questions in
# English and Polish five times each over the demo's synthetic portfolio, and fails unless every safety case (the
# refusals and the prompt injections) passed all five runs. It runs by hand (workflow_dispatch, with the model ids and a
# spending limit as inputs) and every Monday on main, to catch a provider changing behind a model's name (D-217).
# It is no part of ci.yml or `task check`: it spends money and needs the network, and the tests of the bench itself
# (tools/askbench) run in `task check` against a fake model. The secret OPENROUTER_API_KEY is the same key the model
# router's OpenRouter provider holds, and the bench sends it only to the provider; without the secret the run skips
# with a notice, so a fork or a repository that never set it stays green. The report is uploaded, pass or fail.
name: Ask box bench

on:
  workflow_dispatch:
    inputs:
      model:
        description: Comma-separated OpenRouter model ids; empty runs D-207's two candidates
        required: false
        default: ''
        type: string
      budget:
        description: The most to spend, in US dollars; the run aborts cleanly past it
        required: false
        default: '1.00'
        type: string
      judge:
        description: Also grade the advice cases with a judge model, reported only
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly, off the hour, outside the busy morning hours.
    - cron: '23 3 * * 1'

permissions: {}

concurrency:
  group: ask-bench
  cancel-in-progress: false

jobs:
  ask-bench:
    name: task ask:bench
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BENCH_MODEL: ${{ inputs.model }}
      BENCH_BUDGET: ${{ inputs.budget || '1.00' }}
      BENCH_JUDGE: ${{ inputs.judge && 'true' || 'false' }}
    steps:
      - name: Check for the provider key
        id: key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice title=Ask box bench skipped::The secret OPENROUTER_API_KEY is not set, so the bench has no model to ask. Add it to run the bench."
            echo "present=false" >>"$GITHUB_OUTPUT"
          else
            echo "present=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.key.outputs.present == 'true'
        with:
          # Go and Task are all the bench needs: it is `go run ./tools/askbench`.
          tools: 'false'
      - name: task ask:bench
        if: steps.key.outputs.present == 'true'
        run: |
          flags=()
          if [ "$BENCH_JUDGE" = true ]; then flags+=(-judge); fi
          task ask:bench MODEL="$BENCH_MODEL" BUDGET="$BENCH_BUDGET" OUT="$RUNNER_TEMP/ask-bench" -- "${flags[@]}"
          # a bench that exits non-zero fails the step, and the report below is uploaded either way
      - name: Summary
        if: always() && steps.key.outputs.present == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/ask-bench/summary.md" ]; then cat "$RUNNER_TEMP/ask-bench/summary.md" >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ask-bench-report
          path: ${{ runner.temp }}/ask-bench
          if-no-files-found: ignore
          retention-days: 90
