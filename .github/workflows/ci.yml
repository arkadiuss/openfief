# CI for pull requests and main (docs/dev/sdlc.md). Every step calls a task target; see Taskfile.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a PR run; runs on main always finish, so every merge is built and deployed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: task check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs:check compares ground rules against the base revision, so it needs history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: task check
        run: task check
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload the docs site
        # task check built it (docs:build); the docs job publishes it on pushes to main (docs/dev/docs.md).
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  docs:
    # Publishes the docs site to GitHub Pages from the same run that deploys the demo.
    # The owner sets Settings > Pages > Source to "GitHub Actions" and the custom domain docs.openfief.dev once.
    name: publish docs
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  test-pg:
    # PostgreSQL integration tests (every internal/*/postgres package). The ubuntu-24.04 image ships
    # PostgreSQL's binaries with the server stopped; task test:pg starts a throwaway cluster from them
    # on a Unix socket and removes it afterwards (scripts/test-pg.sh), so no service container is needed.
    name: task test:pg
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task test:pg
        run: task test:pg

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task dco
        run: task dco BASE="$BASE_SHA" HEAD="$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  e2e:
    # D-12: tested on kind and k3d. Both give a kubeconfig on 127.0.0.1, which task e2e accepts.
    name: e2e (${{ matrix.cluster }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cluster: [k3d, kind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: Create a k3d cluster
        if: matrix.cluster == 'k3d'
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79 # v2.4.0
        with:
          cluster-name: openfief-e2e
          args: --api-port 127.0.0.1:6550
          # renovate: datasource=github-releases depName=k3d-io/k3d
          k3d-version: v5.9.0
      - name: Create a kind cluster
        if: matrix.cluster == 'kind'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: openfief-e2e
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.33.0
      - name: task e2e
        run: task e2e

  images:
    # Multi-arch images with an SBOM, pushed and cosign-signed on main (D-17). Skipped while there is
    # no cmd/<name>/Dockerfile or plugins/<name>/Dockerfile; see images.yml.
    name: images
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ github.event_name == 'push' }}

  deploy-demo:
    # Deploys main to the Hetzner k3s demo environment (synthetic data only, GR-12) by GitOps pull: it publishes
    # deploy/demo/openfief, pinned to the signed image digests, as a signed OCI artifact that Flux on the machine
    # applies automatically. No cluster credential exists outside the machine. SKIPPED until the demo machine
    # exists. To enable it, the owner (docs/dev/demo.md#deploys):
    #   1. creates the GitHub Environment `demo` (Settings > Environments), deployment branches limited to main,
    #   2. creates the machine: task demo:up ENV=demo, or the Demo infrastructure workflow (demo-infra.yml),
    #   3. makes the GHCR packages public after the first push, so the cluster pulls without credentials,
    #   4. sets the repository variable DEMO_ENABLED=true.
    name: deploy demo
    if: github.event_name == 'push' && vars.DEMO_ENABLED == 'true'
    needs: [check, e2e, images]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
