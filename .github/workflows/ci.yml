# CI for pull requests and main (docs/dev/sdlc.md). Every step calls a task target; see Taskfile.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # By hand, on main: the same run as a push. all_images rebuilds and signs every image instead of carrying the
  # unchanged ones forward, the way out if the selector ever keeps an image it should have rebuilt.
  workflow_dispatch:
    inputs:
      all_images:
        description: Rebuild every image, changed or not
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a PR run; runs on main always finish, so every merge is built and deployed. Runs on
  # main queue one at a time, so an image carried forward never races its own build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # What this run can skip (tools/affected; docs/dev/pipeline.md#affected-checks): a pull request that changes
    # only docs and requirements skips the end-to-end and PostgreSQL jobs. Pushes to main run the whole suite.
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task ci:plan
        id: plan
        run: task ci:plan EVENT="$EVENT" BASE="$BASE" >>"$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}

  check:
    name: task check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs:check compares ground rules against the base revision, so it needs history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: task check
        run: task check
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  docs-build:
    # Builds the docs site that the docs job publishes, once both end-to-end runs passed, so kibi's requirements
    # report on the site shows their receipts (docs/dev/kibi.md). Each e2e job uploads the kibi.proof-run.v1
    # artifact `task e2e:prove` wrote; task kibi:ingest has kibi ingest them into this checkout of the same
    # commit, which kibi accepts only when the workspace snapshot matches the one the runs were made from.
    name: build docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-proof-*
          # Under .kb/proof/runs, which is ignored and which kibi leaves out of the workspace snapshot.
          path: .kb/proof/runs/ci
      - name: task kibi:ingest
        run: task kibi:ingest DIR=.kb/proof/runs/ci
      - name: task docs:build
        run: task docs:build
      - name: Upload the docs site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  docs:
    # Publishes the site docs-build built to GitHub Pages from the same run that deploys the demo.
    # The owner sets Settings > Pages > Source to "GitHub Actions" and the custom domain openfief.dev once.
    name: publish docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  test-pg:
    # PostgreSQL integration tests (every internal/*/postgres package). The ubuntu-24.04 image ships
    # PostgreSQL's binaries with the server stopped; task test:pg starts a throwaway cluster from them
    # on a Unix socket and removes it afterwards (scripts/test-pg.sh), so no service container is needed.
    name: task test:pg
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task test:pg
        run: task test:pg

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task dco
        run: task dco BASE="$BASE_SHA" HEAD="$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  e2e:
    # D-12: tested on kind and k3d. Both give a kubeconfig on 127.0.0.1, which task e2e accepts. The k3d cluster
    # is the demo machine's k3s: the same K3S_VERSION (task e2e:k3s-image), flannel with k3s's built-in
    # kube-router NetworkPolicy controller, the bundled Traefik and servicelb, and secrets encryption, as
    # deploy/demo/cloud-init.yaml configures it. kind's default CNI, kindnet, enforces NetworkPolicy too.
    # The suite (test/e2e) installs the demo's stack from this checkout's images and logs pods, events, specs,
    # policies, endpoints, plugins and logs on any failure: read the "diagnostics:" lines of the failing test.
    # task e2e:images also starts a registry container on the cluster's Docker network for the plugin images, which
    # the suite signs with a key made for the run, so the operator deploys them as it would an owner's (D-57).
    name: e2e (${{ matrix.cluster }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cluster: [k3d, kind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
          # The passkey test drives the runner's Chrome with playwright-core (task e2e installs the npm packages).
          node: 'true'
      - name: task e2e:k3s-image
        id: k3s
        if: matrix.cluster == 'k3d'
        run: echo "image=$(task e2e:k3s-image)" >>"$GITHUB_OUTPUT"
      - name: Create a k3d cluster
        if: matrix.cluster == 'k3d'
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79 # v2.4.0
        with:
          cluster-name: openfief-e2e
          args: >-
            --api-port 127.0.0.1:6550
            --image ${{ steps.k3s.outputs.image }}
            --k3s-arg --secrets-encryption@server:0
          # renovate: datasource=github-releases depName=k3d-io/k3d
          k3d-version: v5.9.0
      - name: Create a kind cluster
        if: matrix.cluster == 'kind'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: openfief-e2e
          # renovate: datasource=github-releases depName=kubernetes-sigs/kind
          version: v0.33.0
      - name: task e2e:images
        run: task e2e:images CLUSTER="$CLUSTER"
        env:
          CLUSTER: ${{ matrix.cluster }}
      # kibi prove runs task e2e and records a receipt on each end-to-end test (docs/dev/kibi.md); the run's
      # kibi.proof-run.v1 artifact goes to the docs-build job, which ingests it for the published report.
      - name: task e2e:prove
        run: task e2e:prove
      - name: Upload the proof run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-proof-${{ matrix.cluster }}
          path: .kb/proof/runs/e2e.json
          if-no-files-found: error
          retention-days: 7

  images:
    # Multi-arch images with an SBOM, pushed and cosign-signed on main (D-17). Only the images a change can
    # affect are built: on main, an unchanged image keeps the digest signed for an earlier commit, tagged for this
    # one; on a pull request, it isn't built (images.yml, select). all_images on a manual run builds them all.
    name: images
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      select: ${{ !(github.event_name == 'workflow_dispatch' && inputs.all_images) }}
      base: ${{ github.event.pull_request.base.sha || '' }}

  deploy-demo:
    # Deploys main to the Hetzner k3s demo environment (synthetic data only, GR-12) by GitOps pull: it publishes
    # deploy/demo/openfief, pinned to the signed image digests, as a signed OCI artifact that Flux on the machine
    # applies automatically. No cluster credential exists outside the machine. It runs on every push to main:
    # publishing the artifact is harmless without a machine (nothing pulls it), so there is no on/off variable.
    # To stop deploys, suspend Flux on the machine or remove the demo (task demo:down). docs/dev/demo.md#deploys
    name: deploy demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, e2e, images]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
