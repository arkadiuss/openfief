# Deploys to the Hetzner k3s demo environment (docs/dev/sdlc.md, docs/dev/demo.md#deploys): main from ci.yml,
# betas from release.yml. Callers run it on every push to main and every real beta; without a demo machine nothing pulls the artifact.
# GitOps pull: this job never reaches the cluster and no cluster credential exists outside it. It pins
# deploy/demo/openfief to the image digests whose keyless cosign signatures from images.yml on main verify (D-17),
# publishes the rendered manifests as an OCI artifact, and signs it keylessly. Flux on the demo machine applies
# the artifact tagged `demo` only if that signature comes from this workflow on main.
name: Deploy demo

on:
  workflow_call:
    inputs:
      version:
        description: Release version being deployed; empty for main (the images tagged sha-<short commit>)
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  deploy:
    name: deploy to demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: demo
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # push the manifests artifact to GHCR
      id-token: write # keyless cosign signature of the artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: task deploy:demo
        run: task deploy:demo TAG="${VERSION:-sha-${GITHUB_SHA::7}}" REPO="$GITHUB_REPOSITORY"
        env:
          VERSION: ${{ inputs.version }}
