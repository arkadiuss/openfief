# Builds every image CI knows about: multi-arch (amd64, arm64), with an SBOM and provenance, and when
# pushing, a keyless cosign signature on the digest (D-17) and the digest as an artifact (digest-<name>), which
# the release's catalog job reads (D-88). Called by ci.yml and release.yml; `kind` limits it to plugins/* or
# cmd/*, and `ref` builds another commit, such as the release commit that carries the catalog.
#
# Adding an image: put a Dockerfile at cmd/<name>/Dockerfile or plugins/<name>/Dockerfile (build context
# is the repository root). `task ci:images` discovers it and it is published as ghcr.io/<owner>/<repo>/<name>.
# While none exists, the build job is skipped, not failed.
name: Images

on:
  workflow_call:
    inputs:
      push:
        description: Push to GHCR and sign; false only builds
        type: boolean
        required: true
      version:
        description: Release version to tag the images with; empty tags them by commit and branch
        type: string
        required: false
        default: ''
      kind:
        description: Which images to build, all, plugins (plugins/*) or commands (cmd/*)
        type: string
        required: false
        default: all
      ref:
        description: Commit to build from; empty builds the commit that started the workflow
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  discover:
    name: discover images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: task ci:images
        id: list
        run: echo "images=$(task ci:images PREFIX="$PREFIX" KIND="$KIND")" >>"$GITHUB_OUTPUT"
        env:
          PREFIX: ghcr.io/${{ github.repository }}
          KIND: ${{ inputs.kind }}

  build:
    name: image (${{ matrix.name }})
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.push
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,format=short,enable=${{ inputs.version == '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=ref,event=pr
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: task image:sign
        if: inputs.push
        run: task image:sign IMAGE="$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
      # The release's catalog job (D-88) reads the digest each plugin image was signed at.
      - name: Record the signed digest
        if: inputs.push
        run: |
          mkdir -p dist/digests
          printf '%s\n' "$DIGEST" >"dist/digests/$NAME"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.push
        with:
          name: digest-${{ matrix.name }}
          path: dist/digests/${{ matrix.name }}
          if-no-files-found: error
