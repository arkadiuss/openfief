# The built-in UI in a browser over its in-memory fakes (task ui:browser, scripts/ui-browser.mjs): every main page
# at 360 and 390 px in light and dark and at desktop width, none scrolling sideways; the phone menu; installability;
# the service worker (docs/dev/testing.md). Not in task check, which must not need Chromium. Called by ci.yml, on
# every change that can affect the UI and every push to main, and by release.yml, which builds nothing until it
# passes. It drives the runner image's Chrome, as the e2e passkey test does (test/e2e/passkey.mjs), and uploads
# the screenshots, pass or fail.
name: UI browser checks

on:
  workflow_call:

permissions: {}

jobs:
  ui-browser:
    name: task ui:browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
          # playwright-core comes from the npm packages (task ui:browser installs them).
          node: 'true'
      - name: task ui:browser
        run: task ui:browser SHOTS="$RUNNER_TEMP/ui-shots"
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-browser-screenshots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
          retention-days: 7
