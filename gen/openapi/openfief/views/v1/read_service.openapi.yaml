openapi: 3.1.0
info:
  title: OpenFief read API
  version: v1
  description: >-
    The read-only REST/JSON API over OpenFief's record (D-6, D-50), transcoded from the same protobuf definitions as its Connect service. Money is {amount, currency} with the amount as a decimal string; dates are YYYY-MM-DD. Every request needs a bearer token.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A script token (D-27) or a plugin's projected ServiceAccount token.
  schemas:
    openfief.views.v1.Account:
      type: object
      properties:
        id:
          type: string
          title: id
        institution:
          type: string
          title: institution
        name:
          type: string
          title: name
        sleeve:
          type: string
          title: sleeve
          description: The ID of the account's sleeve.
        taxWrapper:
          type: string
          title: tax_wrapper
          description: |-
            The account's tax wrapper, a key of the jurisdiction pack, such as
             "taxable", "ike", "ikze" or "oki" (D-76).
        feeRule:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.FeeRule'
          title: fee_rule
          description: The fee rule its broker charges a sale (D-78); zero until set.
      title: Account
      additionalProperties: false
      description: Account is one account at an institution. It belongs to one sleeve.
    openfief.views.v1.AllocationDimension:
      type: string
      title: AllocationDimension
      enum:
        - ALLOCATION_DIMENSION_UNSPECIFIED
        - ALLOCATION_DIMENSION_ASSET_CLASS
        - ALLOCATION_DIMENSION_CURRENCY
        - ALLOCATION_DIMENSION_INSTITUTION
        - ALLOCATION_DIMENSION_SLEEVE
      description: AllocationDimension is what an allocation groups by.
    openfief.views.v1.AllocationGroup:
      type: object
      properties:
        key:
          type: string
          title: key
        valueReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: value_reporting
      title: AllocationGroup
      additionalProperties: false
      description: |-
        AllocationGroup is one group's value in the reporting currency. Its key is
         an asset class (cash, treasury_bond, listed), a currency code, an
         institution or a sleeve ID.
    openfief.views.v1.AssertionCheck:
      type: object
      properties:
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
        book:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Book'
          title: book
        reported:
          type: string
          title: reported
          description: A decimal string.
        derived:
          type: string
          title: derived
          description: A decimal string.
        status:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.AssertionStatus'
          title: status
      title: AssertionCheck
      additionalProperties: false
      description: |-
        AssertionCheck is a balance an institution reported on a date with the
         result of its latest check. Reported and derived are in the ledger
         account's unit: an amount of its currency for cash, units for a holding.
    openfief.views.v1.AssertionStatus:
      type: string
      title: AssertionStatus
      enum:
        - ASSERTION_STATUS_UNSPECIFIED
        - ASSERTION_STATUS_MATCHED
        - ASSERTION_STATUS_FLAGGED
      description: AssertionStatus is the result of checking a balance assertion.
    openfief.views.v1.BacktestDay:
      type: object
      properties:
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
        index:
          type: string
          title: index
          description: |-
            The backtest as an index, 100 on the response's from, as a decimal
             string.
      title: BacktestDay
      additionalProperties: false
      description: BacktestDay is the model portfolio's backtest at the end of one day.
    openfief.views.v1.Book:
      type: object
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.BookKind'
          title: kind
        currency:
          type: string
          title: currency
          description: Set for every kind but a holding.
        instrument:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Instrument'
          title: instrument
          description: Set for a holding only.
      title: Book
      additionalProperties: false
      description: |-
        Book is a ledger account inside an account: a holding names its
         instrument, every other kind its currency.
    openfief.views.v1.BookKind:
      type: string
      title: BookKind
      enum:
        - BOOK_KIND_UNSPECIFIED
        - BOOK_KIND_CASH
        - BOOK_KIND_HOLDING
        - BOOK_KIND_FEE
        - BOOK_KIND_WITHHOLDING_TAX
        - BOOK_KIND_FX
        - BOOK_KIND_EQUITY
      description: BookKind is the kind of a ledger account inside an account.
    openfief.views.v1.BrokerAccount:
      type: object
      properties:
        connectorInstance:
          type: string
          title: connector_instance
        id:
          type: string
          title: id
          description: |-
            The institution's own ID of the account, such as an IBKR Flex account
             ID.
        institution:
          type: string
          title: institution
        accountId:
          type: string
          title: account_id
          description: The OpenFief account it is mapped to; empty while it is unmapped.
        lastSeen:
          type: string
          title: last_seen
          description: The day a delivery last reported it, YYYY-MM-DD.
        inLastDelivery:
          type: boolean
          title: in_last_delivery
          description: |-
            Whether the instance's last delivery that reported broker accounts
             reported it.
      title: BrokerAccount
      additionalProperties: false
      description: |-
        BrokerAccount is one of the owner's accounts as the institution names it,
         as a connector instance reported it (D-72).
    openfief.views.v1.ConnectorBinding:
      type: object
      properties:
        connectorInstance:
          type: string
          title: connector_instance
        accountId:
          type: string
          title: account_id
      title: ConnectorBinding
      additionalProperties: false
      description: ConnectorBinding lets one connector instance write to one account.
    openfief.views.v1.DateTotal:
      type: object
      properties:
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
        valueReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: value_reporting
          description: The gross total, cash included.
        byCurrency:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Money'
          title: by_currency
        netReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: net_reporting
          description: |-
            The net and liquidation totals, cash included; unset when some valued
             holding or cash lacks that value.
        liquidationReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: liquidation_reporting
        cashReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: cash_reporting
          description: The cash in the totals.
        cashUnconverted:
          type: boolean
          title: cash_unconverted
          description: |-
            Some cash had no FX rate on or before the date and is in no total but
             by_currency.
      title: DateTotal
      additionalProperties: false
      description: |-
        DateTotal is the sum of the valued holdings and the cash on one date, in
         the reporting currency and per original currency, in currency order.
    openfief.views.v1.Drawdown:
      type: object
      properties:
        peakDate:
          type: string
          title: peak_date
          description: YYYY-MM-DD.
        troughDate:
          type: string
          title: trough_date
        peakValue:
          type: string
          title: peak_value
          description: The series' values on those days, as decimal strings.
        troughValue:
          type: string
          title: trough_value
        depth:
          type: string
          title: depth
          description: The fall as a fraction of the peak, such as "0.25" for 25%.
      title: Drawdown
      additionalProperties: false
      description: |-
        Drawdown is the worst fall of a series from a peak to a later trough. A
         series that never falls has depth "0" with its first day as both.
    openfief.views.v1.FeeRule:
      type: object
      properties:
        rate:
          type: string
          title: rate
        minimum:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: minimum
          description: Unset when the rule has no minimum.
        conversionRate:
          type: string
          title: conversion_rate
      title: FeeRule
      additionalProperties: false
      description: |-
        FeeRule is how an account's broker charges a sale (D-78): rate of the
         value sold, at least minimum, plus conversion_rate of the value for an
         instrument in a foreign currency. Rates are decimal fractions as strings.
    openfief.views.v1.GetAccountRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
      title: GetAccountRequest
      additionalProperties: false
    openfief.views.v1.GetAccountResponse:
      type: object
      properties:
        account:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Account'
          title: account
      title: GetAccountResponse
      additionalProperties: false
    openfief.views.v1.GetAllocationRequest:
      type: object
      properties:
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
        by:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.AllocationDimension'
          title: by
        value:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.ValueKind'
          title: value
          description: Which value to split; unspecified is gross.
      title: GetAllocationRequest
      additionalProperties: false
    openfief.views.v1.GetAllocationResponse:
      type: object
      properties:
        date:
          type: string
          title: date
        by:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.AllocationDimension'
          title: by
        value:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.ValueKind'
          title: value
          description: 'The value split, as resolved: never unspecified.'
        totalReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: total_reporting
          description: The sum of all groups, in the reporting currency.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.AllocationGroup'
          title: groups
          description: Largest value first, then by key.
        unvalued:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.UnvaluedHolding'
          title: unvalued
      title: GetAllocationResponse
      additionalProperties: false
    openfief.views.v1.GetModelPortfolioRequest:
      type: object
      properties:
        from:
          type: string
          title: from
          description: |-
            The first date of days, YYYY-MM-DD; empty, or a date before go-live,
             means go-live, the first transaction's date. The index is 100 on the
             first day of days.
        to:
          type: string
          title: to
          description: |-
            The last date, inclusive, YYYY-MM-DD; empty means the latest date any
             account is valued through. Nothing later is used.
      title: GetModelPortfolioRequest
      additionalProperties: false
    openfief.views.v1.GetModelPortfolioResponse:
      type: object
      properties:
        from:
          type: string
          title: from
          description: The range of days as resolved.
        to:
          type: string
          title: to
        targets:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.ModelTarget'
          title: targets
          description: The targets in the owner's order.
        backtestStart:
          type: string
          title: backtest_start
          description: |-
            The first and last day every target has history, both empty when some
             target has none or they don't overlap.
        backtestEnd:
          type: string
          title: backtest_end
        days:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.BacktestDay'
          title: days
          description: |-
            One per day from the later of from and backtest_start to the earlier of
             to and backtest_end, in date order, rebalanced to the weights at the
             end of each December 31.
        drawdown:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Drawdown'
          title: drawdown
          description: |-
            The model's max drawdown over its whole backtest, from backtest_start,
             in index points of a backtest that is 100 on backtest_start.
        targetHistories:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.ModelTargetHistory'
          title: target_histories
          description: Each target's history and max drawdown, in the owner's order.
        reportingCurrency:
          type: string
          title: reporting_currency
          description: The currency of the backtest and of the targets' values.
      title: GetModelPortfolioResponse
      additionalProperties: false
    openfief.views.v1.GetPerformanceRequest:
      type: object
      properties:
        from:
          type: string
          title: from
          description: |-
            The first date, YYYY-MM-DD; empty, or a date before go-live, means
             go-live. The index is 100 on it.
        to:
          type: string
          title: to
          description: |-
            The last date, inclusive, YYYY-MM-DD, at most 3700 days after from;
             empty means the latest date any account is valued through.
      title: GetPerformanceRequest
      additionalProperties: false
    openfief.views.v1.GetPerformanceResponse:
      type: object
      properties:
        from:
          type: string
          title: from
          description: |-
            The range asked for, as resolved; both empty when nothing is recorded
             yet.
        to:
          type: string
          title: to
        days:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.PerformanceDay'
          title: days
          description: One per day from from, in date order, up to to or the gap.
        gap:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.PerformanceGap'
          title: gap
          description: Why days ends before to; unspecified when it doesn't.
        revaluationPending:
          type: boolean
          title: revaluation_pending
          description: |-
            A revaluation of some account is pending or running, so the series
             may change.
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Transfer'
          title: transfers
          description: The confirmed transfers between the owner's accounts with a leg in the range.
        reportingCurrency:
          type: string
          title: reporting_currency
          description: The currency of every *_reporting value.
      title: GetPerformanceResponse
      additionalProperties: false
    openfief.views.v1.GetSettingsRequest:
      type: object
      title: GetSettingsRequest
      additionalProperties: false
    openfief.views.v1.GetSettingsResponse:
      type: object
      properties:
        reportingCurrency:
          type: string
          title: reporting_currency
          description: An ISO 4217 code, such as "PLN".
        numberFormat:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.NumberFormat'
          title: number_format
          description: The owner's number format, or the jurisdiction pack's default.
        numberFormatDefault:
          type: boolean
          title: number_format_default
          description: Whether number_format is the pack's default.
        taxWrappers:
          type: array
          items:
            type: string
          title: tax_wrappers
          description: The tax wrappers an account can have, the default first.
      title: GetSettingsResponse
      additionalProperties: false
    openfief.views.v1.GetValuationStatusRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
      title: GetValuationStatusRequest
      additionalProperties: false
    openfief.views.v1.GetValuationStatusResponse:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.ValuationStatus'
          title: status
      title: GetValuationStatusResponse
      additionalProperties: false
    openfief.views.v1.Holding:
      type: object
      properties:
        instrument:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Instrument'
          title: instrument
        quantity:
          type: string
          title: quantity
          description: A decimal string.
        noLongerUpdated:
          type: boolean
          title: no_longer_updated
          description: |-
            True when a transaction behind the holding came from a connector
             instance that is no longer installed (D-91): the holding is no longer
             updated. False while the core can't tell which instances are
             installed.
        removedInstances:
          type: array
          items:
            type: string
          title: removed_instances
          description: Those removed instances, in name order.
      title: Holding
      additionalProperties: false
      description: Holding is the quantity of one instrument held.
    openfief.views.v1.Instrument:
      type: object
      properties:
        isin:
          type: string
          title: isin
        symbol:
          type: string
          title: symbol
      title: Instrument
      additionalProperties: false
      description: 'Instrument is something that can be held: an ISIN plus a venue symbol.'
    openfief.views.v1.ListAccountValuationsRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        from:
          type: string
          title: from
          description: The first date of the range, YYYY-MM-DD.
        to:
          type: string
          title: to
          description: |-
            The last date of the range, inclusive, YYYY-MM-DD; at most 3700 days
             after from.
      title: ListAccountValuationsRequest
      additionalProperties: false
    openfief.views.v1.ListAccountValuationsResponse:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        from:
          type: string
          title: from
        to:
          type: string
          title: to
        valuations:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Valuation'
          title: valuations
          description: In date then instrument order.
        totals:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.DateTotal'
          title: totals
          description: One per date that has valuations, in date order.
        reportingCurrency:
          type: string
          title: reporting_currency
          description: The currency of every value_reporting.
      title: ListAccountValuationsResponse
      additionalProperties: false
    openfief.views.v1.ListAccountsRequest:
      type: object
      title: ListAccountsRequest
      additionalProperties: false
    openfief.views.v1.ListAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Account'
          title: accounts
      title: ListAccountsResponse
      additionalProperties: false
    openfief.views.v1.ListAssertionChecksRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        status:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.AssertionStatus'
          title: status
          description: Only checks with this status, such as flagged; unspecified for all.
      title: ListAssertionChecksRequest
      additionalProperties: false
    openfief.views.v1.ListAssertionChecksResponse:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        checks:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.AssertionCheck'
          title: checks
      title: ListAssertionChecksResponse
      additionalProperties: false
    openfief.views.v1.ListBrokerAccountsRequest:
      type: object
      properties:
        unmapped:
          type: boolean
          title: unmapped
          description: Only the broker accounts not mapped to an OpenFief account.
      title: ListBrokerAccountsRequest
      additionalProperties: false
    openfief.views.v1.ListBrokerAccountsResponse:
      type: object
      properties:
        brokerAccounts:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.BrokerAccount'
          title: broker_accounts
      title: ListBrokerAccountsResponse
      additionalProperties: false
    openfief.views.v1.ListCashRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
      title: ListCashRequest
      additionalProperties: false
    openfief.views.v1.ListCashResponse:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        date:
          type: string
          title: date
        balances:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Money'
          title: balances
      title: ListCashResponse
      additionalProperties: false
    openfief.views.v1.ListConnectorBindingsRequest:
      type: object
      title: ListConnectorBindingsRequest
      additionalProperties: false
    openfief.views.v1.ListConnectorBindingsResponse:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.ConnectorBinding'
          title: bindings
      title: ListConnectorBindingsResponse
      additionalProperties: false
    openfief.views.v1.ListHoldingsRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
      title: ListHoldingsRequest
      additionalProperties: false
    openfief.views.v1.ListHoldingsResponse:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        date:
          type: string
          title: date
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Holding'
          title: holdings
      title: ListHoldingsResponse
      additionalProperties: false
    openfief.views.v1.ListLotsRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
      title: ListLotsRequest
      additionalProperties: false
    openfief.views.v1.ListLotsResponse:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        date:
          type: string
          title: date
        lots:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Lot'
          title: lots
      title: ListLotsResponse
      additionalProperties: false
    openfief.views.v1.ListPluginsRequest:
      type: object
      title: ListPluginsRequest
      additionalProperties: false
      description: ListPluginsRequest has no parameters.
    openfief.views.v1.ListPluginsResponse:
      type: object
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Plugin'
          title: plugins
      title: ListPluginsResponse
      additionalProperties: false
      description: ListPluginsResponse lists the installed plugin instances.
    openfief.views.v1.ListPriceChecksRequest:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.PriceCheckStatus'
          title: status
          description: Only checks with this status, such as flagged; unspecified for all.
      title: ListPriceChecksRequest
      additionalProperties: false
    openfief.views.v1.ListPriceChecksResponse:
      type: object
      properties:
        threshold:
          type: string
          title: threshold
          description: |-
            The relative difference beyond which a check is flagged unless the
             owner set another for its instrument, as a decimal fraction: "0.01"
             (D-110); empty when this core compares no prices.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.PriceCheck'
          title: checks
      title: ListPriceChecksResponse
      additionalProperties: false
    openfief.views.v1.ListSleeveKindsRequest:
      type: object
      title: ListSleeveKindsRequest
      additionalProperties: false
    openfief.views.v1.ListSleeveKindsResponse:
      type: object
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.SleeveKind'
          title: kinds
      title: ListSleeveKindsResponse
      additionalProperties: false
    openfief.views.v1.ListSleevesRequest:
      type: object
      title: ListSleevesRequest
      additionalProperties: false
    openfief.views.v1.ListSleevesResponse:
      type: object
      properties:
        sleeves:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Sleeve'
          title: sleeves
      title: ListSleevesResponse
      additionalProperties: false
    openfief.views.v1.ListTransactionsRequest:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: The most transactions to return, 1 to 500; 0 means 100.
        pageToken:
          type: string
          title: page_token
          description: The next_page_token of the previous page; empty for the first page.
      title: ListTransactionsRequest
      additionalProperties: false
    openfief.views.v1.ListTransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Transaction'
          title: transactions
        nextPageToken:
          type: string
          title: next_page_token
          description: Pass as page_token to get the next page; empty on the last page.
      title: ListTransactionsResponse
      additionalProperties: false
    openfief.views.v1.ListTransfersRequest:
      type: object
      title: ListTransfersRequest
      additionalProperties: false
    openfief.views.v1.ListTransfersResponse:
      type: object
      properties:
        suggested:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Transfer'
          title: suggested
          description: Suggested pairs, in the withdrawals' date order.
        confirmed:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Transfer'
          title: confirmed
          description: 'Pairs the owner confirmed: neither leg is a cash flow.'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Transfer'
          title: rejected
          description: 'Pairs the owner rejected: both legs stay cash flows.'
      title: ListTransfersResponse
      additionalProperties: false
    openfief.views.v1.ListValuationStatusesRequest:
      type: object
      title: ListValuationStatusesRequest
      additionalProperties: false
    openfief.views.v1.ListValuationStatusesResponse:
      type: object
      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.ValuationStatus'
          title: statuses
      title: ListValuationStatusesResponse
      additionalProperties: false
    openfief.views.v1.ListValuationTotalsRequest:
      type: object
      properties:
        from:
          type: string
          title: from
          description: The first date of the range, YYYY-MM-DD.
        to:
          type: string
          title: to
          description: |-
            The last date of the range, inclusive, YYYY-MM-DD; at most 3700 days
             after from.
      title: ListValuationTotalsRequest
      additionalProperties: false
    openfief.views.v1.ListValuationTotalsResponse:
      type: object
      properties:
        from:
          type: string
          title: from
        to:
          type: string
          title: to
        totals:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.DateTotal'
          title: totals
          description: One per date that has valuations, in date order.
        reportingCurrency:
          type: string
          title: reporting_currency
          description: The currency of every value_reporting.
      title: ListValuationTotalsResponse
      additionalProperties: false
    openfief.views.v1.ListYearlyTaxesRequest:
      type: object
      properties:
        year:
          type: integer
          title: year
          format: int32
      title: ListYearlyTaxesRequest
      additionalProperties: false
    openfief.views.v1.ListYearlyTaxesResponse:
      type: object
      properties:
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.YearlyTax'
          title: taxes
      title: ListYearlyTaxesResponse
      additionalProperties: false
    openfief.views.v1.Lot:
      type: object
      properties:
        instrument:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Instrument'
          title: instrument
        opened:
          type: string
          title: opened
          description: YYYY-MM-DD.
        quantity:
          type: string
          title: quantity
          description: A decimal string.
        cost:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: cost
        opening:
          type: boolean
          title: opening
        originSource:
          type: string
          title: origin_source
          description: The key of the transaction that opened the lot.
        originExternalId:
          type: string
          title: origin_external_id
        noLongerUpdated:
          type: boolean
          title: no_longer_updated
          description: |-
            True when the transaction that opened the lot, or one that consumed
             part of it, came from a removed instance (D-91): the lot is no longer
             updated.
        removedInstances:
          type: array
          items:
            type: string
          title: removed_instances
          description: Those removed instances, in name order.
      title: Lot
      additionalProperties: false
      description: |-
        Lot is an open tax lot. An opening lot was seeded at go-live from what the
         institution reported held.
    openfief.views.v1.ModelHistoryGap:
      type: string
      title: ModelHistoryGap
      enum:
        - MODEL_HISTORY_GAP_UNSPECIFIED
        - MODEL_HISTORY_GAP_NO_CLOSES
        - MODEL_HISTORY_GAP_NO_FX_RATE
      description: |-
        ModelHistoryGap says why a target has no history in the reporting
         currency.
    openfief.views.v1.ModelTarget:
      type: object
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.ModelTargetKind'
          title: kind
        instrument:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Instrument'
          title: instrument
          description: An instrument target's instrument; unset for an index.
        index:
          type: string
          title: index
          description: |-
            An index target's name as the market-data connector names it, such as
             "WIG20"; empty for an instrument.
        currency:
          type: string
          title: currency
          description: |-
            An index target's currency, the one its levels are in; empty for an
             instrument, whose prices carry theirs.
        weightPercent:
          type: string
          title: weight_percent
          description: |-
            The weight in percent as a decimal string, such as "60". The weights
             sum to 100.
      title: ModelTarget
      additionalProperties: false
      description: |-
        ModelTarget is one instrument or index of the model portfolio, with its
         weight.
    openfief.views.v1.ModelTargetHistory:
      type: object
      properties:
        target:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.ModelTarget'
          title: target
        firstDate:
          type: string
          title: first_date
          description: YYYY-MM-DD; both empty when gap says why there is none.
        lastDate:
          type: string
          title: last_date
        gap:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.ModelHistoryGap'
          title: gap
        drawdown:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Drawdown'
          title: drawdown
          description: Values in reporting_currency per unit of the target.
      title: ModelTargetHistory
      additionalProperties: false
      description: |-
        ModelTargetHistory is one target's own history in the reporting currency:
         its value per unit from its first day with a close (and an FX rate) to its
         last close, and its max drawdown over it.
    openfief.views.v1.ModelTargetKind:
      type: string
      title: ModelTargetKind
      enum:
        - MODEL_TARGET_KIND_UNSPECIFIED
        - MODEL_TARGET_KIND_INSTRUMENT
        - MODEL_TARGET_KIND_INDEX
      description: ModelTargetKind says what a model portfolio target is.
    openfief.views.v1.Money:
      type: object
      properties:
        amount:
          type: string
          title: amount
          description: The amount as a decimal string, such as "-1234.56". Never a number.
        currency:
          type: string
          title: currency
          description: The ISO 4217 alphabetic code, such as "PLN".
      title: Money
      additionalProperties: false
      description: Money is an exact decimal amount in one currency.
    openfief.views.v1.NumberFormat:
      type: object
      properties:
        key:
          type: string
          title: key
          description: The format's key, such as "space-comma".
        groupSeparator:
          type: string
          title: group_separator
          description: |-
            The separator between groups of three integer digits: " ", ",", ".",
             "'" or "" for none.
        decimalSeparator:
          type: string
          title: decimal_separator
          description: 'The decimal separator: "," or ".".'
      title: NumberFormat
      additionalProperties: false
      description: 'NumberFormat is how amounts are written (D-113): only the separators.'
    openfief.views.v1.PerformanceDay:
      type: object
      properties:
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
        index:
          type: string
          title: index
          description: |-
            The time-weighted return since the first day as an index, 100 on the
             first day, as a decimal string: 105 means 5% up.
        valueReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: value_reporting
        holdingsReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: holdings_reporting
          description: The holdings at their stored valuations.
        cashReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: cash_reporting
          description: Every account's cash, converted at the FX rate for the day.
        inTransitReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: in_transit_reporting
          description: |-
            Money withdrawn from one account and not yet deposited into another;
             negative while the deposit is booked and the withdrawal not yet.
        flowReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: flow_reporting
          description: |-
            The day's net external cash flow: deposits, opening cash and opening
             lots in, withdrawals out. Taken at the end of the day.
      title: PerformanceDay
      additionalProperties: false
      description: |-
        PerformanceDay is the portfolio at the end of one day, in the reporting
         currency. value_reporting is holdings_reporting plus cash_reporting plus
         in_transit_reporting.
    openfief.views.v1.PerformanceGap:
      type: string
      title: PerformanceGap
      enum:
        - PERFORMANCE_GAP_UNSPECIFIED
        - PERFORMANCE_GAP_UNVALUED
        - PERFORMANCE_GAP_NO_FX_RATE
      description: |-
        PerformanceGap says why a performance series ends before the last date
         asked for.
    openfief.views.v1.Plugin:
      type: object
      properties:
        instance:
          type: string
          title: instance
          description: The instance's name, the name of its Plugin resource.
        image:
          type: string
          title: image
          description: The image reference, pinned by digest.
        imageDigest:
          type: string
          title: image_digest
          description: The image's digest, such as "sha256:...".
        capabilities:
          type: array
          items:
            type: string
          title: capabilities
          description: 'What the running version may act as: requested and granted (D-16).'
        requestedCapabilities:
          type: array
          items:
            type: string
          title: requested_capabilities
          description: What the image's signed manifest requests.
        trust:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.SignatureTrust'
          title: trust
        signer:
          type: string
          title: signer
          description: The trusted signer's name; empty unless a trusted signer signed it.
        trustReason:
          type: string
          title: trust_reason
          description: The operator's reason for the trust, such as "Verified" or "Unsigned".
        phase:
          type: string
          title: phase
          description: |-
            The operator's Ready reason, such as "Running" or "AwaitingApproval";
             "Removing" while it is being uninstalled, "Pending" before the operator
             reconciled it.
        ready:
          type: boolean
          title: ready
          description: Whether a version of it runs.
      title: Plugin
      additionalProperties: false
      description: Plugin is one installed plugin instance.
    openfief.views.v1.Posting:
      type: object
      properties:
        book:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Book'
          title: book
        amount:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: amount
        quantity:
          type: string
          title: quantity
          description: |-
            The units a posting to a holding moves, as a decimal string; empty for
             any other ledger account.
      title: Posting
      additionalProperties: false
      description: Posting is one leg of a transaction.
    openfief.views.v1.PriceCheck:
      type: object
      properties:
        date:
          type: string
          title: date
          description: The cross-check price's date, YYYY-MM-DD.
        instrument:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Instrument'
          title: instrument
        price:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: price
          description: The price holdings are valued at, from the market-data connector.
        priceSource:
          type: string
          title: price_source
          description: The connector instance the price came from.
        crossCheck:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: cross_check
          description: The institution's own price, such as IBKR's mark price.
        crossCheckSource:
          type: string
          title: cross_check_source
          description: The connector instance the cross-check price came from.
        relativeDifference:
          type: string
          title: relative_difference
          description: |-
            (cross_check - price) / price as a decimal string, rounded half-even
             to six places: "0.0123" is 1.23% above the price. Empty for a currency
             mismatch.
        status:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.PriceCheckStatus'
          title: status
        priceDate:
          type: string
          title: price_date
          description: |-
            The price's date, YYYY-MM-DD: the cross-check price's date or the
             latest one before it with a price (D-111).
        threshold:
          type: string
          title: threshold
          description: |-
            The relative difference beyond which this check is flagged, as a
             decimal fraction: "0.01", or the owner's threshold for the instrument
             (D-110).
        acknowledged:
          type: boolean
          title: acknowledged
          description: |-
            Whether the owner acknowledged this flagged check with these two
             prices (D-112).
      title: PriceCheck
      additionalProperties: false
      description: |-
        PriceCheck is an institution's own price of an instrument compared with
         the latest stored end-of-day price of the instrument on or before its
         date (D-22, D-111).
    openfief.views.v1.PriceCheckStatus:
      type: string
      title: PriceCheckStatus
      enum:
        - PRICE_CHECK_STATUS_UNSPECIFIED
        - PRICE_CHECK_STATUS_MATCHED
        - PRICE_CHECK_STATUS_FLAGGED
        - PRICE_CHECK_STATUS_CURRENCY_MISMATCH
      description: |-
        PriceCheckStatus is the result of comparing a price with a cross-check
         price.
    openfief.views.v1.SignatureTrust:
      type: string
      title: SignatureTrust
      enum:
        - SIGNATURE_TRUST_UNSPECIFIED
        - SIGNATURE_TRUST_VERIFIED
        - SIGNATURE_TRUST_OPENFIEF_CI
        - SIGNATURE_TRUST_PUBLISHER
        - SIGNATURE_TRUST_OWNER
        - SIGNATURE_TRUST_TRUSTED_SIGNER
        - SIGNATURE_TRUST_REFUSED
        - SIGNATURE_TRUST_NOT_CHECKED
      description: |-
        SignatureTrust is how far an installed plugin's image is trusted (D-45,
         D-56).
    openfief.views.v1.Sleeve:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        role:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.SleeveRole'
          title: role
        kind:
          type: string
          title: kind
          description: The key of the sleeve's kind, such as "core" or "agent-pool".
        roleOverride:
          type: boolean
          title: role_override
          description: |-
            The owner's explicit choice of a role other than the kind's default
             role (D-71).
      title: Sleeve
      additionalProperties: false
      description: Sleeve is a part of the portfolio with one role.
    openfief.views.v1.SleeveKind:
      type: object
      properties:
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        defaultRole:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.SleeveRole'
          title: default_role
      title: SleeveKind
      additionalProperties: false
      description: |-
        SleeveKind is a named category of sleeve with the role a sleeve of it
         gets by default, which never changes (D-71).
    openfief.views.v1.SleeveRole:
      type: string
      title: SleeveRole
      enum:
        - SLEEVE_ROLE_UNSPECIFIED
        - SLEEVE_ROLE_DEFENSIVE
        - SLEEVE_ROLE_OFFENSIVE
      description: SleeveRole is what a sleeve is for.
    openfief.views.v1.Transaction:
      type: object
      properties:
        source:
          type: string
          title: source
        externalId:
          type: string
          title: external_id
        kind:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.TransactionKind'
          title: kind
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
        lotOpened:
          type: string
          title: lot_opened
          description: |-
            The date an opening lot was acquired, YYYY-MM-DD; empty for any other
             kind.
        description:
          type: string
          title: description
        postings:
          type: array
          items:
            $ref: '#/components/schemas/openfief.views.v1.Posting'
          title: postings
        connectorInstance:
          type: string
          title: connector_instance
          description: |-
            The connector instance whose delivery brought the transaction in, read
             from its source; empty when no connector instance did.
        connectorInstanceRemoved:
          type: boolean
          title: connector_instance_removed
          description: |-
            True when that instance is no longer installed (D-58). The transaction
             stays; reinstalling the instance under the same name continues from it.
             False while the core can't tell which instances are installed.
      title: Transaction
      additionalProperties: false
      description: |-
        Transaction is the current version of one economic event, keyed by its
         source and the institution's own ID.
    openfief.views.v1.TransactionKind:
      type: string
      title: TransactionKind
      enum:
        - TRANSACTION_KIND_UNSPECIFIED
        - TRANSACTION_KIND_BUY
        - TRANSACTION_KIND_SELL
        - TRANSACTION_KIND_DIVIDEND
        - TRANSACTION_KIND_FEE
        - TRANSACTION_KIND_FX_CONVERSION
        - TRANSACTION_KIND_DEPOSIT
        - TRANSACTION_KIND_WITHDRAWAL
        - TRANSACTION_KIND_OPENING_LOT
        - TRANSACTION_KIND_INTEREST
      description: TransactionKind is what kind of economic event a transaction is.
    openfief.views.v1.Transfer:
      type: object
      properties:
        withdrawalAccountId:
          type: string
          title: withdrawal_account_id
        withdrawalDate:
          type: string
          title: withdrawal_date
          description: YYYY-MM-DD.
        depositAccountId:
          type: string
          title: deposit_account_id
        depositDate:
          type: string
          title: deposit_date
          description: YYYY-MM-DD.
        amount:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: amount
        withdrawalSource:
          type: string
          title: withdrawal_source
          description: The legs' transaction keys, as ListTransactions gives them.
        withdrawalExternalId:
          type: string
          title: withdrawal_external_id
        depositSource:
          type: string
          title: deposit_source
        depositExternalId:
          type: string
          title: deposit_external_id
      title: Transfer
      additionalProperties: false
      description: |-
        Transfer is a withdrawal from one of the owner's accounts paired with a
         deposit of the same amount and currency into another, at most five days
         apart (D-105): suggested, or confirmed or rejected by the owner.
    openfief.views.v1.UnvaluedHolding:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        instrument:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Instrument'
          title: instrument
          description: Unset for cash.
        quantity:
          type: string
          title: quantity
          description: A decimal string; empty for cash.
        missing:
          type: string
          title: missing
          description: What the value lacks, such as "price", "fx_rate" or "marginal_rate".
        cash:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: cash
          description: The cash left out; unset for a holding.
      title: UnvaluedHolding
      additionalProperties: false
      description: |-
        UnvaluedHolding is a holding, or an account's cash, without the value
         asked for on the date, left out of the allocation.
    openfief.views.v1.Valuation:
      type: object
      properties:
        date:
          type: string
          title: date
          description: YYYY-MM-DD.
        instrument:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Instrument'
          title: instrument
        basis:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.ValuationBasis'
          title: basis
        source:
          type: string
          title: source
        value:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: value
          description: The gross value.
        valueReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: value_reporting
        netReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: net_reporting
          description: Unset when net_missing says why.
        liquidationReporting:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: liquidation_reporting
          description: Unset when liquidation_missing says why.
        netMissing:
          type: string
          title: net_missing
          description: 'Why the net value is missing: "fx_rate" or "lots"; empty when it isn''t.'
        liquidationMissing:
          type: string
          title: liquidation_missing
          description: |-
            Why the liquidation value is missing: "fx_rate", "lots" or
             "marginal_rate"; empty when it isn't.
      title: Valuation
      additionalProperties: false
      description: |-
        Valuation is the stored value of a holding on a date, with its basis and
         source: its gross value in its original currency and in the reporting
         currency, and its net and liquidation values (D-77).
    openfief.views.v1.ValuationBasis:
      type: string
      title: ValuationBasis
      enum:
        - VALUATION_BASIS_UNSPECIFIED
        - VALUATION_BASIS_MARKET
        - VALUATION_BASIS_GROSS_ACCRUED
        - VALUATION_BASIS_NET_IF_REDEEMED
      description: ValuationBasis says how a holding's gross value was found.
    openfief.views.v1.ValuationStatus:
      type: object
      properties:
        accountId:
          type: string
          title: account_id
        valuedThrough:
          type: string
          title: valued_through
          description: |-
            The last date the account's valuations are complete for, YYYY-MM-DD;
             empty until it has been valued.
        pending:
          type: boolean
          title: pending
          description: A revaluation is queued and not started.
        running:
          type: boolean
          title: running
          description: A revaluation is in progress.
      title: ValuationStatus
      additionalProperties: false
      description: ValuationStatus says how current an account's stored valuations are.
    openfief.views.v1.ValueKind:
      type: string
      title: ValueKind
      enum:
        - VALUE_KIND_UNSPECIFIED
        - VALUE_KIND_GROSS
        - VALUE_KIND_NET
        - VALUE_KIND_LIQUIDATION
      description: ValueKind is one of the three values of D-77.
    openfief.views.v1.YearlyTax:
      type: object
      properties:
        taxWrapper:
          type: string
          title: tax_wrapper
        year:
          type: integer
          title: year
          format: int32
        inForce:
          type: boolean
          title: in_force
          description: |-
            Whether the law that levies it is in force in the year; when false,
             nothing below is set.
        days:
          type: integer
          title: days
          format: int32
          description: The days the average was taken over.
        average:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: average
        limit:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: limit
          description: |-
            The balance up to which nothing is taxed, and the rate of the part
             above it, as a decimal fraction.
        rate:
          type: string
          title: rate
        excess:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: excess
        tax:
          allOf:
            - $ref: '#/components/schemas/openfief.views.v1.Money'
          title: tax
      title: YearlyTax
      additionalProperties: false
      description: |-
        YearlyTax is a tax wrapper's tax for one year on the average balance of
         its accounts (D-76).
paths:
  /v1/accounts:
    get:
      tags:
        - ReadService
      summary: ListAccounts
      description: ListAccounts returns every account, in ID order.
      operationId: openfief.views.v1.ReadService.ListAccounts
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListAccountsResponse'
  /v1/accounts/{accountId}:
    get:
      tags:
        - ReadService
      summary: GetAccount
      description: GetAccount returns one account.
      operationId: openfief.views.v1.ReadService.GetAccount
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.GetAccountResponse'
  /v1/accounts/{accountId}/balance-assertions:
    get:
      tags:
        - ReadService
      summary: ListAssertionChecks
      description: |-
        ListAssertionChecks returns an account's balance assertions with the
         result of their latest check, in date then ledger account order. A
         flagged check is an error for the owner to resolve.
      operationId: openfief.views.v1.ReadService.ListAssertionChecks
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
        - name: status
          in: query
          description: Only checks with this status, such as flagged; unspecified for all.
          schema:
            allOf:
              - $ref: '#/components/schemas/openfief.views.v1.AssertionStatus'
            title: status
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListAssertionChecksResponse'
  /v1/accounts/{accountId}/cash:
    get:
      tags:
        - ReadService
      summary: ListCash
      description: |-
        ListCash returns an account's non-zero cash at the end of a date, one
         balance per currency, in currency order.
      operationId: openfief.views.v1.ReadService.ListCash
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
        - name: date
          in: query
          description: YYYY-MM-DD.
          schema:
            type: string
            title: date
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListCashResponse'
  /v1/accounts/{accountId}/holdings:
    get:
      tags:
        - ReadService
      summary: ListHoldings
      description: |-
        ListHoldings returns an account's non-zero holdings at the end of a date,
         in ISIN then venue symbol order, each marked as no longer updated when
         a transaction behind it came from a removed instance (D-91).
      operationId: openfief.views.v1.ReadService.ListHoldings
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
        - name: date
          in: query
          description: YYYY-MM-DD.
          schema:
            type: string
            title: date
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListHoldingsResponse'
  /v1/accounts/{accountId}/lots:
    get:
      tags:
        - ReadService
      summary: ListLots
      description: |-
        ListLots returns an account's open tax lots at the end of a date, per
         instrument, oldest first, each marked as no longer updated when a
         transaction behind it came from a removed instance (D-91).
      operationId: openfief.views.v1.ReadService.ListLots
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
        - name: date
          in: query
          description: YYYY-MM-DD.
          schema:
            type: string
            title: date
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListLotsResponse'
  /v1/accounts/{accountId}/transactions:
    get:
      tags:
        - ReadService
      summary: ListTransactions
      description: |-
        ListTransactions returns one page of the current version of each of an
         account's transactions, in date then key order. Superseded versions are
         left out.
      operationId: openfief.views.v1.ReadService.ListTransactions
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
        - name: pageSize
          in: query
          description: The most transactions to return, 1 to 500; 0 means 100.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: pageToken
          in: query
          description: The next_page_token of the previous page; empty for the first page.
          schema:
            type: string
            title: page_token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListTransactionsResponse'
  /v1/accounts/{accountId}/valuation-status:
    get:
      tags:
        - ReadService
      summary: GetValuationStatus
      description: |-
        GetValuationStatus returns the date an account is valued through and
         whether a revaluation is pending or running (D-36).
      operationId: openfief.views.v1.ReadService.GetValuationStatus
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.GetValuationStatusResponse'
  /v1/accounts/{accountId}/valuations:
    get:
      tags:
        - ReadService
      summary: ListAccountValuations
      description: |-
        ListAccountValuations returns an account's stored valuations in a date
         range, each with its three values (D-77), and its totals per date with
         its cash (D-106).
      operationId: openfief.views.v1.ReadService.ListAccountValuations
      parameters:
        - name: accountId
          in: path
          description: The accountId path parameter.
          required: true
          schema:
            type: string
            title: account_id
        - name: from
          in: query
          description: The first date of the range, YYYY-MM-DD.
          schema:
            type: string
            title: from
        - name: to
          in: query
          description: |-
            The last date of the range, inclusive, YYYY-MM-DD; at most 3700 days
             after from.
          schema:
            type: string
            title: to
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListAccountValuationsResponse'
  /v1/allocation:
    get:
      tags:
        - ReadService
      summary: GetAllocation
      description: |-
        GetAllocation returns the portfolio's gross, net or liquidation value
         (D-77) on a date in the reporting currency, split by asset class,
         currency, institution or sleeve (D-30). Holdings count at their stored
         valuation on the date and cash at the FX rate for the date, in its
         account's tax wrapper; holdings and cash without that value are listed
         as unvalued, with the reason.
      operationId: openfief.views.v1.ReadService.GetAllocation
      parameters:
        - name: date
          in: query
          description: YYYY-MM-DD.
          schema:
            type: string
            title: date
        - name: by
          in: query
          description: The by query parameter.
          schema:
            allOf:
              - $ref: '#/components/schemas/openfief.views.v1.AllocationDimension'
            title: by
        - name: value
          in: query
          description: Which value to split; unspecified is gross.
          schema:
            allOf:
              - $ref: '#/components/schemas/openfief.views.v1.ValueKind'
            title: value
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.GetAllocationResponse'
  /v1/broker-accounts:
    get:
      tags:
        - ReadService
      summary: ListBrokerAccounts
      description: |-
        ListBrokerAccounts returns the broker accounts connector instances
         reported (D-72), in instance then ID order, each with the account it is
         mapped to. Nothing of an unmapped broker account is booked.
      operationId: openfief.views.v1.ReadService.ListBrokerAccounts
      parameters:
        - name: unmapped
          in: query
          description: Only the broker accounts not mapped to an OpenFief account.
          schema:
            type: boolean
            title: unmapped
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListBrokerAccountsResponse'
  /v1/connector-bindings:
    get:
      tags:
        - ReadService
      summary: ListConnectorBindings
      description: |-
        ListConnectorBindings returns every connector binding: which connector
         instance may write to which account, in instance then account order.
      operationId: openfief.views.v1.ReadService.ListConnectorBindings
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListConnectorBindingsResponse'
  /v1/model-portfolio:
    get:
      tags:
        - ReadService
      summary: GetModelPortfolio
      description: |-
        GetModelPortfolio returns the model portfolio (D-52) with its backtest
         (D-53) as an index that starts at 100 on go-live, like the
         performance series, and the max drawdown of the model and of each
         target (D-54), in the reporting currency. While the model portfolio is
         off it fails with NOT_FOUND and says nothing about it.
      operationId: openfief.views.v1.ReadService.GetModelPortfolio
      parameters:
        - name: from
          in: query
          description: |-
            The first date of days, YYYY-MM-DD; empty, or a date before go-live,
             means go-live, the first transaction's date. The index is 100 on the
             first day of days.
          schema:
            type: string
            title: from
        - name: to
          in: query
          description: |-
            The last date, inclusive, YYYY-MM-DD; empty means the latest date any
             account is valued through. Nothing later is used.
          schema:
            type: string
            title: to
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.GetModelPortfolioResponse'
  /v1/performance:
    get:
      tags:
        - ReadService
      summary: GetPerformance
      description: |-
        GetPerformance returns the portfolio's time-weighted return per day
         (D-61) as an index that starts at 100, with the portfolio's value
         including cash, in the reporting currency. Deposits and withdrawals are
         not performance; transfers between the owner's own accounts that the
         owner confirmed (D-105) are not cash flows. The series stops at the last
         day every account is valued for, and says why.
      operationId: openfief.views.v1.ReadService.GetPerformance
      parameters:
        - name: from
          in: query
          description: |-
            The first date, YYYY-MM-DD; empty, or a date before go-live, means
             go-live. The index is 100 on it.
          schema:
            type: string
            title: from
        - name: to
          in: query
          description: |-
            The last date, inclusive, YYYY-MM-DD, at most 3700 days after from;
             empty means the latest date any account is valued through.
          schema:
            type: string
            title: to
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.GetPerformanceResponse'
  /v1/plugins:
    get:
      tags:
        - ReadService
      summary: ListPlugins
      description: |-
        ListPlugins returns the installed plugin instances (D-46, D-48), in
         name order, each with what it may do and how far its image's signature
         is trusted (D-56), as the operator recorded them. It only reads: nothing
         in this API installs, removes or approves a plugin. It fails with
         UNAVAILABLE when the core can't read the cluster.
      operationId: openfief.views.v1.ReadService.ListPlugins
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListPluginsResponse'
  /v1/price-checks:
    get:
      tags:
        - ReadService
      summary: ListPriceChecks
      description: |-
        ListPriceChecks returns every institution's own price, such as IBKR's
         mark price, compared with the latest stored price of its instrument on
         or before its date (D-22, D-111), in date, instrument and cross-check
         source order, each with the threshold it was flagged at (D-110) and
         whether the owner acknowledged it (D-112). A flagged check is for the
         owner to look at; it changes no price or valuation.
      operationId: openfief.views.v1.ReadService.ListPriceChecks
      parameters:
        - name: status
          in: query
          description: Only checks with this status, such as flagged; unspecified for all.
          schema:
            allOf:
              - $ref: '#/components/schemas/openfief.views.v1.PriceCheckStatus'
            title: status
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListPriceChecksResponse'
  /v1/settings:
    get:
      tags:
        - ReadService
      summary: GetSettings
      description: |-
        GetSettings returns the settings every reader writes the record with:
         the reporting currency (D-62), the number format (D-113) and the tax
         wrappers an account can have (D-76).
      operationId: openfief.views.v1.ReadService.GetSettings
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.GetSettingsResponse'
  /v1/sleeve-kinds:
    get:
      tags:
        - ReadService
      summary: ListSleeveKinds
      description: ListSleeveKinds returns every sleeve kind, in key order (D-71).
      operationId: openfief.views.v1.ReadService.ListSleeveKinds
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListSleeveKindsResponse'
  /v1/sleeves:
    get:
      tags:
        - ReadService
      summary: ListSleeves
      description: ListSleeves returns every sleeve, in ID order.
      operationId: openfief.views.v1.ReadService.ListSleeves
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListSleevesResponse'
  /v1/transfers:
    get:
      tags:
        - ReadService
      summary: ListTransfers
      description: |-
        ListTransfers returns the transfers between the owner's own accounts
         (D-105): those suggested for the owner to confirm or reject, and the
         pairs the owner confirmed or rejected. A withdrawal is suggested with
         the nearest deposit in date into another account of exactly the same
         amount and currency, at most five calendar days apart, that is not
         already taken or rejected with it. Only confirmed transfers are left out
         of the performance's cash flows. Decisions are made through the owner's
         TransferService, not here.
      operationId: openfief.views.v1.ReadService.ListTransfers
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListTransfersResponse'
  /v1/valuation-status:
    get:
      tags:
        - ReadService
      summary: ListValuationStatuses
      description: |-
        ListValuationStatuses returns every account's valuation status, in
         account ID order.
      operationId: openfief.views.v1.ReadService.ListValuationStatuses
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListValuationStatusesResponse'
  /v1/valuations:
    get:
      tags:
        - ReadService
      summary: ListValuationTotals
      description: |-
        ListValuationTotals returns the whole portfolio's value per date in a
         date range, its three values (D-77) summed over every account's stored
         valuations and cash (D-106).
      operationId: openfief.views.v1.ReadService.ListValuationTotals
      parameters:
        - name: from
          in: query
          description: The first date of the range, YYYY-MM-DD.
          schema:
            type: string
            title: from
        - name: to
          in: query
          description: |-
            The last date of the range, inclusive, YYYY-MM-DD; at most 3700 days
             after from.
          schema:
            type: string
            title: to
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListValuationTotalsResponse'
  /v1/yearly-taxes:
    get:
      tags:
        - ReadService
      summary: ListYearlyTaxes
      description: |-
        ListYearlyTaxes returns, for one year, the yearly tax of each tax
         wrapper taxed on its balance, such as OKI's (D-76), summed over every
         account in it. A tax whose law isn't in force that year says so and
         carries no amounts.
      operationId: openfief.views.v1.ReadService.ListYearlyTaxes
      parameters:
        - name: year
          in: query
          description: The year query parameter.
          schema:
            type: integer
            title: year
            format: int32
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/openfief.views.v1.ListYearlyTaxesResponse'
tags:
  - name: ReadService
    description: |-
      ReadService reads the record: sleeves, accounts, transactions, holdings,
       tax lots, cash, balance assertions, valuations, price checks, the
       allocation and the portfolio's performance.
