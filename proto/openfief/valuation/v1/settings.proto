// OpenFief's owner settings contract (docs/DESIGN.md D-62, D-78, D-79,
// D-113, D-167).
//
// The owner's settings that are not an account's terms: the number format
// the built-in UI writes amounts in (D-113), shown next to the reporting
// currency (D-62), the owner's marginal personal income tax rate, which
// taxes an early withdrawal from IKZE (D-78), and the charts' start the
// owner chose (D-138), the portfolio's and each account's (D-167). The
// read API serves the reporting currency and the number format to any
// reader (ReadService.GetSettings), and the charts' start the owner chose
// with the performance (ReadService.GetPerformance); this service is the
// owner's entry service for changing them (D-79).
//
// The core serves SettingsService to VIEW plugins only, next to the
// AuthService. Calling conventions are the AuthService's
// (proto/openfief/identity/v1/auth.proto):
// - Every call carries the view plugin's projected ServiceAccount token
//   (audience openfief-core, D-27) as "Authorization: Bearer <token>"; a
//   call without one, or from a plugin that is not a view plugin, fails
//   with PERMISSION_DENIED.
// - Every request carries origin and the owner's session_token. A missing,
//   unknown, expired or revoked session fails with UNAUTHENTICATED; a
//   read-scoped session, or an origin off the core's allow-list, fails with
//   PERMISSION_DENIED.
// - A number format key that is not one of number_formats, a marginal rate
//   that is not a decimal above 0 and below 1, or a charts' start that is
//   not a YYYY-MM-DD date, fails with INVALID_ARGUMENT and nothing changes.
// - SetEarlyRedemptionFee for an ISIN whose series terms are not stored
//   fails with NOT_FOUND; without a fee, for a series whose fee is not
//   assumed, with FAILED_PRECONDITION; a fee that is not a decimal of zero
//   or more, with INVALID_ARGUMENT. Nothing changes then.
// - A charts' start of an account the owner may not change (D-163) fails
//   with PERMISSION_DENIED, whether it is stored or not; one of an account
//   that is not stored, with NOT_FOUND.
syntax = "proto3";

package openfief.valuation.v1;

// SettingsService reads and changes the owner's settings.
service SettingsService {
  // GetOwnerSettings returns every setting to the owner.
  rpc GetOwnerSettings(GetOwnerSettingsRequest) returns (GetOwnerSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetNumberFormat makes a number format the owner's. It revalues
  // nothing.
  rpc SetNumberFormat(SetNumberFormatRequest) returns (SetNumberFormatResponse);

  // SetMarginalRate sets the owner's marginal income tax rate. Every
  // account is revalued (D-36), since an IKZE's liquidation value depends
  // on it.
  rpc SetMarginalRate(SetMarginalRateRequest) returns (SetMarginalRateResponse);

  // SetExemptionClass classifies an instrument for a yearly tax's exemptions
  // when the jurisdiction pack can't (D-132), such as a fund whose policy
  // it can't read. The choice stays with the instrument; setting it again
  // replaces it. It revalues nothing: the yearly tax is computed when read.
  rpc SetExemptionClass(SetExemptionClassRequest) returns (SetExemptionClassResponse);

  // SetEarlyRedemptionFee confirms or overrides a treasury bond series'
  // early-redemption fee (D-97). Without a fee it confirms the fee assumed
  // from the reviewed table's latest issue letter for a series sold after
  // the month the table was reviewed through: the same fee becomes the
  // owner's, and nothing is revalued. With a fee it replaces the series'
  // fee, whatever it came from, and every account that held the series is
  // revalued. Either way the attention item asking to confirm the fee
  // clears.
  rpc SetEarlyRedemptionFee(SetEarlyRedemptionFeeRequest) returns (SetEarlyRedemptionFeeResponse);

  // SetChartStart stores the day the time charts start on (D-138) as the
  // owner's setting (D-167): the portfolio's, or one account's. An empty
  // start clears the setting, so the charts start on their default again.
  // It revalues nothing.
  rpc SetChartStart(SetChartStartRequest) returns (SetChartStartResponse);
}

// NumberFormat is how amounts are written (D-113): only the separators.
message NumberFormat {
  // The format's key, such as "space-comma".
  string key = 1;
  // The separator between groups of three integer digits: " ", ",", ".",
  // "'" or "" for none.
  string group_separator = 2;
  // The decimal separator: "," or ".".
  string decimal_separator = 3;
}

message GetOwnerSettingsRequest {
  string origin = 1;
  string session_token = 2;
}

message GetOwnerSettingsResponse {
  // The reporting currency (D-62), an ISO 4217 code such as "PLN".
  string reporting_currency = 1;
  // The owner's number format, or the jurisdiction pack's default.
  NumberFormat number_format = 2;
  // Whether number_format is the pack's default, not the owner's choice.
  bool number_format_default = 3;
  // The number formats the owner can choose from.
  repeated NumberFormat number_formats = 4;
  // The tax wrappers an account can have, the default first (D-76).
  repeated string tax_wrappers = 5;
  // The owner's marginal income tax rate as a decimal fraction, such as
  // "0.32"; empty until the owner sets it.
  string marginal_rate = 6;
  // The exemption classes the owner can classify an instrument in for OKI's
  // yearly tax (D-127), such as "savings"; empty when no wrapper has one.
  repeated string exemption_classes = 7;
  // The owner's classifications, in ISIN order.
  repeated InstrumentClass instrument_classes = 8;
}

// InstrumentClass is the owner's class of one instrument (D-132).
message InstrumentClass {
  // The instrument's ISIN.
  string isin = 1;
  // One of GetOwnerSettingsResponse.exemption_classes.
  string exemption_class = 2;
}

message SetExemptionClassRequest {
  string origin = 1;
  string session_token = 2;
  // The instrument's ISIN.
  string isin = 3;
  // One of GetOwnerSettingsResponse.exemption_classes.
  string exemption_class = 4;
}

message SetExemptionClassResponse {}

message SetNumberFormatRequest {
  string origin = 1;
  string session_token = 2;
  // The key of one of GetOwnerSettingsResponse.number_formats.
  string key = 3;
}

message SetNumberFormatResponse {
  NumberFormat number_format = 1;
}

message SetMarginalRateRequest {
  string origin = 1;
  string session_token = 2;
  // A decimal fraction above 0 and below 1, such as "0.32".
  string rate = 3;
}

message SetMarginalRateResponse {}

message SetChartStartRequest {
  string origin = 1;
  string session_token = 2;
  // The account whose charts start on start, by its ID; empty for the
  // portfolio's charts.
  string account_id = 3;
  // The day the charts start on, YYYY-MM-DD; empty goes back to the
  // default (D-138) and clears the setting.
  string start = 4;
}

message SetChartStartResponse {}

message SetEarlyRedemptionFeeRequest {
  string origin = 1;
  string session_token = 2;
  // The treasury bond series' ISIN, as stored with its terms.
  string isin = 3;
  // The fee per bond in PLN, a decimal string of zero or more, such as
  // "3.00"; empty confirms the assumed fee.
  string fee = 4;
}

message SetEarlyRedemptionFeeResponse {}
