// OpenFief's account entry contract (docs/DESIGN.md D-72, D-73, D-76,
// D-78, D-79).
//
// The owner creates accounts in the built-in UI, in the first-run wizard
// (D-73) and later: each account's institution, name and sleeve, the
// connector instance that feeds it, and, for a broker connector, the broker
// account it is, picked from those the connector reported, so the owner
// never types an account number (D-72), with the account's tax wrapper
// (D-76) and the fee rule its broker charges a sale (D-78). The UI hands
// them to the core
// through AccountService, one owner-only service for this kind of entry
// (D-79). The read API (D-6) stays read-only: it lists accounts and
// connector bindings. Broker account numbers are listed only here, for
// setting up accounts, so read sessions, script tokens and plugins never
// see one (D-121). The owner can delete an account with no transactions,
// and remap a broker account whose account has no transactions from it
// (D-120); nothing the ledger holds is ever deleted (D-18).
//
// Calling conventions are the AuthService's
// (proto/openfief/identity/v1/auth.proto), as in bond_lots.proto:
// - Every call carries the view plugin's projected ServiceAccount token
//   (audience openfief-core, D-27) as "Authorization: Bearer <token>"; a
//   call without one, or from a plugin that is not a view plugin, fails
//   with PERMISSION_DENIED.
// - Every request carries origin and the owner's session_token. A missing,
//   unknown, expired or revoked session fails with UNAUTHENTICATED; a
//   read-scoped session, or an origin off the core's allow-list, fails with
//   PERMISSION_DENIED.
// - The core makes an account's ID from its name, as lowercase hyphenated
//   words. A name it can make no ID from, an empty institution, an unknown
//   sleeve, a tax wrapper the jurisdiction pack doesn't have, a fee rule
//   whose rates aren't decimal fractions from 0 up to 1 or whose minimum
//   is negative or has no currency, a paid-out payout setting on an
//   account that is not at the "treasury-bonds" institution (D-135), or a
//   malformed instance name fails with INVALID_ARGUMENT; a name
//   whose ID is taken with ALREADY_EXISTS; an unknown account with
//   NOT_FOUND; a broker account the instance never reported, or one mapped
//   to another account, with FAILED_PRECONDITION. Nothing is stored then.
// - Deleting an account that holds transactions, or remapping a broker
//   account whose account holds transactions from it, fails with
//   FAILED_PRECONDITION and changes nothing.
syntax = "proto3";

package openfief.ingest.v1;

// AccountService creates and changes the owner's accounts and connects
// them to the connector instances that feed them.
service AccountService {
  // CreateAccount creates an account and, when a connector instance is
  // given, binds it to the account, and maps the broker account to it.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);

  // UpdateAccount renames an account, moves it to another sleeve, or
  // changes its tax wrapper or fee rule, which revalues it (D-36), or the
  // payout setting of a hand-entered bond account (D-135); its ID and
  // institution stay.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);

  // BindAccount binds a connector instance to a stored account, as
  // `core connector bind` does, and maps the broker account to it when one
  // is given. Binding again changes nothing.
  rpc BindAccount(BindAccountRequest) returns (BindAccountResponse);

  // ListBrokerAccounts returns the broker accounts connector instances
  // reported (D-72), in instance then ID order, each with the account it
  // is mapped to, for setting up accounts. Only the owner sees them
  // (D-121).
  rpc ListBrokerAccounts(ListBrokerAccountsRequest) returns (ListBrokerAccountsResponse);

  // DeleteAccount deletes an account that holds no transactions, with its
  // connector bindings, its broker account mappings and its tax wrapper
  // and fee rule (D-120). An account with transactions stays.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // RemapBrokerAccount maps a broker account to another account, or
  // leaves it unmapped, while the account it is mapped to holds no
  // transactions from its connector instance (D-120). The instance is
  // bound to the new account.
  rpc RemapBrokerAccount(RemapBrokerAccountRequest) returns (RemapBrokerAccountResponse);
}

// Account is one account at an institution, in one sleeve.
message Account {
  string id = 1;
  string institution = 2;
  string name = 3;
  // The ID of the account's sleeve.
  string sleeve = 4;
  // The account's tax wrapper, a key of the jurisdiction pack, such as
  // "taxable", "ike", "ikze" or "oki" (D-76).
  string tax_wrapper = 5;
  // The fee rule its broker charges a sale (D-78); all zero until set.
  FeeRule fee_rule = 6;
  // What happens to the coupons and maturities of a hand-entered bond
  // account (D-135); BOND_PAYOUT_CASH for every other account.
  BondPayout bond_payout = 7;
  // The day bond_payout took effect, YYYY-MM-DD; empty when it never
  // changed.
  string bond_payout_since = 8;
}

// BondPayout is the payout setting of a hand-entered bond account
// (D-135), matching the option the bond registry offers. Only an account
// at the "treasury-bonds" institution may be paid out; asking for it on
// another fails with INVALID_ARGUMENT. A change takes effect on the day
// it is made: a coupon or maturity follows the setting in force on the
// day it falls due.
enum BondPayout {
  // In a request, keeps the account's setting; a new account's is
  // BOND_PAYOUT_CASH.
  BOND_PAYOUT_UNSPECIFIED = 0;
  // Coupons and maturities stay as the account's cash.
  BOND_PAYOUT_CASH = 1;
  // Each coupon and maturity is booked, then withdrawn: a withdrawal of
  // the same amount on the same day, so the account's cash matches the
  // registry and the payout still counts as return.
  BOND_PAYOUT_PAID_OUT = 2;
}

// FeeRule is how an account's broker charges a sale (D-78): rate of the
// value sold, at least minimum, plus conversion_rate of the value for an
// instrument in a foreign currency. Rates are decimal fractions as
// strings: "0.0029" is 0.29%.
message FeeRule {
  string rate = 1;
  // The minimum as a decimal string; "0" or empty for none.
  string minimum = 2;
  // The minimum's ISO 4217 currency; empty when there is no minimum.
  string minimum_currency = 3;
  string conversion_rate = 4;
}

message CreateAccountRequest {
  string origin = 1;
  string session_token = 2;
  string name = 3;
  // The institution's ID, such as "ibkr" or "treasury-bonds". Empty takes
  // the broker account's institution, as its connector reported it.
  string institution = 4;
  // The ID of a stored sleeve.
  string sleeve = 5;
  // The connector instance that feeds the account (D-48); empty for none
  // yet.
  string connector_instance = 6;
  // A broker account connector_instance reported, mapped to the new
  // account; empty for a connector that names OpenFief accounts itself.
  string broker_account = 7;
  // The account's tax wrapper (D-76); empty takes the pack's default,
  // "taxable" for Poland.
  string tax_wrapper = 8;
  // The fee rule (D-78); unset for the zero rule.
  FeeRule fee_rule = 9;
  // The payout setting (D-135); unspecified for BOND_PAYOUT_CASH.
  BondPayout bond_payout = 10;
}

message CreateAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  string origin = 1;
  string session_token = 2;
  string account_id = 3;
  string name = 4;
  string sleeve = 5;
  // The new tax wrapper; empty keeps the account's.
  string tax_wrapper = 6;
  // The new fee rule; unset keeps the account's.
  FeeRule fee_rule = 7;
  // The new payout setting (D-135); unspecified keeps the account's.
  BondPayout bond_payout = 8;
}

message UpdateAccountResponse {
  Account account = 1;
}

message BindAccountRequest {
  string origin = 1;
  string session_token = 2;
  string account_id = 3;
  string connector_instance = 4;
  // A broker account connector_instance reported, or empty.
  string broker_account = 5;
}

message BindAccountResponse {}

// BrokerAccount is one of the owner's accounts as the institution names it,
// as a connector instance reported it (D-72).
message BrokerAccount {
  string connector_instance = 1;
  // The institution's own ID of the account, such as an IBKR Flex account
  // ID.
  string id = 2;
  string institution = 3;
  // The OpenFief account it is mapped to; empty while it is unmapped.
  string account_id = 4;
  // The day a delivery last reported it, YYYY-MM-DD.
  string last_seen = 5;
  // Whether the instance's last delivery that reported broker accounts
  // reported it.
  bool in_last_delivery = 6;
}

message ListBrokerAccountsRequest {
  string origin = 1;
  string session_token = 2;
  // Only the broker accounts not mapped to an OpenFief account.
  bool unmapped = 3;
}

message ListBrokerAccountsResponse {
  repeated BrokerAccount broker_accounts = 1;
}

message DeleteAccountRequest {
  string origin = 1;
  string session_token = 2;
  string account_id = 3;
}

message DeleteAccountResponse {}

message RemapBrokerAccountRequest {
  string origin = 1;
  string session_token = 2;
  string connector_instance = 3;
  // The broker account, one connector_instance reported.
  string broker_account = 4;
  // The stored account to map it to; empty leaves it unmapped.
  string account_id = 5;
}

message RemapBrokerAccountResponse {}
