// OpenFief's public read API (docs/DESIGN.md D-6, D-50): read-only, served
// as Connect and, through transcoding, as REST under /v1. Data enters only
// through connectors' ingest paths, never through this API (D-7), so every
// method only reads and declares no side effects.
//
// Conventions:
// - Money is a Money message: an exact decimal amount as a string, never a
//   number, with its ISO 4217 currency code. Quantities are decimal strings.
// - Dates are calendar dates as strings, YYYY-MM-DD, with no time of day.
// - Every amount keeps its original currency (D-20); totals, valuations and
//   the allocation also carry their value in the reporting currency (D-62).
syntax = "proto3";

package openfief.views.v1;

import "google/api/annotations.proto";

// ReadService reads the record: sleeves, accounts, transactions, holdings,
// tax lots, cash, balance assertions, valuations, price checks, the
// allocation and the portfolio's performance.
service ReadService {
  // ListSleeves returns every sleeve, in ID order.
  rpc ListSleeves(ListSleevesRequest) returns (ListSleevesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/sleeves"};
  }

  // ListSleeveKinds returns every sleeve kind, in key order (D-71).
  rpc ListSleeveKinds(ListSleeveKindsRequest) returns (ListSleeveKindsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/sleeve-kinds"};
  }

  // ListAccounts returns every account, in ID order.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts"};
  }

  // ListConnectorBindings returns every connector binding: which connector
  // instance may write to which account, in instance then account order.
  rpc ListConnectorBindings(ListConnectorBindingsRequest) returns (ListConnectorBindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/connector-bindings"};
  }

  // ListBrokerAccounts returns the broker accounts connector instances
  // reported (D-72), in instance then ID order, each with the account it is
  // mapped to. Nothing of an unmapped broker account is booked.
  rpc ListBrokerAccounts(ListBrokerAccountsRequest) returns (ListBrokerAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/broker-accounts"};
  }

  // GetAccount returns one account.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}"};
  }

  // ListTransactions returns one page of the current version of each of an
  // account's transactions, in date then key order. Superseded versions are
  // left out.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}/transactions"};
  }

  // ListHoldings returns an account's non-zero holdings at the end of a date,
  // in ISIN then venue symbol order.
  rpc ListHoldings(ListHoldingsRequest) returns (ListHoldingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}/holdings"};
  }

  // ListLots returns an account's open tax lots at the end of a date, per
  // instrument, oldest first.
  rpc ListLots(ListLotsRequest) returns (ListLotsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}/lots"};
  }

  // ListCash returns an account's non-zero cash at the end of a date, one
  // balance per currency, in currency order.
  rpc ListCash(ListCashRequest) returns (ListCashResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}/cash"};
  }

  // ListAssertionChecks returns an account's balance assertions with the
  // result of their latest check, in date then ledger account order. A
  // flagged check is an error for the owner to resolve.
  rpc ListAssertionChecks(ListAssertionChecksRequest) returns (ListAssertionChecksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}/balance-assertions"};
  }

  // ListAccountValuations returns an account's stored valuations in a date
  // range, with their totals per date.
  rpc ListAccountValuations(ListAccountValuationsRequest) returns (ListAccountValuationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}/valuations"};
  }

  // GetValuationStatus returns the date an account is valued through and
  // whether a revaluation is pending or running (D-36).
  rpc GetValuationStatus(GetValuationStatusRequest) returns (GetValuationStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/accounts/{account_id}/valuation-status"};
  }

  // ListValuationTotals returns the whole portfolio's value per date in a
  // date range, summed over every account's stored valuations.
  rpc ListValuationTotals(ListValuationTotalsRequest) returns (ListValuationTotalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/valuations"};
  }

  // ListValuationStatuses returns every account's valuation status, in
  // account ID order.
  rpc ListValuationStatuses(ListValuationStatusesRequest) returns (ListValuationStatusesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/valuation-status"};
  }

  // ListPriceChecks returns every institution's own price, such as IBKR's
  // mark price, compared with the latest stored price of its instrument on
  // or before its date (D-22, D-111), in date, instrument and cross-check
  // source order, each with the threshold it was flagged at (D-110) and
  // whether the owner acknowledged it (D-112). A flagged check is for the
  // owner to look at; it changes no price or valuation.
  rpc ListPriceChecks(ListPriceChecksRequest) returns (ListPriceChecksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/price-checks"};
  }

  // GetAllocation returns the portfolio's value on a date in the reporting
  // currency, split by asset class, currency, institution or sleeve (D-30).
  // Holdings count at their stored valuation on the date and cash at the FX
  // rate for the date; holdings without a valuation are listed as unvalued.
  rpc GetAllocation(GetAllocationRequest) returns (GetAllocationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/allocation"};
  }

  // GetPerformance returns the portfolio's time-weighted return per day
  // (D-61) as an index that starts at 100, with the portfolio's value
  // including cash, in the reporting currency. Deposits and withdrawals are
  // not performance; transfers between the owner's own accounts are not cash
  // flows. The series stops at the last day every account is valued for,
  // and says why.
  rpc GetPerformance(GetPerformanceRequest) returns (GetPerformanceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/performance"};
  }

  // GetModelPortfolio returns the model portfolio (D-52) with its backtest
  // (D-53) as an index that starts at 100 on go-live, like the
  // performance series, and the max drawdown of the model and of each
  // target (D-54), in the reporting currency. While the model portfolio is
  // off it fails with NOT_FOUND and says nothing about it.
  rpc GetModelPortfolio(GetModelPortfolioRequest) returns (GetModelPortfolioResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/model-portfolio"};
  }

  // ListPlugins returns the installed plugin instances (D-46, D-48), in
  // name order, each with what it may do and how far its image's signature
  // is trusted (D-56), as the operator recorded them. It only reads: nothing
  // in this API installs, removes or approves a plugin. It fails with
  // UNAVAILABLE when the core can't read the cluster.
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/plugins"};
  }
}

// Money is an exact decimal amount in one currency.
message Money {
  // The amount as a decimal string, such as "-1234.56". Never a number.
  string amount = 1;
  // The ISO 4217 alphabetic code, such as "PLN".
  string currency = 2;
}

// Instrument is something that can be held: an ISIN plus a venue symbol.
message Instrument {
  string isin = 1;
  string symbol = 2;
}

// SleeveRole is what a sleeve is for.
enum SleeveRole {
  SLEEVE_ROLE_UNSPECIFIED = 0;
  // Never available to agents.
  SLEEVE_ROLE_DEFENSIVE = 1;
  // The sleeve fiefs are leased from.
  SLEEVE_ROLE_OFFENSIVE = 2;
}

// Sleeve is a part of the portfolio with one role.
message Sleeve {
  string id = 1;
  string name = 2;
  SleeveRole role = 3;
  // The key of the sleeve's kind, such as "core" or "agent-pool".
  string kind = 4;
  // The owner's explicit choice of a role other than the kind's default
  // role (D-71).
  bool role_override = 5;
}

// SleeveKind is a named category of sleeve with the role a sleeve of it
// gets by default, which never changes (D-71).
message SleeveKind {
  string key = 1;
  string name = 2;
  SleeveRole default_role = 3;
}

// ConnectorBinding lets one connector instance write to one account.
message ConnectorBinding {
  string connector_instance = 1;
  string account_id = 2;
}

// BrokerAccount is one of the owner's accounts as the institution names it,
// as a connector instance reported it (D-72).
message BrokerAccount {
  string connector_instance = 1;
  // The institution's own ID of the account, such as an IBKR Flex account
  // ID.
  string id = 2;
  string institution = 3;
  // The OpenFief account it is mapped to; empty while it is unmapped.
  string account_id = 4;
  // The day a delivery last reported it, YYYY-MM-DD.
  string last_seen = 5;
  // Whether the instance's last delivery that reported broker accounts
  // reported it.
  bool in_last_delivery = 6;
}

// Account is one account at an institution. It belongs to one sleeve.
message Account {
  string id = 1;
  string institution = 2;
  string name = 3;
  // The ID of the account's sleeve.
  string sleeve = 4;
}

// BookKind is the kind of a ledger account inside an account.
enum BookKind {
  BOOK_KIND_UNSPECIFIED = 0;
  BOOK_KIND_CASH = 1;
  BOOK_KIND_HOLDING = 2;
  BOOK_KIND_FEE = 3;
  BOOK_KIND_WITHHOLDING_TAX = 4;
  BOOK_KIND_FX = 5;
  BOOK_KIND_EQUITY = 6;
}

// Book is a ledger account inside an account: a holding names its
// instrument, every other kind its currency.
message Book {
  BookKind kind = 1;
  // Set for every kind but a holding.
  string currency = 2;
  // Set for a holding only.
  Instrument instrument = 3;
}

// Posting is one leg of a transaction.
message Posting {
  Book book = 1;
  Money amount = 2;
  // The units a posting to a holding moves, as a decimal string; empty for
  // any other ledger account.
  string quantity = 3;
}

// TransactionKind is what kind of economic event a transaction is.
enum TransactionKind {
  TRANSACTION_KIND_UNSPECIFIED = 0;
  TRANSACTION_KIND_BUY = 1;
  TRANSACTION_KIND_SELL = 2;
  TRANSACTION_KIND_DIVIDEND = 3;
  TRANSACTION_KIND_FEE = 4;
  TRANSACTION_KIND_FX_CONVERSION = 5;
  TRANSACTION_KIND_DEPOSIT = 6;
  TRANSACTION_KIND_WITHDRAWAL = 7;
  TRANSACTION_KIND_OPENING_LOT = 8;
}

// Transaction is the current version of one economic event, keyed by its
// source and the institution's own ID.
message Transaction {
  string source = 1;
  string external_id = 2;
  TransactionKind kind = 3;
  // YYYY-MM-DD.
  string date = 4;
  // The date an opening lot was acquired, YYYY-MM-DD; empty for any other
  // kind.
  string lot_opened = 5;
  string description = 6;
  repeated Posting postings = 7;
  // The connector instance whose delivery brought the transaction in, read
  // from its source; empty when no connector instance did.
  string connector_instance = 8;
  // True when that instance is no longer installed (D-58). The transaction
  // stays; reinstalling the instance under the same name continues from it.
  // False while the core can't tell which instances are installed.
  bool connector_instance_removed = 9;
}

// Holding is the quantity of one instrument held.
message Holding {
  Instrument instrument = 1;
  // A decimal string.
  string quantity = 2;
}

// Lot is an open tax lot. An opening lot was seeded at go-live from what the
// institution reported held.
message Lot {
  Instrument instrument = 1;
  // YYYY-MM-DD.
  string opened = 2;
  // A decimal string.
  string quantity = 3;
  Money cost = 4;
  bool opening = 5;
  // The key of the transaction that opened the lot.
  string origin_source = 6;
  string origin_external_id = 7;
}

// AssertionStatus is the result of checking a balance assertion.
enum AssertionStatus {
  ASSERTION_STATUS_UNSPECIFIED = 0;
  // The derived balance equals the reported one.
  ASSERTION_STATUS_MATCHED = 1;
  // They differ: an error for the owner to resolve.
  ASSERTION_STATUS_FLAGGED = 2;
}

// AssertionCheck is a balance an institution reported on a date with the
// result of its latest check. Reported and derived are in the ledger
// account's unit: an amount of its currency for cash, units for a holding.
message AssertionCheck {
  // YYYY-MM-DD.
  string date = 1;
  Book book = 2;
  // A decimal string.
  string reported = 3;
  // A decimal string.
  string derived = 4;
  AssertionStatus status = 5;
}

// ValuationBasis says which value of a holding a valuation is.
enum ValuationBasis {
  VALUATION_BASIS_UNSPECIFIED = 0;
  VALUATION_BASIS_MARKET = 1;
  VALUATION_BASIS_GROSS_ACCRUED = 2;
  VALUATION_BASIS_NET_IF_REDEEMED = 3;
}

// Valuation is the stored value of a holding on a date, with its basis and
// source, in its original currency and in the reporting currency.
message Valuation {
  // YYYY-MM-DD.
  string date = 1;
  Instrument instrument = 2;
  ValuationBasis basis = 3;
  string source = 4;
  Money value = 5;
  Money value_reporting = 6;
}

// DateTotal is the sum of the valuations dated on one date, in the
// reporting currency and per original currency, in currency order.
message DateTotal {
  // YYYY-MM-DD.
  string date = 1;
  Money value_reporting = 2;
  repeated Money by_currency = 3;
}

// ValuationStatus says how current an account's stored valuations are.
message ValuationStatus {
  string account_id = 1;
  // The last date the account's valuations are complete for, YYYY-MM-DD;
  // empty until it has been valued.
  string valued_through = 2;
  // A revaluation is queued and not started.
  bool pending = 3;
  // A revaluation is in progress.
  bool running = 4;
}

// PriceCheckStatus is the result of comparing a price with a cross-check
// price.
enum PriceCheckStatus {
  PRICE_CHECK_STATUS_UNSPECIFIED = 0;
  // Within the threshold.
  PRICE_CHECK_STATUS_MATCHED = 1;
  // Beyond the threshold, in either direction.
  PRICE_CHECK_STATUS_FLAGGED = 2;
  // The two prices are in different currencies, so the market-data
  // connector may price another listing than the one held (D-111); no
  // difference is computed.
  PRICE_CHECK_STATUS_CURRENCY_MISMATCH = 3;
}

// PriceCheck is an institution's own price of an instrument compared with
// the latest stored end-of-day price of the instrument on or before its
// date (D-22, D-111).
message PriceCheck {
  // The cross-check price's date, YYYY-MM-DD.
  string date = 1;
  Instrument instrument = 2;
  // The price holdings are valued at, from the market-data connector.
  Money price = 3;
  // The connector instance the price came from.
  string price_source = 4;
  // The institution's own price, such as IBKR's mark price.
  Money cross_check = 5;
  // The connector instance the cross-check price came from.
  string cross_check_source = 6;
  // (cross_check - price) / price as a decimal string, rounded half-even
  // to six places: "0.0123" is 1.23% above the price. Empty for a currency
  // mismatch.
  string relative_difference = 7;
  PriceCheckStatus status = 8;
  // The price's date, YYYY-MM-DD: the cross-check price's date or the
  // latest one before it with a price (D-111).
  string price_date = 9;
  // The relative difference beyond which this check is flagged, as a
  // decimal fraction: "0.01", or the owner's threshold for the instrument
  // (D-110).
  string threshold = 10;
  // Whether the owner acknowledged this flagged check with these two
  // prices (D-112).
  bool acknowledged = 11;
}

// AllocationDimension is what an allocation groups by.
enum AllocationDimension {
  ALLOCATION_DIMENSION_UNSPECIFIED = 0;
  ALLOCATION_DIMENSION_ASSET_CLASS = 1;
  ALLOCATION_DIMENSION_CURRENCY = 2;
  ALLOCATION_DIMENSION_INSTITUTION = 3;
  ALLOCATION_DIMENSION_SLEEVE = 4;
}

// AllocationGroup is one group's value in the reporting currency. Its key is
// an asset class (cash, treasury_bond, listed), a currency code, an
// institution or a sleeve ID.
message AllocationGroup {
  string key = 1;
  Money value_reporting = 2;
}

// UnvaluedHolding is a holding with no stored valuation on the date asked
// for, left out of the allocation.
message UnvaluedHolding {
  string account_id = 1;
  Instrument instrument = 2;
  // A decimal string.
  string quantity = 3;
}

message ListSleevesRequest {}

message ListSleevesResponse {
  repeated Sleeve sleeves = 1;
}

message ListSleeveKindsRequest {}

message ListSleeveKindsResponse {
  repeated SleeveKind kinds = 1;
}

message ListConnectorBindingsRequest {}

message ListConnectorBindingsResponse {
  repeated ConnectorBinding bindings = 1;
}

message ListBrokerAccountsRequest {
  // Only the broker accounts not mapped to an OpenFief account.
  bool unmapped = 1;
}

message ListBrokerAccountsResponse {
  repeated BrokerAccount broker_accounts = 1;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message ListTransactionsRequest {
  string account_id = 1;
  // The most transactions to return, 1 to 500; 0 means 100.
  int32 page_size = 2;
  // The next_page_token of the previous page; empty for the first page.
  string page_token = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  // Pass as page_token to get the next page; empty on the last page.
  string next_page_token = 2;
}

message ListHoldingsRequest {
  string account_id = 1;
  // YYYY-MM-DD.
  string date = 2;
}

message ListHoldingsResponse {
  string account_id = 1;
  string date = 2;
  repeated Holding holdings = 3;
}

message ListLotsRequest {
  string account_id = 1;
  // YYYY-MM-DD.
  string date = 2;
}

message ListLotsResponse {
  string account_id = 1;
  string date = 2;
  repeated Lot lots = 3;
}

message ListCashRequest {
  string account_id = 1;
  // YYYY-MM-DD.
  string date = 2;
}

message ListCashResponse {
  string account_id = 1;
  string date = 2;
  repeated Money balances = 3;
}

message ListAssertionChecksRequest {
  string account_id = 1;
  // Only checks with this status, such as flagged; unspecified for all.
  AssertionStatus status = 2;
}

message ListAssertionChecksResponse {
  string account_id = 1;
  repeated AssertionCheck checks = 2;
}

message ListAccountValuationsRequest {
  string account_id = 1;
  // The first date of the range, YYYY-MM-DD.
  string from = 2;
  // The last date of the range, inclusive, YYYY-MM-DD; at most 3700 days
  // after from.
  string to = 3;
}

message ListAccountValuationsResponse {
  string account_id = 1;
  string from = 2;
  string to = 3;
  // In date then instrument order.
  repeated Valuation valuations = 4;
  // One per date that has valuations, in date order.
  repeated DateTotal totals = 5;
  // The currency of every value_reporting.
  string reporting_currency = 6;
}

message GetValuationStatusRequest {
  string account_id = 1;
}

message GetValuationStatusResponse {
  ValuationStatus status = 1;
}

message ListValuationTotalsRequest {
  // The first date of the range, YYYY-MM-DD.
  string from = 1;
  // The last date of the range, inclusive, YYYY-MM-DD; at most 3700 days
  // after from.
  string to = 2;
}

message ListValuationTotalsResponse {
  string from = 1;
  string to = 2;
  // One per date that has valuations, in date order.
  repeated DateTotal totals = 3;
  // The currency of every value_reporting.
  string reporting_currency = 4;
}

message ListValuationStatusesRequest {}

message ListValuationStatusesResponse {
  repeated ValuationStatus statuses = 1;
}

message ListPriceChecksRequest {
  // Only checks with this status, such as flagged; unspecified for all.
  PriceCheckStatus status = 1;
}

message ListPriceChecksResponse {
  // The relative difference beyond which a check is flagged unless the
  // owner set another for its instrument, as a decimal fraction: "0.01"
  // (D-110); empty when this core compares no prices.
  string threshold = 1;
  repeated PriceCheck checks = 2;
}

message GetAllocationRequest {
  // YYYY-MM-DD.
  string date = 1;
  AllocationDimension by = 2;
}

message GetAllocationResponse {
  string date = 1;
  AllocationDimension by = 2;
  // The sum of all groups, in the reporting currency.
  Money total_reporting = 3;
  // Largest value first, then by key.
  repeated AllocationGroup groups = 4;
  repeated UnvaluedHolding unvalued = 5;
}

// PerformanceGap says why a performance series ends before the last date
// asked for.
enum PerformanceGap {
  // The series reaches the last date asked for.
  PERFORMANCE_GAP_UNSPECIFIED = 0;
  // The next day is after an account's valued-through date, or a holding
  // has no complete valuation of its current quantity on it.
  PERFORMANCE_GAP_UNVALUED = 1;
  // Cash, a cash flow or money in transit on the next day is in a currency
  // with no FX rate on or before it.
  PERFORMANCE_GAP_NO_FX_RATE = 2;
}

// PerformanceDay is the portfolio at the end of one day, in the reporting
// currency. value_reporting is holdings_reporting plus cash_reporting plus
// in_transit_reporting.
message PerformanceDay {
  // YYYY-MM-DD.
  string date = 1;
  // The time-weighted return since the first day as an index, 100 on the
  // first day, as a decimal string: 105 means 5% up.
  string index = 2;
  Money value_reporting = 3;
  // The holdings at their stored valuations.
  Money holdings_reporting = 4;
  // Every account's cash, converted at the FX rate for the day.
  Money cash_reporting = 5;
  // Money withdrawn from one account and not yet deposited into another;
  // negative while the deposit is booked and the withdrawal not yet.
  Money in_transit_reporting = 6;
  // The day's net external cash flow: deposits, opening cash and opening
  // lots in, withdrawals out. Taken at the end of the day.
  Money flow_reporting = 7;
}

// Transfer is a withdrawal from one of the owner's accounts matched with a
// deposit of the same amount and currency into another, at most five days
// apart: not a cash flow.
message Transfer {
  string withdrawal_account_id = 1;
  // YYYY-MM-DD.
  string withdrawal_date = 2;
  string deposit_account_id = 3;
  // YYYY-MM-DD.
  string deposit_date = 4;
  Money amount = 5;
}

message GetPerformanceRequest {
  // The first date, YYYY-MM-DD; empty, or a date before go-live, means
  // go-live. The index is 100 on it.
  string from = 1;
  // The last date, inclusive, YYYY-MM-DD, at most 3700 days after from;
  // empty means the latest date any account is valued through.
  string to = 2;
}

message GetPerformanceResponse {
  // The range asked for, as resolved; both empty when nothing is recorded
  // yet.
  string from = 1;
  string to = 2;
  // One per day from from, in date order, up to to or the gap.
  repeated PerformanceDay days = 3;
  // Why days ends before to; unspecified when it doesn't.
  PerformanceGap gap = 4;
  // A revaluation of some account is pending or running, so the series
  // may change.
  bool revaluation_pending = 5;
  // The transfers between the owner's accounts with a leg in the range.
  repeated Transfer transfers = 6;
  // The currency of every *_reporting value.
  string reporting_currency = 7;
}

// ModelTargetKind says what a model portfolio target is.
enum ModelTargetKind {
  MODEL_TARGET_KIND_UNSPECIFIED = 0;
  // An instrument, such as an index ETF or a stock.
  MODEL_TARGET_KIND_INSTRUMENT = 1;
  // A market index, such as WIG20, which can't be held.
  MODEL_TARGET_KIND_INDEX = 2;
}

// ModelTarget is one instrument or index of the model portfolio, with its
// weight.
message ModelTarget {
  ModelTargetKind kind = 1;
  // An instrument target's instrument; unset for an index.
  Instrument instrument = 2;
  // An index target's name as the market-data connector names it, such as
  // "WIG20"; empty for an instrument.
  string index = 3;
  // An index target's currency, the one its levels are in; empty for an
  // instrument, whose prices carry theirs.
  string currency = 4;
  // The weight in percent as a decimal string, such as "60". The weights
  // sum to 100.
  string weight_percent = 5;
}

// ModelHistoryGap says why a target has no history in the reporting
// currency.
enum ModelHistoryGap {
  // It has history.
  MODEL_HISTORY_GAP_UNSPECIFIED = 0;
  // No price or index level is stored for it.
  MODEL_HISTORY_GAP_NO_CLOSES = 1;
  // Its currency has no FX rate on or before its last close.
  MODEL_HISTORY_GAP_NO_FX_RATE = 2;
}

// Drawdown is the worst fall of a series from a peak to a later trough. A
// series that never falls has depth "0" with its first day as both.
message Drawdown {
  // YYYY-MM-DD.
  string peak_date = 1;
  string trough_date = 2;
  // The series' values on those days, as decimal strings.
  string peak_value = 3;
  string trough_value = 4;
  // The fall as a fraction of the peak, such as "0.25" for 25%.
  string depth = 5;
}

// ModelTargetHistory is one target's own history in the reporting currency:
// its value per unit from its first day with a close (and an FX rate) to its
// last close, and its max drawdown over it.
message ModelTargetHistory {
  ModelTarget target = 1;
  // YYYY-MM-DD; both empty when gap says why there is none.
  string first_date = 2;
  string last_date = 3;
  ModelHistoryGap gap = 4;
  // Values in reporting_currency per unit of the target.
  Drawdown drawdown = 5;
}

// BacktestDay is the model portfolio's backtest at the end of one day.
message BacktestDay {
  // YYYY-MM-DD.
  string date = 1;
  // The backtest as an index, 100 on the response's from, as a decimal
  // string.
  string index = 2;
}

message GetModelPortfolioRequest {
  // The first date of days, YYYY-MM-DD; empty, or a date before go-live,
  // means go-live, the first transaction's date. The index is 100 on the
  // first day of days.
  string from = 1;
  // The last date, inclusive, YYYY-MM-DD; empty means the latest date any
  // account is valued through. Nothing later is used.
  string to = 2;
}

message GetModelPortfolioResponse {
  // The range of days as resolved.
  string from = 1;
  string to = 2;
  // The targets in the owner's order.
  repeated ModelTarget targets = 3;
  // The first and last day every target has history, both empty when some
  // target has none or they don't overlap.
  string backtest_start = 4;
  string backtest_end = 5;
  // One per day from the later of from and backtest_start to the earlier of
  // to and backtest_end, in date order, rebalanced to the weights at the
  // end of each December 31.
  repeated BacktestDay days = 6;
  // The model's max drawdown over its whole backtest, from backtest_start,
  // in index points of a backtest that is 100 on backtest_start.
  Drawdown drawdown = 7;
  // Each target's history and max drawdown, in the owner's order.
  repeated ModelTargetHistory target_histories = 8;
  // The currency of the backtest and of the targets' values.
  string reporting_currency = 9;
}

// ListPluginsRequest has no parameters.
message ListPluginsRequest {}

// ListPluginsResponse lists the installed plugin instances.
message ListPluginsResponse {
  repeated Plugin plugins = 1;
}

// SignatureTrust is how far an installed plugin's image is trusted (D-45,
// D-56).
enum SignatureTrust {
  SIGNATURE_TRUST_UNSPECIFIED = 0;
  // A verified plugin: the catalog pins this image and its publisher
  // signed it (D-44).
  SIGNATURE_TRUST_VERIFIED = 1;
  // Signed by OpenFief's CI, not a verified plugin.
  SIGNATURE_TRUST_OPENFIEF_CI = 2;
  // Signed by a catalog publisher, but the catalog doesn't pin this image.
  SIGNATURE_TRUST_PUBLISHER = 3;
  // Signed by a signer the owner added.
  SIGNATURE_TRUST_OWNER = 4;
  // Signed by a trusted signer whose kind the status doesn't name.
  SIGNATURE_TRUST_TRUSTED_SIGNER = 5;
  // Refused: no trusted signer signed it, or its manifest doesn't match. It
  // is never deployed (D-57).
  SIGNATURE_TRUST_REFUSED = 6;
  // Not checked yet, or its registry couldn't be read.
  SIGNATURE_TRUST_NOT_CHECKED = 7;
}

// Plugin is one installed plugin instance.
message Plugin {
  // The instance's name, the name of its Plugin resource.
  string instance = 1;
  // The image reference, pinned by digest.
  string image = 2;
  // The image's digest, such as "sha256:...".
  string image_digest = 3;
  // What the running version may act as: requested and granted (D-16).
  repeated string capabilities = 4;
  // What the image's signed manifest requests.
  repeated string requested_capabilities = 5;
  SignatureTrust trust = 6;
  // The trusted signer's name; empty unless a trusted signer signed it.
  string signer = 7;
  // The operator's reason for the trust, such as "Verified" or "Unsigned".
  string trust_reason = 8;
  // The operator's Ready reason, such as "Running" or "AwaitingApproval";
  // "Removing" while it is being uninstalled, "Pending" before the operator
  // reconciled it.
  string phase = 9;
  // Whether a version of it runs.
  bool ready = 10;
}
