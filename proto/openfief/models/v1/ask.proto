// The Ask box's model contract (docs/DESIGN.md D-203, D-205, D-206, D-211).
//
// With a model configured, the Ask box answers its fixed commands itself and
// sends anything else to the model through the core's model router. The
// built-in UI runs the tool loop, since the tools are its own read-only
// answerers and it reads with the asking person's session; the core holds
// the switch, the route and the data tiers, so every round goes through the
// router: AskModelService is the router's door for the Ask box's role, and
// nothing else. A view plugin can't name another role, and nothing here
// changes anything.
//
// The core serves AskModelService to VIEW plugins only, next to the
// ModelSettingsService. Calling conventions are the AuthService's
// (proto/openfief/identity/v1/auth.proto):
//   - Every call carries the view plugin's projected ServiceAccount token
//     (audience openfief-core, D-27) as "Authorization: Bearer <token>"; a
//     call without one, or from a plugin that is not a view plugin, fails
//     with PERMISSION_DENIED.
//   - Every request carries origin and the asking person's session_token. A
//     missing, unknown, expired or revoked session fails with
//     UNAUTHENTICATED. A read-scoped session may ask: what the model sees is
//     limited by what that session may read, which the plugin enforces by
//     reading with the session's own token, never its own.
//   - Text of messages, answers and tool arguments is the owner's data: the
//     core neither logs nor keeps it (GR-12, D-211). The audit log keeps the
//     role, the provider instance and model and a call ID, and nothing else.
syntax = "proto3";

package openfief.models.v1;

import "google/protobuf/timestamp.proto";
import "openfief/models/v1/provider.proto";

// AskModelService is the Ask box's door to the model router.
service AskModelService {
  // AdmitAskQuestion is asked once for each question the Ask box is about to
  // send a model, before the first GenerateAsk of its tool loop, never for one
  // of the box's fixed commands (D-208). The core decides, and counts the
  // question when it lets it go: first whether the day's budget for model
  // calls is spent (which counts nothing), then the limits of questions per
  // session and, when the address is known, per address, each as a rolling
  // hour and a rolling day. A question that is not allowed says when its
  // reason ends. With no budget and no limit configured, which is what an
  // installation that sets none has, every question is allowed and nothing is
  // counted. It writes no audit entry: nothing is called.
  rpc AdmitAskQuestion(AdmitAskQuestionRequest) returns (AdmitAskQuestionResponse);

  // GetAskModel says whether the Ask box has a model: the one switch is on,
  // the Ask box's toggle is on and its route has a model (D-212), and whether
  // that model may give this person opinions (D-225). It writes no audit
  // entry: nothing is asked.
  rpc GetAskModel(GetAskModelRequest) returns (GetAskModelResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CheckAskTiers says whether a model of the Ask box's route may receive
  // data of every one of the given tiers together, and serves tools
  // (D-206). The plugin asks it before it puts a tool's result into the
  // conversation, so the model gets a refusal for a result it may not see.
  // It calls no model and writes no audit entry.
  rpc CheckAskTiers(CheckAskTiersRequest) returns (CheckAskTiersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GenerateAsk asks the Ask box's models for the next message of a
  // conversation, the primary first and then the fallbacks the data tiers
  // allow. Each message carries the data tier of what it holds; the core
  // refuses a conversation with a message that carries none, or that no
  // model of the route may receive (PERMISSION_DENIED), and writes the two
  // audit entries of each call (D-211).
  //
  // A call the guards refuse (D-208) fails with RESOURCE_EXHAUSTED and the
  // error's metadata "Openfief-Refusal" set to "budget" (the day's budget is
  // spent, and "Openfief-Resets-At" holds when it starts over, RFC 3339) or to
  // "busy" (the Ask box's calls at once were all taken for the whole queue
  // wait), and writes the refusal as an audit entry that names the same class.
  rpc GenerateAsk(GenerateAskRequest) returns (GenerateAskResponse);
}

message AdmitAskQuestionRequest {
  string origin = 1;
  string session_token = 2;
  // The asker's IP address as the core's front door found it: the connection's,
  // or the header of the proxy the core is configured to trust, and the one the
  // core hands the view plugin. Empty when unknown, which leaves out the limit
  // per address. An IPv6 address is counted as its /64.
  string client_address = 3;
}

// AskAdmission is the core's decision on a question about to go to a model.
enum AskAdmission {
  ASK_ADMISSION_UNSPECIFIED = 0;
  // The question may go on; it was counted.
  ASK_ADMISSION_ALLOWED = 1;
  // The day's budget for model calls is spent; nothing was counted.
  ASK_ADMISSION_BUDGET_SPENT = 2;
  // The session asked as many questions as it may in the hour or the day.
  ASK_ADMISSION_SESSION_LIMIT = 3;
  // The address asked as many questions as it may in the hour or the day.
  ASK_ADMISSION_ADDRESS_LIMIT = 4;
}

message AdmitAskQuestionResponse {
  AskAdmission admission = 1;
  // When the reason of a refusal ends: the start of the budget's next day, or
  // the moment the subject may ask again. Unset for an allowed question.
  google.protobuf.Timestamp resets_at = 2;
}

message GetAskModelRequest {
  string origin = 1;
  string session_token = 2;
}

// AskOpinions is whether the Ask box may give opinions and suggest a thesis to
// the person asking (D-225, D-229).
enum AskOpinions {
  // Off: the owner left them off, the switch or the Ask box's toggle is off,
  // the person is not the owner, or the core is a public demo. The box
  // declines to recommend (R-7) and says nothing more.
  ASK_OPINIONS_UNSPECIFIED = 0;
  // On: the model may say whether it would buy, sell or hold, and suggest a
  // thesis, from the cards it reads and the public data it fetches.
  ASK_OPINIONS_ON = 1;
  // The owner turned them on, but no model of the Ask box's route is allowed
  // for T0, T1 and T2 together: they stay off in effect, and the box says why.
  ASK_OPINIONS_ROUTE_INELIGIBLE = 2;
}

message GetAskModelResponse {
  // Whether the Ask box sends questions beyond its commands to a model.
  bool available = 1;
  // Whether the model may give opinions to this person (D-225).
  AskOpinions opinions = 2;
}

message CheckAskTiersRequest {
  string origin = 1;
  string session_token = 2;
  // "T0", "TF", "T1" or "T2".
  repeated string tiers = 3;
}

message CheckAskTiersResponse {
  // Whether a model may receive every tier in the request, together, with
  // tools.
  bool allowed = 1;
}

// AskMessage is a message of the Ask box's conversation with the data tier of
// what it holds: a tool's result carries the tier of the data the tool read.
message AskMessage {
  Message message = 1;
  // "T0", "TF", "T1" or "T2" (D-206).
  string data_tier = 2;
}

message GenerateAskRequest {
  string origin = 1;
  string session_token = 2;
  repeated AskMessage messages = 3;
  // The tools the model may call: the Ask box's read-only answerers.
  repeated Tool tools = 4;
  // The most tokens this call's answer may hold (D-208); zero means the
  // model entry's own limit.
  int64 max_output_tokens = 5;
  // When set, the message to generate is a JSON text of this JSON Schema: the
  // Ask box's structured answer. A model whose entry has structured output is
  // held to the schema; one that has not is asked for a JSON object (JSON mode)
  // and the caller checks the reply against the schema.
  string response_schema_json = 6;
}

message GenerateAskResponse {
  string content = 1;
  repeated ToolCall tool_calls = 2;
  FinishReason finish_reason = 3;
  // The model that answered, as "provider/model".
  string model = 4;
  // The tokens the answer used, as the provider reports them, so the Ask box
  // can stop a question at its token limit (D-208). The budget and the cost
  // stay in the core.
  int64 output_tokens = 5;
}
