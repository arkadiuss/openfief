// OpenFief's authentication contract (docs/DESIGN.md D-26, D-27, D-60).
//
// The core serves AuthService to VIEW plugins only, such as the built-in
// UI, which acts as the backend for the owner's browser: browser <-> view
// plugin <-> core. It is not part of the public read API (D-6), which stays
// read-only.
//
// Authentication and the session are separate. An authenticator proves
// that the person at the browser is the owner, the only person an
// installation has (GR-2), and with what scope; the core then issues a
// session. M0 has two authenticators: passkeys (WebAuthn, D-26), which give
// an owner-scoped session, and the demo authenticator, which gives a
// read-scoped session without credentials, only on a demo database and only
// when the core runs with --demo-sessions.
//
// Calling conventions:
// - Every call carries the view plugin's projected ServiceAccount token
//   (audience openfief-core, D-27) as "Authorization: Bearer <token>". A
//   call without one, with an invalid one, or from a plugin that is not a
//   view plugin fails with PERMISSION_DENIED.
// - The owner's session token never travels in the Authorization header:
//   it is the session_token field of the request. The view plugin keeps it
//   in an HttpOnly, Secure (except on http://localhost), SameSite=Strict
//   cookie and presents it as the bearer token to the read API (/v1).
// - Every request carries origin: the origin the owner's browser uses,
//   scheme, host and port, such as "https://dev.openfief.dev" or
//   "http://localhost:8080". It must be on the core's allow-list
//   (OPENFIEF_AUTH_ORIGINS), or the call fails with PERMISSION_DENIED. Its host is
//   the WebAuthn relying party ID: a passkey works only on the host it was
//   created on (D-60), and a session only on the host it was issued on.
// - A missing, unknown, expired or revoked session fails with
//   UNAUTHENTICATED: the view plugin drops its cookie and shows the login.
//   A read-scoped session calling an owner-only method fails with
//   PERMISSION_DENIED.
// - Enrolling or removing a passkey, issuing an enrollment link and
//   creating a script token also need a passkey check made in the same
//   session within the last five minutes (D-183): logging in with a passkey
//   counts, and so does BeginPasskeyCheck then FinishPasskeyCheck. Without
//   one they fail with FAILED_PRECONDITION and a PasskeyCheckRequired error
//   detail: the view plugin asks the owner to confirm with their passkey,
//   runs the check and asks again.
// - WebAuthn options and credentials travel as JSON text in the WebAuthn
//   Level 3 JSON forms, so the browser uses
//   PublicKeyCredential.parseCreationOptionsFromJSON,
//   parseRequestOptionsFromJSON and credential.toJSON() unchanged.
syntax = "proto3";

package openfief.identity.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// AuthService authenticates the owner and manages their sessions, passkeys,
// script tokens and enrollment links.
service AuthService {
  // GetLoginMethods says which ways in the login page can offer at origin.
  // It needs no session.
  rpc GetLoginMethods(GetLoginMethodsRequest) returns (GetLoginMethodsResponse);

  // BeginRegistration starts creating a passkey on origin's host. It needs
  // either a valid one-time enrollment code issued for origin (D-60) or an
  // owner-scoped session issued on origin's host with a recent passkey
  // check (D-183).
  rpc BeginRegistration(BeginRegistrationRequest) returns (BeginRegistrationResponse);

  // FinishRegistration verifies the new credential and stores the passkey.
  // A registration begun with an enrollment code uses the code up and also
  // logs the owner in: the response carries a new owner-scoped session.
  rpc FinishRegistration(FinishRegistrationRequest) returns (FinishRegistrationResponse);

  // BeginLogin starts a passkey login on origin's host. It needs no session.
  rpc BeginLogin(BeginLoginRequest) returns (BeginLoginResponse);

  // FinishLogin verifies the assertion against the passkeys of origin's
  // host and issues an owner-scoped session. A passkey whose signature
  // counter went backwards is refused (a cloned authenticator).
  rpc FinishLogin(FinishLoginRequest) returns (FinishLoginResponse);

  // CreateDemoSession issues a read-scoped session without credentials. It
  // works only when the database carries the demo marker and the core runs
  // with --demo-sessions; otherwise it fails with PERMISSION_DENIED.
  rpc CreateDemoSession(CreateDemoSessionRequest) returns (CreateDemoSessionResponse);

  // Logout revokes the session. Any scope.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // WhoAmI returns the owner and the session. Any scope.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // ListPasskeys returns every passkey, on every host. Owner scope.
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);

  // RemovePasskey removes a passkey and revokes every session it signed in.
  // The last passkey can't be removed (FAILED_PRECONDITION). Owner scope,
  // with a recent passkey check (D-183).
  rpc RemovePasskey(RemovePasskeyRequest) returns (RemovePasskeyResponse);

  // CreateScriptToken issues a read-only script token (D-27) and returns its
  // secret, the only time it is shown. Owner scope, with a recent passkey
  // check (D-183).
  rpc CreateScriptToken(CreateScriptTokenRequest) returns (CreateScriptTokenResponse);

  // ListScriptTokens returns every script token, expired and revoked ones
  // included, in creation order. Owner scope.
  rpc ListScriptTokens(ListScriptTokensRequest) returns (ListScriptTokensResponse);

  // RevokeScriptToken revokes a script token. Owner scope.
  rpc RevokeScriptToken(RevokeScriptTokenRequest) returns (RevokeScriptTokenResponse);

  // CreateEnrollmentLink issues a one-time link for creating a passkey on
  // another allowed origin, such as the owner's own Ingress host (D-60).
  // Owner scope, with a recent passkey check (D-183).
  rpc CreateEnrollmentLink(CreateEnrollmentLinkRequest) returns (CreateEnrollmentLinkResponse);

  // BeginPasskeyCheck starts a passkey check in the session: an assertion
  // like a login's, against the passkeys of origin's host (D-183). Owner
  // scope.
  rpc BeginPasskeyCheck(BeginPasskeyCheckRequest) returns (BeginPasskeyCheckResponse);

  // FinishPasskeyCheck verifies the assertion and records the check on the
  // session, which may then enroll or remove a passkey, issue an enrollment
  // link and create a script token for five minutes. Owner scope.
  rpc FinishPasskeyCheck(FinishPasskeyCheckRequest) returns (FinishPasskeyCheckResponse);

  // SignOutEverywhere revokes every session, on every host and of either
  // scope, the caller's own included (D-183). Owner scope.
  rpc SignOutEverywhere(SignOutEverywhereRequest) returns (SignOutEverywhereResponse);

  // ListAuditEntries returns a page of the audit log (D-211), newest first,
  // filtered by actor, action and time. Owner scope only: a read-scoped
  // (demo) session is refused with PERMISSION_DENIED, and the log is not on
  // the read API (D-137), so no script token or view plugin reads it there.
  // Reading the log is itself no entry. An entry names who, what, which
  // records by ID, when and the outcome, never an amount, a secret or a
  // question's text (GR-12).
  rpc ListAuditEntries(ListAuditEntriesRequest) returns (ListAuditEntriesResponse);

  // CreateGrant lets a script token or a view plugin view an account, a
  // sleeve or the whole household (D-209). A sleeve's grant covers the
  // accounts placed in it later, and the household's every account, present
  // and future. A grant only ever lets its holder view. The holder and the
  // target must exist: an unknown one is NOT_FOUND. Granting what is granted
  // already changes nothing and returns the grant in force. Each new grant is
  // an audit entry (D-211), written in the same transaction. Owner scope
  // only: a read-scoped (demo) session is refused with PERMISSION_DENIED,
  // and it is not on the read API, so no script token reads or changes it.
  // While the core runs with --authz=policy a grant is stored and has no
  // effect, since every holder of read access views every account then.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);

  // RevokeGrant ends a grant: from the next call its holder no longer views
  // what only that grant gave it. The grant stays in ListGrants, with its end,
  // as history. Revoking a grant already ended changes nothing; one that never
  // existed is NOT_FOUND. Each revocation is an audit entry. Owner scope.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);

  // ListGrants returns the grants, oldest first, optionally of one holder
  // and optionally only those in force. Owner scope.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
}

// SessionScope is what a session may do.
enum SessionScope {
  SESSION_SCOPE_UNSPECIFIED = 0;
  // Read paths only: the read API, WhoAmI and Logout.
  SESSION_SCOPE_READ = 1;
  // Everything the owner may do: read, plus passkeys, script tokens and
  // enrollment links.
  SESSION_SCOPE_OWNER = 2;
}

// Authenticator is how a session was authenticated.
enum Authenticator {
  AUTHENTICATOR_UNSPECIFIED = 0;
  // A passkey (WebAuthn, D-26).
  AUTHENTICATOR_PASSKEY = 1;
  // The demo authenticator: no credentials, read scope, demo databases only.
  AUTHENTICATOR_DEMO = 2;
}

// Session describes a session. It never holds the session token.
message Session {
  // The session's ID; not secret.
  string id = 1;
  SessionScope scope = 2;
  Authenticator authenticator = 3;
  // The host the session was issued on, and the only one it works on.
  string rp_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  // When the session expires if it is not used: last_seen_at plus the idle
  // timeout.
  google.protobuf.Timestamp idle_expires_at = 7;
  // When the session expires however much it is used.
  google.protobuf.Timestamp expires_at = 8;
  // The session's last passkey check: its passkey sign-in or a later
  // FinishPasskeyCheck. Unset when it has none, as a demo session never
  // does (D-183).
  google.protobuf.Timestamp passkey_checked_at = 9;
}

// PasskeyCheckRequired is the error detail of a FAILED_PRECONDITION from an
// action that needs a passkey check made in the same session within the
// last five minutes (D-183): enrolling or removing a passkey, issuing an
// enrollment link or creating a script token.
message PasskeyCheckRequired {
  // How recent the check must be: five minutes.
  google.protobuf.Duration window = 1;
}

// Owner is the one person an installation has (GR-2).
message Owner {
  google.protobuf.Timestamp created_at = 1;
}

// Passkey is a WebAuthn credential of the owner, valid on one host only.
message Passkey {
  // The credential ID in unpadded base64url.
  string id = 1;
  string name = 2;
  // The host the passkey works on (the WebAuthn relying party ID).
  string rp_id = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset when the passkey was never used to log in.
  google.protobuf.Timestamp last_used_at = 5;
  // The transports the authenticator reported, such as "internal" or "usb".
  repeated string transports = 6;
  // Whether the passkey is synced or backed up by its provider.
  bool backed_up = 7;
}

// ScriptTokenStatus is a script token's status now.
enum ScriptTokenStatus {
  SCRIPT_TOKEN_STATUS_UNSPECIFIED = 0;
  SCRIPT_TOKEN_STATUS_ACTIVE = 1;
  SCRIPT_TOKEN_STATUS_EXPIRED = 2;
  SCRIPT_TOKEN_STATUS_REVOKED = 3;
}

// ScriptToken describes a script token. It never holds the secret.
message ScriptToken {
  // 16 lowercase hex digits; not secret.
  string id = 1;
  string name = 2;
  // "read", the only scope in M0.
  string scope = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Unset while the token is not revoked.
  google.protobuf.Timestamp revoked_at = 6;
  ScriptTokenStatus status = 7;
}

message GetLoginMethodsRequest {
  string origin = 1;
}

message GetLoginMethodsResponse {
  // Whether a passkey exists for origin's host. When none does, the owner
  // needs an enrollment link (core enroll-link, or another host's session).
  bool passkey_registered = 1;
  // Whether CreateDemoSession would succeed.
  bool demo_sessions = 2;
  // Whether the core runs with demo sessions on while the database doesn't
  // carry the demo marker yet: the demo data is still loading, so the login
  // page says so instead of offering the demo, and the first-run wizard's
  // writes are refused.
  bool demo_loading = 3;
}

message BeginRegistrationRequest {
  string origin = 1;
  // What allows creating a passkey: exactly one of them.
  oneof authorization {
    // The one-time code from an enrollment link's fragment (#code=...).
    string enrollment_code = 2;
    // An owner-scoped session issued on origin's host.
    string session_token = 3;
  }
}

message BeginRegistrationResponse {
  // Names the ceremony in FinishRegistration; single use.
  string ceremony_id = 1;
  // PublicKeyCredentialCreationOptionsJSON, for
  // PublicKeyCredential.parseCreationOptionsFromJSON.
  string options_json = 2;
  // When the ceremony expires.
  google.protobuf.Timestamp expires_at = 3;
}

message FinishRegistrationRequest {
  string origin = 1;
  string ceremony_id = 2;
  // RegistrationResponseJSON: the new credential's toJSON().
  string credential_json = 3;
  // A label for the passkey, such as "laptop"; 1 to 64 printable
  // characters. Empty names it after the host.
  string name = 4;
}

message FinishRegistrationResponse {
  Passkey passkey = 1;
  // Set only when the registration used an enrollment code: a new
  // owner-scoped session, shown only here.
  string session_token = 2;
  Session session = 3;
}

message BeginLoginRequest {
  string origin = 1;
}

message BeginLoginResponse {
  // Names the ceremony in FinishLogin; single use.
  string ceremony_id = 1;
  // PublicKeyCredentialRequestOptionsJSON, for
  // PublicKeyCredential.parseRequestOptionsFromJSON. It names no
  // credentials: passkeys are discoverable.
  string options_json = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message FinishLoginRequest {
  string origin = 1;
  string ceremony_id = 2;
  // AuthenticationResponseJSON: the assertion's toJSON().
  string credential_json = 3;
}

message FinishLoginResponse {
  // The new session's token, shown only here.
  string session_token = 1;
  Session session = 2;
}

message CreateDemoSessionRequest {
  string origin = 1;
}

message CreateDemoSessionResponse {
  // The new read-scoped session's token, shown only here.
  string session_token = 1;
  Session session = 2;
}

message LogoutRequest {
  string origin = 1;
  string session_token = 2;
}

message LogoutResponse {}

message WhoAmIRequest {
  string origin = 1;
  string session_token = 2;
}

message WhoAmIResponse {
  Owner owner = 1;
  Session session = 2;
}

message ListPasskeysRequest {
  string origin = 1;
  string session_token = 2;
}

message ListPasskeysResponse {
  // In creation order.
  repeated Passkey passkeys = 1;
}

message RemovePasskeyRequest {
  string origin = 1;
  string session_token = 2;
  // Passkey.id.
  string passkey_id = 3;
}

message RemovePasskeyResponse {
  // Whether the removed passkey had signed in the caller's own session,
  // which is now revoked with the others it signed in.
  bool signed_out = 1;
}

message CreateScriptTokenRequest {
  string origin = 1;
  string session_token = 2;
  // 1 to 64 letters, digits, '.', '_' or '-'.
  string name = 3;
  // How long the token is valid, at most a year; unset is 30 days.
  google.protobuf.Duration ttl = 4;
}

message CreateScriptTokenResponse {
  ScriptToken token = 1;
  // The secret, ofs_<id>_<key>: shown only here, never stored.
  string secret = 2;
}

message ListScriptTokensRequest {
  string origin = 1;
  string session_token = 2;
}

message ListScriptTokensResponse {
  repeated ScriptToken tokens = 1;
}

message RevokeScriptTokenRequest {
  string origin = 1;
  string session_token = 2;
  // ScriptToken.id.
  string token_id = 3;
}

message RevokeScriptTokenResponse {}

message CreateEnrollmentLinkRequest {
  string origin = 1;
  string session_token = 2;
  // The origin the new passkey is for, such as "https://dev.openfief.dev";
  // it must be on the allow-list. Empty is origin itself.
  string target_origin = 3;
  // How long the link is valid, at most 24 hours; unset is 15 minutes.
  google.protobuf.Duration ttl = 4;
}

message CreateEnrollmentLinkResponse {
  // <target_origin>/enroll#code=<code>. The code is in the fragment, so the
  // browser never sends it in a request line or a Referer: the enrollment
  // page reads it and passes it to BeginRegistration.
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message BeginPasskeyCheckRequest {
  string origin = 1;
  string session_token = 2;
}

message BeginPasskeyCheckResponse {
  // Names the ceremony in FinishPasskeyCheck; single use.
  string ceremony_id = 1;
  // PublicKeyCredentialRequestOptionsJSON, for
  // PublicKeyCredential.parseRequestOptionsFromJSON.
  string options_json = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message FinishPasskeyCheckRequest {
  string origin = 1;
  string session_token = 2;
  string ceremony_id = 3;
  // AuthenticationResponseJSON: the assertion's toJSON().
  string credential_json = 4;
}

message FinishPasskeyCheckResponse {
  // The session after the check.
  Session session = 1;
}

message SignOutEverywhereRequest {
  string origin = 1;
  string session_token = 2;
}

message SignOutEverywhereResponse {
  // How many sessions were revoked, the caller's own included.
  int64 revoked_sessions = 1;
}

// AuditActorKind is what kind of party made a change an audit entry records.
enum AuditActorKind {
  AUDIT_ACTOR_KIND_UNSPECIFIED = 0;
  // The owner in a session; the actor's id is the session's id.
  AUDIT_ACTOR_KIND_OWNER = 1;
  // The holder of a one-time enrollment code; the actor's id is the code's id.
  AUDIT_ACTOR_KIND_ENROLLMENT_CODE = 2;
  // The core itself, such as its enroll-link command; the id is "core".
  AUDIT_ACTOR_KIND_SYSTEM = 3;
  // A caller that proved nothing, such as a refused sign-in; no id.
  AUDIT_ACTOR_KIND_ANONYMOUS = 4;
}

// AuditAction is what an audit entry records, a closed set: it carries no
// free text. Later milestones add values.
enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_SIGN_IN = 1;
  AUDIT_ACTION_SIGN_OUT = 2;
  AUDIT_ACTION_SIGN_OUT_EVERYWHERE = 3;
  AUDIT_ACTION_PASSKEY_ADDED = 4;
  AUDIT_ACTION_PASSKEY_REMOVED = 5;
  AUDIT_ACTION_ENROLLMENT_LINK_ISSUED = 6;
  AUDIT_ACTION_ENROLLMENT_LINK_USED = 7;
  AUDIT_ACTION_SCRIPT_TOKEN_CREATED = 8;
  AUDIT_ACTION_SCRIPT_TOKEN_REVOKED = 9;
  // A grant of access made (D-209); the entry names its holder, then its
  // target.
  AUDIT_ACTION_GRANT_CREATED = 10;
  // A grant of access ended; the entry names its holder, then its target.
  AUDIT_ACTION_GRANT_REVOKED = 11;
  // A call to a model, or one the model router refused (D-205, D-211): the
  // entry names the role and the model, never a question or an answer.
  AUDIT_ACTION_MODEL_CALL = 12;
}

// AuditOutcome is how the recorded change ended.
enum AuditOutcome {
  AUDIT_OUTCOME_UNSPECIFIED = 0;
  AUDIT_OUTCOME_OK = 1;
  // Understood and not made, such as a sign-in whose credential did not verify.
  AUDIT_OUTCOME_REFUSED = 2;
  AUDIT_OUTCOME_FAILED = 3;
}

// AuditRefKind is the kind of record an audit entry names.
enum AuditRefKind {
  AUDIT_REF_KIND_UNSPECIFIED = 0;
  AUDIT_REF_KIND_SESSION = 1;
  AUDIT_REF_KIND_PASSKEY = 2;
  AUDIT_REF_KIND_ENROLLMENT_CODE = 3;
  AUDIT_REF_KIND_SCRIPT_TOKEN = 4;
  // A person, by their id.
  AUDIT_REF_KIND_PERSON = 5;
  // A view plugin, by its instance name.
  AUDIT_REF_KIND_VIEW_PLUGIN = 6;
  // An account, by its id.
  AUDIT_REF_KIND_ACCOUNT = 7;
  // A sleeve, by its id.
  AUDIT_REF_KIND_SLEEVE = 8;
  // The household, by its id, "home".
  AUDIT_REF_KIND_HOUSEHOLD = 9;
  // A role of the model router, by its name: "ask" or "maintainer".
  AUDIT_REF_KIND_MODEL_ROLE = 10;
  // A model entry, as "provider/model", the names the owner configured.
  AUDIT_REF_KIND_MODEL = 11;
}

// AuditActor is who made the change.
message AuditActor {
  AuditActorKind kind = 1;
  // The session's, enrollment code's or "core" ID; empty for an anonymous
  // caller.
  string id = 2;
}

// AuditRef names one record by kind and ID, never by name, amount or secret.
message AuditRef {
  AuditRefKind kind = 1;
  string id = 2;
}

// AuditEntry is one record of the append-only audit log. It has no
// free-text field.
message AuditEntry {
  // The entry's place in the log; larger is newer.
  int64 seq = 1;
  google.protobuf.Timestamp at = 2;
  AuditActor actor = 3;
  AuditAction action = 4;
  AuditOutcome outcome = 5;
  repeated AuditRef refs = 6;
}

message ListAuditEntriesRequest {
  string origin = 1;
  string session_token = 2;
  // Only entries of this kind of actor; unspecified selects every kind.
  AuditActorKind actor_kind = 3;
  // Only entries of this actor; needs actor_kind.
  string actor_id = 4;
  // Only entries of this action; unspecified selects every action.
  AuditAction action = 5;
  // Only entries at or after this time; unset is open.
  google.protobuf.Timestamp from = 6;
  // Only entries before this time; unset is open.
  google.protobuf.Timestamp to = 7;
  // The page size: 50 when zero, at most 200.
  int32 page_size = 8;
  // The next_page_token of the previous page, with the same filter; empty
  // starts from the newest.
  string page_token = 9;
}

message ListAuditEntriesResponse {
  repeated AuditEntry entries = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// GrantHolderKind is what kind of party holds a grant.
enum GrantHolderKind {
  GRANT_HOLDER_KIND_UNSPECIFIED = 0;
  // A viewer, by their id. Viewers come with the second alpha (D-65), so
  // CreateGrant refuses this kind until they exist.
  GRANT_HOLDER_KIND_PERSON = 1;
  // A script token, by its id (D-27).
  GRANT_HOLDER_KIND_SCRIPT_TOKEN = 2;
  // A view plugin, by its instance name. This grant is separate from the
  // plugin's PluginGrant, which approves what the plugin may do in the
  // cluster; this one says which accounts it may view.
  GRANT_HOLDER_KIND_VIEW_PLUGIN = 3;
}

// GrantTargetKind is what a grant lets its holder view.
enum GrantTargetKind {
  GRANT_TARGET_KIND_UNSPECIFIED = 0;
  // One account, by its id.
  GRANT_TARGET_KIND_ACCOUNT = 1;
  // One sleeve, by its id: every account in it, those placed there later too.
  GRANT_TARGET_KIND_SLEEVE = 2;
  // The whole household: every account, present and future. Its id is "home".
  GRANT_TARGET_KIND_HOUSEHOLD = 3;
}

// Grant is the owner's permission for a holder to view a target (D-209).
message Grant {
  GrantHolderKind holder_kind = 1;
  string holder_id = 2;
  GrantTargetKind target_kind = 3;
  // For the household, "home".
  string target_id = 4;
  google.protobuf.Timestamp created_at = 5;
  // Unset while the grant is in force.
  google.protobuf.Timestamp revoked_at = 6;
}

message CreateGrantRequest {
  string origin = 1;
  string session_token = 2;
  GrantHolderKind holder_kind = 3;
  string holder_id = 4;
  GrantTargetKind target_kind = 5;
  // For the household, "home" or empty.
  string target_id = 6;
}

message CreateGrantResponse {
  Grant grant = 1;
}

message RevokeGrantRequest {
  string origin = 1;
  string session_token = 2;
  GrantHolderKind holder_kind = 3;
  string holder_id = 4;
  GrantTargetKind target_kind = 5;
  // For the household, "home" or empty.
  string target_id = 6;
}

message RevokeGrantResponse {}

message ListGrantsRequest {
  string origin = 1;
  string session_token = 2;
  // Only the grants of this holder; unspecified lists every holder's, and
  // holder_id then stays empty.
  GrantHolderKind holder_kind = 3;
  string holder_id = 4;
  // Leave out the ended grants, which are the history.
  bool in_force_only = 5;
}

message ListGrantsResponse {
  repeated Grant grants = 1;
}
