syntax = "proto3";

// The connector contract (D-11, D-49): a connector plugin serves
// ConnectorService and the core calls it, to sync and to import files. The
// core owns the schedules, retries and import batches. This is a connector's
// ingest path (D-7); the public read API never takes data in.
//
// Conventions for every message in this package:
//   - Amounts, prices, rates and quantities are exact decimal strings, such as
//     "-1234.5600" or "0.049", never floating point: an optional minus sign,
//     digits and an optional fractional part, with no exponent and no grouping.
//   - Dates are calendar dates as ISO 8601 strings, "YYYY-MM-DD", with no time
//     of day or time zone.
//   - Currencies are ISO 4217 alphabetic codes, such as "PLN" or "USD".
//   - Every call carries a batch ID the core generates. The core retries a
//     failed call with the same batch ID, and importing the same delivery
//     again has no further effect: the ledger keys transactions by source
//     plus the institution's own ID (D-18), and the core scopes every source
//     to the connector instance (D-48).
//   - The core authenticates every call with a short-lived ServiceAccount
//     token whose audience is "openfief-plugin:<instance>", in
//     "Authorization: Bearer <token>" (D-59). The Go SDK verifies it.
package openfief.connector.v1;

// ConnectorService is served by a connector plugin and called by the core.
service ConnectorService {
  // Sync pulls what the institution reports since the watermark of the
  // previous sync, such as new transactions with balance assertions, or
  // end-of-day prices, FX rates, index readings and index levels.
  rpc Sync(SyncRequest) returns (SyncResponse);
  // ImportFile maps one statement file, such as an uploaded export. The first
  // message carries the header, the rest carry the file's bytes in order.
  rpc ImportFile(stream ImportFileRequest) returns (ImportFileResponse);
  // ImportBondLots maps Polish retail treasury bond lots the owner entered
  // by hand in the built-in UI, which hands them to the core (D-9, D-49).
  // It is always a transactions batch. A connector that takes no bond lots
  // answers UNIMPLEMENTED; a lot it refuses, such as one whose purchase date
  // doesn't match its series, INVALID_ARGUMENT naming the rule it broke.
  rpc ImportBondLots(ImportBondLotsRequest) returns (ImportBondLotsResponse);
  // LookupInstruments proposes the ISIN of each ticker an institution named
  // without one (D-116), such as a ticker of an xStation export, so the
  // owner confirms it once. The core asks the market-data connectors; one
  // that can't look instruments up answers UNIMPLEMENTED. A ticker it finds
  // no single ISIN for is left out of the response.
  rpc LookupInstruments(LookupInstrumentsRequest) returns (LookupInstrumentsResponse);
}

// Money is an exact amount in one currency.
message Money {
  // The amount as a decimal string, such as "-12.34".
  string amount = 1;
  // The ISO 4217 currency code.
  string currency = 2;
}

// Instrument is identified by its ISIN, with a valid check digit, plus its
// symbol on its trading venue (D-35).
message Instrument {
  string isin = 1;
  string symbol = 2;
}

// BookKind is the kind of a ledger account inside an account (D-19, D-33).
enum BookKind {
  BOOK_KIND_UNSPECIFIED = 0;
  // Cash in one currency.
  BOOK_KIND_CASH = 1;
  // A holding of one instrument; its postings carry a quantity.
  BOOK_KIND_HOLDING = 2;
  BOOK_KIND_FEE = 3;
  BOOK_KIND_WITHHOLDING_TAX = 4;
  BOOK_KIND_FX = 5;
  // The counterpart of deposits, withdrawals and opening lots (D-33).
  BOOK_KIND_EQUITY = 6;
  // The source of income that no holding produces, such as a broker's
  // interest on uninvested cash or a closed CFD's result (D-152).
  BOOK_KIND_INCOME = 7;
}

// Book names a ledger account: a holding names its instrument and no
// currency; every other kind names its currency and no instrument.
message Book {
  BookKind kind = 1;
  string currency = 2;
  Instrument instrument = 3;
}

// Posting is one leg of a transaction. A posting to a holding carries the
// quantity of units and their cost as the amount; any other posting carries
// only an amount, in its ledger account's currency.
message Posting {
  Book book = 1;
  Money amount = 2;
  // Units of the instrument, as a decimal string; empty for non-holdings.
  string quantity = 3;
}

// TransactionKind is what economic event a transaction records.
enum TransactionKind {
  TRANSACTION_KIND_UNSPECIFIED = 0;
  TRANSACTION_KIND_BUY = 1;
  TRANSACTION_KIND_SELL = 2;
  TRANSACTION_KIND_DIVIDEND = 3;
  TRANSACTION_KIND_FEE = 4;
  TRANSACTION_KIND_FX_CONVERSION = 5;
  TRANSACTION_KIND_DEPOSIT = 6;
  TRANSACTION_KIND_WITHDRAWAL = 7;
  // A lot seeded from the institution's current positions at go-live (D-23).
  TRANSACTION_KIND_OPENING_LOT = 8;
  // Interest paid on a holding, such as a treasury bond's coupon (D-101).
  TRANSACTION_KIND_INTEREST = 9;
  // Deletes the transaction its key names, as a correction (D-100): a new
  // version with no postings that supersedes the current one and keeps it.
  TRANSACTION_KIND_DELETION = 10;
  // A holding redeemed by its issuer, such as a treasury bond at maturity
  // (D-135): its holding posting gives up the units at the redemption
  // value, with the tax withheld at source posted to withholding tax.
  TRANSACTION_KIND_REDEMPTION = 11;
  // Income that no holding produces, such as a broker's interest on
  // uninvested cash or a closed CFD's result, with any tax withheld
  // (D-152): income gives it, withholding tax takes the tax, cash gets the
  // rest; a negative one, such as a CFD's loss, takes cash out.
  // Performance counts it as return, never as money paid in.
  TRANSACTION_KIND_CASH_INCOME = 12;
}

// TransactionKey identifies a transaction across re-imports (D-18). The core
// prefixes the source with the connector instance's name, so a connector can
// never write or supersede another instance's transactions.
message TransactionKey {
  // Where the transaction came from, such as the connector's import path for
  // one account. Never an institution's account number.
  string source = 1;
  // The institution's own ID for the transaction.
  string external_id = 2;
}

// Transaction is one economic event, recorded in one account as postings that
// sum to zero per currency (D-19).
message Transaction {
  TransactionKey key = 1;
  // The OpenFief account ID, never the institution's account number. Empty
  // when broker_account names the account instead.
  string account_id = 2;
  TransactionKind kind = 3;
  // The date the transaction takes effect, "YYYY-MM-DD".
  string date = 4;
  // For an opening lot only: the date the lot was opened, "YYYY-MM-DD".
  string lot_opened = 5;
  string description = 6;
  repeated Posting postings = 7;
  // The institution's own ID of the account, such as an IBKR Flex account
  // ID, set by a broker connector that doesn't know the OpenFief account
  // (D-72); account_id is then empty. The core maps it to the OpenFief
  // account the owner chose, and books nothing for a broker account that
  // isn't mapped. The key's source must then name no account: the core
  // appends ":" and the OpenFief account ID to it.
  string broker_account = 8;
}

// BalanceAssertion is a balance the institution reports for a cash or
// holding ledger account on a date; the derived balance must match it (D-18).
message BalanceAssertion {
  // The OpenFief account ID; empty when broker_account names the account.
  string account_id = 1;
  string date = 2;
  Book book = 3;
  // The reported balance: an amount for cash, units for a holding.
  string balance = 4;
  // The institution's own ID of the account, as on Transaction (D-72).
  string broker_account = 5;
}

// BrokerAccount is one of the owner's accounts at the institution, as the
// institution names it (D-72). The core shows it to the owner to map to an
// OpenFief account, so the owner never types it.
message BrokerAccount {
  // The institution's own ID of the account, such as an IBKR Flex account
  // ID: 1 to 64 printable characters without spaces.
  string id = 1;
}

// ProblemKind says why a statement row was left out of the ledger.
enum ProblemKind {
  PROBLEM_KIND_UNSPECIFIED = 0;
  // The row cannot be booked yet, such as an option trade.
  PROBLEM_KIND_UNSUPPORTED = 1;
  // The row was left out on purpose, such as a summary row.
  PROBLEM_KIND_SKIPPED = 2;
}

// Problem is a statement row the mapping left out of the ledger, with its
// reason. It is not an error. Its text never carries amounts or account
// numbers.
message Problem {
  ProblemKind kind = 1;
  // Where the row is in the statement.
  string ref = 2;
  string reason = 3;
}

// Mode says what an import batch takes from its statement (D-23).
enum Mode {
  MODE_UNSPECIFIED = 0;
  // Opening lots and opening cash at go-live, plus balance assertions.
  MODE_OPENING = 1;
  // Transactions from go-live on, plus balance assertions.
  MODE_TRANSACTIONS = 2;
}

// Price is an end-of-day price of one unit of an instrument (D-21).
message Price {
  Instrument instrument = 1;
  string date = 2;
  // The closing price, in the currency the instrument is quoted in.
  Money close = 3;
}

// FxRate is the value in its base currency of one unit of a currency on a
// date. A source that quotes per 100 units is normalized to one unit by the
// connector.
message FxRate {
  string currency = 1;
  string date = 2;
  // Base units per one unit of currency, as a positive decimal string.
  string rate = 3;
  // The currency the rate is quoted in, such as "PLN" for NBP's table A.
  // Required: the core never assumes one (D-180).
  string base = 4;
}

// Index is a published index that sets treasury bond interest.
enum Index {
  INDEX_UNSPECIFIED = 0;
  // CPI year on year from GUS, for one month.
  INDEX_CPI = 1;
  // The NBP reference rate.
  INDEX_REFERENCE_RATE = 2;
}

// IndexReading is one published value of an index.
message IndexReading {
  Index index = 1;
  // For CPI, the first day of the month the reading measures; for the
  // reference rate, the first day of the month whose ROR and DOR interest
  // periods it sets: the rate in force on the tenth business day before that
  // day. The core records each reading for the month of its date.
  string date = 2;
  // A yearly fraction as a decimal string: CPI of 104.9 (previous year =
  // 100) is "0.049", a 5.75% reference rate is "0.0575".
  string value = 3;
}

// IndexLevel is one end-of-day closing level of a market index, such as
// WIG20 (D-51). A market index can be a target of the model portfolio
// (D-52, D-53) but is never held, so it has no instrument.
message IndexLevel {
  // The index's name as the connector instance's config gives it, such as
  // "WIG20".
  string index = 1;
  string date = 2;
  // The closing level, as a positive decimal string.
  string level = 3;
}

// BondTerms are what the issue letter of one Polish retail treasury bond
// series fixes (D-9). Once recorded, the core values holdings of the
// instrument as treasury bonds from these terms rather than at a price.
message BondTerms {
  // The series' instrument; its symbol is the series code, such as
  // "EDO0536".
  Instrument instrument = 1;
  // The yearly rate of the first interest period, as a fraction: 5.35% is
  // "0.0535".
  string first_period_rate = 2;
  // The yearly margin over the period index, as a fraction; "0" for a
  // fixed-rate series.
  string margin = 3;
  // The early-redemption fee per bond, in PLN.
  Money early_redemption_fee = 4;
  // Where terms read from published data came from, as its licence asks
  // (D-97): unset for terms the owner entered. The core stores it with the
  // terms and hands it back in a sync request.
  BondTermsAttribution attribution = 5;
}

// BondTermsAttribution names the source of series terms a connector read
// from published data, such as the Ministry of Finance's retail bond
// spreadsheet, which its licence (CC BY 4.0) lets anyone re-use when it is
// named as the source, with when the data was made and taken and how it was
// processed (D-97).
message BondTermsAttribution {
  // The source, such as "Ministerstwo Finansów".
  string publisher = 1;
  // The publication's title, such as "Dane dotyczące obligacji
  // detalicznych".
  string dataset = 2;
  // The publication's licence, such as "CC BY 4.0".
  string license = 3;
  // The address of the file the terms were read from.
  string url = 4;
  // The day the publisher made the data, "YYYY-MM-DD".
  string made = 5;
  // When the connector took the data, an RFC 3339 time in UTC, such as
  // "2026-11-07T06:00:00Z".
  string fetched = 6;
  // What the connector did to the data, such as which columns it read and
  // how it rounded them, and where any term not in the data came from.
  string processing = 7;
}

// Delivery is what a connector returns for one import batch: its mapping of
// what the institution reported (transactions with their postings, balance
// assertions and the rows it left out), plus any prices, FX rates, index
// readings, index levels, bond series terms and cross-check prices.
message Delivery {
  // The batch ID of the call, echoed back.
  string batch_id = 1;
  // The institution the data is from, such as "ibkr" or "nbp".
  string institution = 2;
  repeated Transaction transactions = 3;
  repeated BalanceAssertion balance_assertions = 4;
  repeated Problem problems = 5;
  repeated Price prices = 6;
  repeated FxRate fx_rates = 7;
  repeated IndexReading index_readings = 8;
  repeated IndexLevel index_levels = 9;
  // The terms of the treasury bond series the delivery's transactions hold.
  repeated BondTerms bond_terms = 10;
  // The institution's own end-of-day prices of instruments, such as the
  // mark prices of the positions an IBKR Flex statement reports. The core
  // stores them only to cross-check the market-data connector's prices
  // (D-22): unlike prices, they never value a holding and never replace a
  // stored price.
  repeated Price cross_check_prices = 11;
  // Every broker account the institution reported in this delivery, those
  // without any transaction too (D-72). A broker account a transaction or
  // balance assertion names counts as reported even when it is not listed.
  repeated BrokerAccount broker_accounts = 12;
  // The instruments the institution named by ticker only, with no ISIN
  // (D-116), each once.
  repeated Ticker tickers = 13;
  // The transactions of instruments named in tickers. The core books each
  // with the ISIN the owner confirmed for its ticker, and holds it as an
  // ingest problem until the owner does.
  repeated TickerTransaction ticker_transactions = 14;
  // The display names the institution gives the instruments it delivers
  // by ISIN, such as IBKR's description (D-197), each ISIN once. The core
  // keeps the first name any connector delivers for an instrument; the
  // owner can rename it.
  repeated InstrumentName instrument_names = 15;
  // The holdings of instruments named in tickers that the institution
  // reports, such as the summed volume of each ticker's open positions in
  // an xStation export (D-155). The core asserts each as a balance
  // assertion of the instrument the owner confirmed for its ticker, and
  // holds it until the owner does.
  repeated TickerAssertion ticker_assertions = 16;
}

// InstrumentName is an instrument's display name at the institution, for
// the owner (D-197).
message InstrumentName {
  // The ISIN, with a valid check digit.
  string isin = 1;
  // At most 200 characters, no control characters.
  string name = 2;
}

// Ticker is an instrument as an institution that reports no ISIN names it
// (D-116).
message Ticker {
  // The instrument's symbol at the institution, such as "TESTA.PL"; the
  // ledger keeps it as the instrument's venue symbol.
  string symbol = 1;
  // The instrument's code on its market, such as "TESTA".
  string code = 2;
  // The ISO 3166-1 alpha-2 code of the market's country, such as "PL", or
  // empty when the institution's symbol doesn't say.
  string country = 3;
  // The instrument's display name at the institution, for the owner.
  string name = 4;
}

// TickerTransaction is a buy, sell, dividend or opening lot of an
// instrument named by ticker only (D-116, D-136): what the core needs to
// book it once the ISIN is confirmed. Its fields mean what Transaction's do.
message TickerTransaction {
  // The symbol of one of the delivery's tickers.
  string symbol = 1;
  TransactionKey key = 2;
  string account_id = 3;
  string broker_account = 4;
  // TRANSACTION_KIND_BUY, TRANSACTION_KIND_SELL, TRANSACTION_KIND_DIVIDEND
  // or TRANSACTION_KIND_OPENING_LOT.
  TransactionKind kind = 5;
  // The transaction's date; an opening lot's is the account's go-live date.
  string date = 6;
  // The units bought, sold or held in an opening lot, positive; empty for a
  // dividend.
  string quantity = 7;
  // A buy's cost, a sale's proceeds, a dividend's gross amount, or an
  // opening lot's cost; positive, or zero for an opening lot that cost
  // nothing. Unset for an opening lot priced by open_price.
  Money amount = 8;
  // A buy's or sale's fee, or the tax withheld from a dividend; unset for
  // none.
  Money charge = 9;
  string description = 10;
  // Where the row is in the statement, as in Problem: the ingest problem
  // that holds it while it waits names it so.
  string ref = 11;
  // The date an opening lot's units were first acquired, on or before its
  // date; empty for any other kind.
  string lot_opened = 12;
  // An opening lot's open price per unit, a non-negative decimal, in its
  // instrument's trading currency, which the institution doesn't name
  // (D-159), with amount unset: the core books the lot's cost, quantity
  // times this price, in the currency of the confirmed ticker's listing, or
  // of the exchange its market names, once the owner confirms its ISIN.
  // Empty for any other kind and for an opening lot priced by amount.
  string open_price = 13;
}

// TickerAssertion is a holding of an instrument named by ticker only that
// the institution reports for an account at the end of a date (D-155),
// like a BalanceAssertion of a holding.
message TickerAssertion {
  // The symbol of one of the delivery's tickers.
  string symbol = 1;
  // The OpenFief account ID; empty when broker_account names the account.
  string account_id = 2;
  // The institution's own ID of the account, as on Transaction (D-72).
  string broker_account = 3;
  // YYYY-MM-DD.
  string date = 4;
  // The units held, a non-negative decimal.
  string quantity = 5;
  // Where the rows are in the statement, as in Problem.
  string ref = 6;
}

message LookupInstrumentsRequest {
  repeated Ticker tickers = 1;
}

// InstrumentProposal is the ISIN a market-data connector found for a ticker.
message InstrumentProposal {
  // The ticker's symbol, as the request named it.
  string symbol = 1;
  // The ISIN found, with a valid check digit.
  string isin = 2;
  // The instrument's name at the market-data source, for the owner.
  string name = 3;
  // The currency the listing found trades in, as the source names it, such
  // as "PLN", or "GBX" for a London listing quoted in pence; empty when the
  // source gives none (D-159).
  string currency = 4;
}

message LookupInstrumentsResponse {
  repeated InstrumentProposal proposals = 1;
}

message SyncRequest {
  // The core's ID for this import batch; a retry reuses it.
  string batch_id = 1;
  Mode mode = 2;
  // What the connector returned as watermark from the previous successful
  // sync, or empty for the first one. Opaque to the core.
  string watermark = 3;
  // What a market-data connector is asked to price (D-93): every
  // instrument the owner holds, other than treasury bonds, which have no
  // market price, and the instrument targets of the model portfolio while
  // it is on, each once, as the ledger knows it, so a newly bought
  // instrument is priced without configuration. The connector adds the
  // instruments its own config lists to watch, and keys each price by the
  // instrument as given here. The core fills it only for a connector
  // instance bound to no account: a broker connector gets it empty.
  repeated Instrument instruments = 4;
  // The market indices that are targets of the model portfolio while it is
  // on, each once, by the name the owner gave it, such as "WIG20" (D-96):
  // the connector delivers their levels under that name.
  repeated string indices = 5;
  // What each account bound to the instance holds today (D-117), in
  // account ID order, as D-93's instruments tell a market-data connector
  // what to price: a connector that books what the institution pays on a
  // holding, such as the treasury-bonds connector booking each coupon that
  // fell due as interest (D-101), takes the holdings from here. Empty for
  // an instance bound to no account.
  repeated AccountHoldings accounts = 6;
  // The stored series terms of every treasury bond held in those accounts
  // (D-9, D-97), so a connector with no storage of its own can compute
  // what a series pays.
  repeated BondTerms bond_terms = 7;
}

// AccountHoldings is what one account holds on the day of a sync request
// (D-117): its non-zero holdings and the open lots behind them.
message AccountHoldings {
  string account_id = 1;
  // The account's go-live date, "YYYY-MM-DD", or empty while it is not
  // seeded (D-23, D-98): what fell due on or before it is history the
  // opening lots already hold, so a connector books nothing dated then.
  string go_live = 2;
  // The account's tax wrapper, a key of the jurisdiction pack such as
  // "taxable" or "ike" (D-76), which decides the tax withheld from what
  // the account is paid.
  string tax_wrapper = 3;
  repeated Holding holdings = 4;
  // The open lots, oldest first, each with what is left of it.
  repeated OpenLot lots = 5;
  // The account's payout setting (D-135): whether the coupons and
  // maturities of a hand-entered bond account stay as its cash or are paid
  // out. Unspecified is BOND_PAYOUT_CASH.
  BondPayout bond_payout = 6;
  // The day bond_payout took effect, "YYYY-MM-DD", or empty for an
  // account's first setting, which covers its whole history (D-162): what
  // falls due before it follows the setting in force on its day, in
  // bond_payout_earlier.
  string bond_payout_since = 7;
  // The settings in force before bond_payout_since, oldest first; empty
  // for an account that never changed its setting (D-162). The first has
  // no since; each later one took effect on a later day.
  repeated BondPayoutPeriod bond_payout_earlier = 8;
}

// BondPayoutPeriod is a payout setting in force from since until the next
// one took effect (D-162).
message BondPayoutPeriod {
  BondPayout bond_payout = 1;
  // The day it took effect, "YYYY-MM-DD", or empty for an account's first
  // setting, which covers its history from the start.
  string since = 2;
}

// BondPayout is what happens to what a hand-entered bond account's bonds
// pay, matching the option the bond registry offers (D-135).
enum BondPayout {
  // Treated as BOND_PAYOUT_CASH.
  BOND_PAYOUT_UNSPECIFIED = 0;
  // Coupons and maturities stay as the account's cash.
  BOND_PAYOUT_CASH = 1;
  // Coupons and maturities are paid out: each is booked as interest or a
  // redemption, then a withdrawal of the same amount on the same day.
  BOND_PAYOUT_PAID_OUT = 2;
}

// Holding is a non-zero quantity of one instrument held in an account.
message Holding {
  Instrument instrument = 1;
  string quantity = 2;
}

// OpenLot is what is left of one acquisition of an instrument (D-23).
message OpenLot {
  Instrument instrument = 1;
  // The units left, such as "40".
  string quantity = 2;
  // The day the lot was bought, "YYYY-MM-DD": an opening lot's own
  // purchase date, not its go-live date.
  string opened = 3;
  // The cost of the units left.
  Money cost = 4;
  // Whether the lot was seeded as an opening lot.
  bool opening = 5;
}

message SyncResponse {
  Delivery delivery = 1;
  // Where the next sync continues from; the core stores it once the
  // delivery is imported.
  string watermark = 2;
}

// FileHeader describes the file an ImportFile call carries.
message FileHeader {
  // The core's ID for this import batch; a retry reuses it.
  string batch_id = 1;
  Mode mode = 2;
  // The file's name as the owner gave it, such as "statement.csv"; only a
  // hint, never a path.
  string file_name = 3;
  // The file's media type, such as "text/csv", when known.
  string media_type = 4;
  // The cash balance the owner entered once, with an opening batch of a
  // statement that holds none, such as an xStation export's open positions
  // (D-136); unset for none. The connector books it as the account's
  // opening cash on its go-live date. A connector whose statement holds the
  // account's cash, or that can't book it, answers INVALID_ARGUMENT.
  Money opening_cash = 5;
}

message ImportFileRequest {
  oneof part {
    // The first message's part.
    FileHeader header = 1;
    // Every later message's part: the next bytes of the file.
    bytes chunk = 2;
  }
}

message ImportFileResponse {
  Delivery delivery = 1;
}

// BondPurchase is how the bonds of a lot were bought (D-100).
enum BondPurchase {
  // Not given: a cash purchase, as every lot was before D-100.
  BOND_PURCHASE_UNSPECIFIED = 0;
  // For cash at the nominal, 100 PLN per bond.
  BOND_PURCHASE_CASH = 1;
  // By exchange (zamiana) of maturing bonds at the series' exchange price,
  // 99.90 PLN per bond.
  BOND_PURCHASE_EXCHANGE = 2;
}

// BondLot is one lot of Polish retail treasury bonds as the owner entered
// it: what D-9 names (series, quantity, purchase date), plus the series'
// terms the owner entered, which override any the connector reads (D-97),
// and how the bonds were bought (D-100).
message BondLot {
  // The series code, such as "EDO0536".
  string series = 1;
  // How many bonds: a positive whole number, such as "40".
  string quantity = 2;
  // The day the bonds were bought, "YYYY-MM-DD".
  string purchase_date = 3;
  // The series' first-period rate, as a fraction: 6.8% is "0.068". Empty,
  // with margin empty too, when the owner left both to the connector, which
  // reads them from the issuer's published data (D-97).
  string first_period_rate = 4;
  // The series' margin, as a fraction; "0" for a fixed-rate series. Empty
  // exactly when first_period_rate is.
  string margin = 5;
  // The series' early-redemption fee per bond, in PLN. Unset when the
  // owner left it to the connector, which takes it from its reviewed table
  // of the issue letters (D-97).
  Money early_redemption_fee = 6;
  // How the bonds were bought; unspecified is a cash purchase.
  BondPurchase purchase = 7;
}

// BondLotKey names one entered lot: its series and purchase date, which
// make it unique in its account (D-98).
message BondLotKey {
  // The series code, such as "EDO0536".
  string series = 1;
  // The day the bonds were bought, "YYYY-MM-DD".
  string purchase_date = 2;
}

message ImportBondLotsRequest {
  // The core's ID for this import batch; a retry reuses it.
  string batch_id = 1;
  repeated BondLot lots = 2;
  // Empty for every account the owner entered lots on since D-98 was
  // rewritten: each lot is a deposit of its cost and a buy on its purchase
  // date. Only an account seeded earlier with opening lots carries the
  // date it was seeded on, "YYYY-MM-DD": a lot bought on or before it
  // keeps being booked as the opening lot it was, keeping its key, and a
  // later one is a deposit and a buy.
  string go_live = 3;
  // Lots the owner deletes as a correction (D-100): the connector delivers
  // a deletion of each of their transactions, and of everything it booked
  // for them since, among booked (D-154).
  repeated BondLotKey deleted = 4;
  // The OpenFief account the owner entered the lots on (D-118): the
  // connector books them there, so one instance serves every bond account
  // bound to it and its config names none.
  string account_id = 5;
  // Only with deleted lots: the account's current transactions this
  // instance delivered, each keyed as the connector keyed it (without the
  // prefix the core adds) and dated. A connector that stores nothing picks
  // from them what it booked for each deleted lot, such as its coupons, its
  // redemption and their payout withdrawals, and delivers their deletions
  // too, so their cash goes with the lot (D-154).
  repeated BookedTransaction booked = 6;
}

// BookedTransaction is a current transaction a connector instance
// delivered into an account: its key as the connector gave it and its
// date, "YYYY-MM-DD".
message BookedTransaction {
  TransactionKey key = 1;
  string date = 2;
}

message ImportBondLotsResponse {
  Delivery delivery = 1;
}
