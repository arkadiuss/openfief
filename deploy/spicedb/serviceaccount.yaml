# SpiceDB's identity, with no rights on the Kubernetes API and no token mounted: it never calls the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfief-spicedb
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-spicedb
    app.kubernetes.io/part-of: openfief
automountServiceAccountToken: false
