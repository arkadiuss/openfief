# The two credentials SpiceDB needs, generated in the cluster the first time and never again, so nothing is committed
# and no owner has to make one up (D-216; D-29: credentials are Secrets):
#   openfief-spicedb-key  key       the preshared key clients present to SpiceDB; SpiceDB and the core read it.
#   openfief-db-spicedb   username  the PostgreSQL role spicedb of the openfief-db cluster, with its password, a
#                         password  kubernetes.io/basic-auth Secret as CloudNativePG's managed roles take it
#                                   (../database); SpiceDB reads it, CloudNativePG sets the role's password from it.
# CloudNativePG generates a password for the owner of the database it creates (openfief-db-app) and for no other role,
# so this Job makes the rest. It runs `core init-credentials` from the core's own image, which the release signs and
# the bundle pins by digest (D-17) like every image of ours, so the install runs no third-party image for it. Each value
# is 32 random bytes from the Go runtime's crypto/rand, as 64 hex digits: no escaping in a connection string. The
# command creates each Secret through the API server, and a Secret that exists already answers 409 and is kept: an owner
# who made either one first, from their own tooling (D-29), keeps theirs, and running the Job again, after an upgrade
# or a restore, never rotates a credential and never reads one. It logs which Secrets it made or kept and nothing of
# their values. To rotate one, delete the Secret and this release's Job and apply this again; SpiceDB and the core
# read their Secrets when they start, so restart them after (SpiceDB first), and, for the database password,
# CloudNativePG applies the new one to the role by itself.
#
# Its rights: create Secrets in the openfief namespace, nothing else, and not even to read one back (D-15, D-216): this
# is the only Role of the install that may create a Secret (scripts/tests/release-bundle.test.sh). The pod can reach the
# API server and DNS only (the policy below), and runs as the core image's non-root user with a read-only root
# filesystem, no capabilities and no database credential: the command needs none.
# A Job's pod template can't change once it exists, and the core's image changes with every release, so the Job is
# named per release instead of being deleted or re-created: the name below is the base's, and the release bundle gives
# it the release's version (openfief-init-credentials-<version>), a demo or test deploy the short hash of the core's
# image digest, so an upgrade creates a new Job and runs it once, and Flux prunes the old release's. What stays stable
# is the label app.kubernetes.io/name=openfief-init-credentials, on the Job and its pod, which the policy below selects.
# With plain kubectl, the old Jobs, completed, linger, one per upgrade, and do no harm. To clear them, either delete
# them before you apply (kubectl -n openfief delete job -l app.kubernetes.io/name=openfief-init-credentials) or apply
# with --prune -l app.kubernetes.io/name=openfief-init-credentials. Applying again only keeps the Secrets that exist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfief-init-credentials
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-init-credentials
    app.kubernetes.io/part-of: openfief
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openfief-init-credentials
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-init-credentials
    app.kubernetes.io/part-of: openfief
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openfief-init-credentials
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-init-credentials
    app.kubernetes.io/part-of: openfief
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openfief-init-credentials
subjects:
  - kind: ServiceAccount
    name: openfief-init-credentials
    namespace: openfief
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openfief-init-credentials
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-init-credentials
    app.kubernetes.io/part-of: openfief
spec:
  # Retries cover an API server or DNS that isn't answering yet.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfief-init-credentials
        app.kubernetes.io/part-of: openfief
    spec:
      restartPolicy: Never
      serviceAccountName: openfief-init-credentials
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # The core image's user and group (distroless nonroot); numeric, since the kubelet can't tell that a name isn't root.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-credentials
          # The core's image, pinned by digest with `images:` in an overlay (../core/kustomization.yaml; the release
          # bundle does it with the signed digest). Its entrypoint is /core.
          image: ghcr.io/arkadiuss/openfief/core
          args: [init-credentials]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# The Job's pod reaches the API server and DNS, and nothing else, and nothing reaches it (D-184). The API server rule is
# the core's (../core/networkpolicy.yaml): the Service is DNAT-ed to the API server's own address, so the rule names
# port 6443 to any address, which an owner narrows to their API server's addresses with an overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfief-init-credentials
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-init-credentials
    app.kubernetes.io/part-of: openfief
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfief-init-credentials
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
