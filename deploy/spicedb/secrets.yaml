# The two credentials SpiceDB needs, generated in the cluster the first time and never again, so nothing is committed
# and no owner has to make one up (D-29: credentials are Secrets; here the cluster generates them):
#   openfief-spicedb-key  key       the preshared key clients present to SpiceDB; SpiceDB and the core read it.
#   openfief-db-spicedb   username  the PostgreSQL role spicedb of the openfief-db cluster, with its password, a
#                         password  kubernetes.io/basic-auth Secret as CloudNativePG's managed roles take it
#                                   (../database); SpiceDB reads it, CloudNativePG sets the role's password from it.
# CloudNativePG generates a password for the owner of the database it creates (openfief-db-app) and for no other role,
# so this Job makes the rest. Each value is 32 random bytes from the Job's /dev/urandom, as 64 hex digits: no escaping
# in a connection string. The Job POSTs each Secret to the API server, so a Secret that exists already answers 409
# and is left as it is: running it again, after an upgrade or a restore, never rotates a credential, and never reads
# one. It prints which Secrets it made and nothing of their values. To rotate one, delete the Secret and the Job and
# apply this again; SpiceDB and the core read their Secrets when they start, so restart them after (SpiceDB first),
# and, for the database password, CloudNativePG applies the new one to the role by itself.
#
# Its rights: create Secrets in the openfief namespace, nothing else, and not even to read one back (D-15). The pod
# can reach the API server and DNS only (the policy below), and runs as a non-root user with a read-only root
# filesystem. The image is curl's own, pinned by digest (Renovate, renovate.json).
# A Job's pod template can't change once it exists, so an apply that changes the image fails on the old Job: delete it
# first (kubectl -n openfief delete job openfief-spicedb-secrets), or let GitOps force it (the demo does).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfief-spicedb-secrets
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-spicedb-secrets
    app.kubernetes.io/part-of: openfief
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openfief-spicedb-secrets
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-spicedb-secrets
    app.kubernetes.io/part-of: openfief
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openfief-spicedb-secrets
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-spicedb-secrets
    app.kubernetes.io/part-of: openfief
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openfief-spicedb-secrets
subjects:
  - kind: ServiceAccount
    name: openfief-spicedb-secrets
    namespace: openfief
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openfief-spicedb-secrets
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-spicedb-secrets
    app.kubernetes.io/part-of: openfief
spec:
  # Retries cover an API server or DNS that isn't answering yet.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfief-spicedb-secrets
        app.kubernetes.io/part-of: openfief
    spec:
      restartPolicy: Never
      serviceAccountName: openfief-spicedb-secrets
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # curl_user and its group in the image; numeric, since the kubelet can't tell that a name isn't root.
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets
          # curlimages/curl 8.22.0
          image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command:
            - /bin/sh
            - -ec
            - |
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              ns="$(cat "$sa/namespace")"
              # random prints 64 random hex digits.
              random() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              # create POSTs the Secret on standard input, as JSON; its body is never printed, and the answer's is thrown away.
              create() {
                code="$(curl -sS -o /dev/null -w '%{http_code}' --cacert "$sa/ca.crt" \
                  -H "Authorization: Bearer $(cat "$sa/token")" -H 'Content-Type: application/json' \
                  --data-binary @- "$api/api/v1/namespaces/$ns/secrets")"
                case "$code" in
                  201) echo "created Secret $1" ;;
                  409) echo "Secret $1 exists; left as it is" ;;
                  *) echo "Secret $1: the API server answered HTTP $code" >&2; exit 1 ;;
                esac
              }
              printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"openfief-spicedb-key","namespace":"%s","labels":{"app.kubernetes.io/name":"openfief-spicedb","app.kubernetes.io/part-of":"openfief"}},"type":"Opaque","stringData":{"key":"%s"}}' \
                "$ns" "$(random)" | create openfief-spicedb-key
              printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"openfief-db-spicedb","namespace":"%s","labels":{"app.kubernetes.io/name":"openfief-spicedb","app.kubernetes.io/part-of":"openfief","cnpg.io/reload":"true"}},"type":"kubernetes.io/basic-auth","stringData":{"username":"spicedb","password":"%s"}}' \
                "$ns" "$(random)" | create openfief-db-spicedb
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
# The Job's pod reaches the API server and DNS, and nothing else, and nothing reaches it (D-184). The API server rule is
# the core's (../core/networkpolicy.yaml): the Service is DNAT-ed to the API server's own address, so the rule names
# port 6443 to any address, which an owner narrows to their API server's addresses with an overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfief-spicedb-secrets
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-spicedb-secrets
    app.kubernetes.io/part-of: openfief
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfief-spicedb-secrets
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
