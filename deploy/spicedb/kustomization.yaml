# SpiceDB, the authorization database (D-164, D-163): one pod that answers the core's per-account permission checks
# (--authz=spicedb, the core's default), with its datastore a database `spicedb` of the openfief-db cluster, in a role
# of its own (D-14). A self-contained kustomize base next to ../core; the install bundle and the demo ship it with the
# core, which answers from it; an owner who puts the core on --authz=policy leaves it running, unasked. Services only
# (D-28): Service openfief-spicedb is a ClusterIP with gRPC on 50051, which only the core reaches (networkpolicy.yaml).
#
# What it needs and where it comes from:
#   - the database and the role: ../database holds the Database `spicedb` and the managed role `spicedb` of the
#     openfief-db cluster. An install whose Cluster you edited by hand adds the role and the Database there too
#     (docs/guides/install.md); without them the migration waits for a database that doesn't exist, and the core
#     stays not ready, saying in /readyz and its log that the role or the database spicedb is missing.
#   - the credentials: the Job in secrets.yaml generates the Secrets openfief-spicedb-key (the preshared key, shared
#     by SpiceDB and the core) and openfief-db-spicedb (the role's password) once. The pods wait for them, and start
#     by themselves as soon as they exist.
#   - the schema: the core writes authz/schema.zed to SpiceDB at every start, before it reconciles (D-164), so
#     nothing here loads one.
# The core's side is in ../core/deployment.yaml, which this base doesn't touch: --authz=spicedb in its args, and SpiceDB's
# endpoint and plaintext gRPC on the in-cluster Service, behind its NetworkPolicy, in its environment, with the key's
# Secret mounted as an optional volume.
#
# The image is pinned by digest here, as a third party's (D-17 pins our own with `images:` in an overlay): the release
# bundle leaves an image that already names its digest as it is.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openfief
resources:
  - serviceaccount.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
