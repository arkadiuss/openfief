apiVersion: v1
kind: Service
metadata:
  name: openfief-spicedb
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-spicedb
    app.kubernetes.io/part-of: openfief
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openfief-spicedb
  # SpiceDB's gRPC API, the core's only way to it (networkpolicy.yaml). A number, not the port's name, as the
  # core's Service does.
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
