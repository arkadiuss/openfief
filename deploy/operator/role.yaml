---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openfief-operator
  namespace: openfief
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - openfief.io
  resources:
  - plugingrants
  - plugins
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - openfief.io
  resources:
  - plugingrants/status
  - plugins/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - openfief.io
  resources:
  - plugins/finalizers
  verbs:
  - update
