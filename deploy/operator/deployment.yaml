apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfief-operator
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-operator
    app.kubernetes.io/part-of: openfief
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfief-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfief-operator
        app.kubernetes.io/part-of: openfief
    spec:
      serviceAccountName: openfief-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # An overlay pins the image by digest with `images:` (see kustomization.yaml).
          image: ghcr.io/arkadiuss/openfief/operator
          args:
            - --core-service=openfief-core
            - --core-port=connect
            - --egress-proxy-service=egress-proxy
            - --egress-proxy-port=proxy
            - --plugin-port=8080
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
