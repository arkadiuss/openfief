# The plugin operator (D-13), namespace-scoped (D-15): a Role in openfief, never a ClusterRole.
# role.yaml is generated by `task gen` from the RBAC markers in internal/plugins/operator; never edit it by hand.
# Needs deploy/crds first. Install: kubectl apply -k deploy/operator
#
# Image signatures (D-17, D-45, D-56, D-57): the operator deploys a plugin image only when a trusted signer signed its
# digest: OpenFief's CI, a publisher pinned in the catalog (internal/plugins/catalog/plugins.json), or a signer the
# owner adds in the optional ConfigMap openfief-trusted-signers, key signers.json, for example:
#   {"signers": [
#     {"name": "my-ci", "issuer": "https://token.actions.githubusercontent.com",
#      "subject": "https://github.com/<you>/<plugin>/.github/workflows/release.yml@refs/heads/main"},
#     {"name": "my-ci-tags", "issuer": "https://token.actions.githubusercontent.com",
#      "subjectPattern": "https://github\\.com/<you>/<plugin>/\\.github/workflows/release\\.yml@refs/tags/v.*"},
#     {"name": "laptop", "publicKey": "-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----\n"}]}
# The operator reads it at start: restart it after a change. An invalid file stops it. There is no flag or setting
# that deploys an unsigned image. Verification is offline against a bundled Sigstore trust root; the operator only needs
# HTTPS egress to the registries plugins come from (for GHCR: ghcr.io and pkg-containers.githubusercontent.com),
# read anonymously.
#
#
# Core-to-plugin auth (D-59): the operator publishes the cluster's ServiceAccount token-signing public keys and issuer
# in the ConfigMap openfief-sa-jwks, which every plugin mounts. It reads them from the API server's
# /.well-known/openid-configuration and /openid/v1/jwks. Those are non-resource URLs that no Role can grant;
# Kubernetes' default RBAC binds the ClusterRole system:service-account-issuer-discovery to the group
# system:serviceaccounts, which covers the operator. On a cluster that removed that binding, bind the ClusterRole to
# the ServiceAccount openfief/openfief-operator; until then plugins have no keys and refuse every call.
#
# Pin the image by digest before installing, e.g.:
#   kustomize edit set image ghcr.io/arkadiuss/openfief/operator=ghcr.io/arkadiuss/openfief/operator@sha256:<digest>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openfief
resources:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - deployment.yaml
