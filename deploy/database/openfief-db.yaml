# OpenFief's database (D-14): the smallest CloudNativePG cluster that works, one instance on the cluster's default
# storage class. Edit it before you apply it: size the storage and the resources, set a storageClass, add
# CloudNativePG's backups. The resources are its own (D-182), so the namespace's LimitRange defaults don't size it:
# 100m CPU and 256Mi requested, at most 1Gi of memory. Raise the memory for a larger history; there is no CPU limit,
# because CPU is only throttled, never fatal.
# The install reads the connection string from the Secret openfief-db-app that CloudNativePG creates for it, so keep
# the name, the namespace, the database and its owner.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfief-db
  namespace: openfief
spec:
  instances: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: openfief
      owner: openfief
  # SpiceDB's role (D-164): the login role spicedb, whose password is the Secret openfief-db-spicedb that
  # ../spicedb generates, and spicedb-database.yaml's database of its own. Keep it, also in a Cluster of your own;
  # until that Secret exists CloudNativePG reports the role as not reconciled and keeps trying, which doesn't
  # affect the cluster. It owns nothing of OpenFief's: the core's role is another, and neither can read the other's
  # database.
  managed:
    roles:
      - name: spicedb
        ensure: present
        login: true
        passwordSecret:
          name: openfief-db-spicedb
