apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      # Chart 0.29.1 ships operator 1.30.1. Exact pin: bump it in a pull request.
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # The demo machine has 4 GB of RAM (docs/dev/demo.md#size-and-cost); keep the operator small.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
