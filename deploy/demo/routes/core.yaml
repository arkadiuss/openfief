# The core's read API (D-50): Connect at /openfief.<package>.<Service>/<Method> and REST at /v1/..., both served by
# Service openfief-core, port name http (an assumption until deploy/core lands). Everything goes to the core for
# now; the UI gets its own rule when it exists. cert-manager issues the certificate through HTTP-01.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfief-core
  namespace: openfief
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${DEMO_HOST}
      secretName: openfief-demo-tls
  rules:
    - host: ${DEMO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openfief-core
                port:
                  name: http
