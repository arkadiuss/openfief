# The demo's route, on one host, to the core alone: the core is the only entry point for browsers (D-81). It serves
# its public read API itself (/v1 REST and /openfief.views.v1.ReadService Connect, D-50), which scripts call with a
# script token (D-27), and proxies every other path to the view plugin whose granted browser path covers it: the
# built-in UI (plugins/ui, browser path /) with the core's own token for it (D-59). Service openfief-core, port http.
# The core's other Connect services (/openfief.identity.v1.AuthService and the owner's entry services) answer only
# view plugins' tokens. cert-manager issues the certificate through HTTP-01.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfief
  namespace: openfief
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${DEMO_HOST}
      secretName: openfief-demo-tls
  rules:
    - host: ${DEMO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openfief-core
                port:
                  name: http
