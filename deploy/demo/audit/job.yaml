# One audit of the egress proxy's log per deploy (kustomization.yaml). No retries: a failed audit is a finding, not a
# flake, and its log names the instance and host.
apiVersion: batch/v1
kind: Job
metadata:
  name: egress-audit
  labels:
    app.kubernetes.io/name: egress-audit
    app.kubernetes.io/part-of: openfief
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-audit
        app.kubernetes.io/part-of: openfief
    spec:
      serviceAccountName: egress-audit
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress-audit
          image: ghcr.io/arkadiuss/openfief/egress-proxy
          args: ["audit"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
