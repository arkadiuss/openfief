# The egress audit reads, and only reads, the egress proxy's logs and the PluginGrants, in the openfief namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-audit
  labels:
    app.kubernetes.io/name: egress-audit
    app.kubernetes.io/part-of: openfief
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-audit
  labels:
    app.kubernetes.io/name: egress-audit
    app.kubernetes.io/part-of: openfief
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [openfief.io]
    resources: [plugingrants]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-audit
  labels:
    app.kubernetes.io/name: egress-audit
    app.kubernetes.io/part-of: openfief
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-audit
subjects:
  - kind: ServiceAccount
    name: egress-audit
