apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: ${DEMO_ACME_SERVER}
    # No email: the ACME account carries no personal data, so Let's Encrypt sends no expiry mail.
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
