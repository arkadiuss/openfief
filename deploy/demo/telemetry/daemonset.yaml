# The collector, one pod per node (the demo has one). A DaemonSet because it reads the node's pod logs from disk.
#
# The pod needs the node's /var/log/pods, read-only, and one directory of its own on the node, /var/lib/openfief-otel,
# for its read positions. It runs as root only because containerd writes the log files readable by root alone; it has
# no capability, no privilege escalation and a read-only root filesystem, and no Kubernetes API token.
#
# The Secret grafana-otlp is not in git. Its keys endpoint, instance-id and token are required: until the Secret
# exists the pod stays in CreateContainerConfigError, which runs nothing, sends nothing and logs nothing, and kubelet
# starts it as soon as the Secret appears. docs/dev/demo.md#telemetry says how to create it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: openfief
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: openfief
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            - name: GRAFANA_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: grafana-otlp
                  key: endpoint
                  optional: false
            - name: GRAFANA_INSTANCE_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-otlp
                  key: instance-id
                  optional: false
            - name: GRAFANA_OTLP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-otlp
                  key: token
                  optional: false
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              # The configuration's memory limiter is at 160 MiB, below this.
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /var/lib/openfief-otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: positions
          hostPath:
            path: /var/lib/openfief-otel
            type: DirectoryOrCreate
