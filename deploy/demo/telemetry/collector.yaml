  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  # The Grafana Cloud OTLP gateway, such as the one Grafana shows for the stack: the endpoint is the
  # Secret's, so no account's address is in git. HTTPS with basic auth, instance ID and token. A short queue and a
  # bounded retry: when Grafana is down the collector drops what it can't hold rather than grow.
  otlphttp/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana
    compression: gzip
    timeout: 20s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      queue_size: 256

service:
  extensions: [health_check, file_storage/logs, basicauth/grafana]
  telemetry:
    # The collector's own logs go to its standard output, at warning level, and its own metrics are off: nothing of the
    # collector is exported, and nothing listens on 8888.
    logs:
      level: warn
      encoding: json
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [file_log, otlp]
      processors: [memory_limiter, transform/scrub, transform/service, batch]
      exporters: [otlphttp/grafana]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/scrub, transform/service, batch]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/scrub, transform/service, batch]
      exporters: [otlphttp/grafana]
