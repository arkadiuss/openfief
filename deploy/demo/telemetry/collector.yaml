      - context: datapoint
        statements:
          - delete_matching_keys(datapoint.attributes, "(?i)(^|[._-])((client|remote|peer|source)([._-]?|[._-][A-Za-z0-9]+[._-])(ip|addr|address)|real[._-]?ip|forwarded[._-]?for|forwarded|cf[._-]?connecting[._-]?ip|ip|ips|ip[._-]?addr|ip[._-]?address|host[._-]?ip|session|sess|sid|session[._-]?(id|token|key|cookie)|token|tokens|token[._-]?id|tokenid|secret|secrets|password|passwd|credential|credentials|api[._-]?key|apikey|bearer|authorization|cookie|cookies|set[._-]?cookie|csrf|xsrf|jwt|headers?|user[._-]?agent|useragent|question|questions|q|prompt|prompts|query|answer|completion)($|[._-])")
