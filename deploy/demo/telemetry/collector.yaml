          - replace_pattern(span.name, "([0-9A-Fa-f]{0,4}:){2,7}[0-9]{1,3}([.][0-9]{1,3}){3}|[0-9]{1,3}([.][0-9]{1,3}){3}|([0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}|([0-9A-Fa-f]{0,4}:){1,7}:([0-9A-Fa-f]{1,4}(:[0-9A-Fa-f]{1,4}){0,6})?|(ofs|ofsess|ofenroll)_[A-Za-z0-9_-]+|(?i:(bearer|basic)[ ]+[A-Za-z0-9._~+/=-]+)|eyJ[A-Za-z0-9_-]+[.][A-Za-z0-9_-]+[.][A-Za-z0-9_-]*|[A-Za-z0-9_-]{40,}", "[redacted]")
