# The demo's PostgreSQL (D-14): one CloudNativePG instance on k3s's local-path storage. Synthetic data only (GR-12).
# CloudNativePG generates the openfief role's password into the Secret openfief-db-app, and deploy/spicedb generates
# the spicedb role's into openfief-db-spicedb; nothing is committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster.yaml
  - spicedb-database.yaml
