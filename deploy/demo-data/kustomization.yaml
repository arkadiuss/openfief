# The demo dataset loader (cmd/demo-seed): a one-off Job that loads the synthetic demo dataset into the demo
# database and exits. A self-contained kustomize base for the demo environment (deploy/demo includes it); never
# install it next to real data. The loader refuses any database that holds ledger or valuation data without its
# own demo marker, so pointing it at a real database fails before anything is written.
#
# The database URL comes from CloudNativePG's app secret <cluster>-app, key uri. The default cluster name is
# openfief-db; an overlay with another cluster patches the secret name in job.yaml.
# Pin the image by digest before installing, e.g.:
#   kustomize edit set image ghcr.io/arkadiuss/openfief/demo-seed=ghcr.io/arkadiuss/openfief/demo-seed@sha256:<digest>
# A Job's pod template is immutable: to load again (it resets the demo database), delete the Job and apply again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openfief
resources:
  - job.yaml
