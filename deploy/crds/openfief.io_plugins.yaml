---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: plugins.openfief.io
spec:
  group: openfief.io
  names:
    categories:
    - openfief
    kind: Plugin
    listKind: PluginList
    plural: plugins
    singular: plugin
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="ApprovalRequired")].status
      name: Approval required
      type: string
    - jsonPath: .status.conditions[?(@.type=="SignatureVerified")].status
      name: Signature
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Plugin is what a plugin's vendor requests: a digest-pinned image, a
          manifest of permissions and a config (D-13, D-16). The operator runs it
          only with what its PluginGrant of the same name approves.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PluginSpec is one version of a plugin.
            properties:
              config:
                description: |-
                  Config is the plugin's configuration, a JSON object checked against
                  manifest.configSchema. It must not hold credentials: those belong in
                  Secrets (D-29).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              image:
                description: |-
                  Image is the plugin's container image, pinned by digest:
                  repository@sha256:<64 hex digits>. Tags are refused (D-17).
                maxLength: 320
                pattern: ^[^@]+@sha256:[0-9a-f]{64}$
                type: string
              manifest:
                description: Manifest is what the plugin requests.
                properties:
                  browserPath:
                    description: |-
                      BrowserPath is the path prefix a view plugin serves to browsers: the
                      core, the only entry point for browsers, proxies it to the plugin
                      (D-81). "/" means every path the core doesn't serve itself.
                    maxLength: 256
                    pattern: ^/[-a-z0-9_./]*$
                    type: string
                  capabilities:
                    description: Capabilities are what the plugin acts as.
                    items:
                      enum:
                      - connector
                      - view
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  configSchema:
                    description: ConfigSchema is the JSON Schema that spec.config
                      must satisfy.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  dataTiers:
                    description: DataTiers lists the classes of data the plugin asks
                      to see.
                    items:
                      maxLength: 32
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  egress:
                    description: |-
                      Egress lists the hosts the plugin reaches through the egress proxy, as
                      "host" (port 443) or "host:port". Never IP addresses or wildcards.
                    items:
                      maxLength: 259
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                  secrets:
                    description: |-
                      Secrets lists the Kubernetes Secrets, in the openfief namespace, that
                      the plugin needs mounted read-only. The owner creates them (D-29).
                    items:
                      description: SecretMount asks for one Secret to be mounted read-only
                        at MountPath.
                      properties:
                        mountPath:
                          description: MountPath is an absolute path outside /var/run/secrets.
                          maxLength: 1024
                          minLength: 2
                          type: string
                        name:
                          description: Name is the Secret's name.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - mountPath
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - capabilities
                type: object
            required:
            - image
            - manifest
            type: object
          status:
            description: PluginStatus is what the operator observed and did.
            properties:
              conditions:
                description: Conditions are Ready, ApprovalRequired and SignatureVerified.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deployed:
                description: |-
                  Deployed is the plugin version that runs now; absent when nothing runs.
                  It is the version kept while an upgrade waits for approval.
                properties:
                  config:
                    description: |-
                      Config is the plugin's configuration, a JSON object checked against
                      manifest.configSchema. It must not hold credentials: those belong in
                      Secrets (D-29).
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  image:
                    description: |-
                      Image is the plugin's container image, pinned by digest:
                      repository@sha256:<64 hex digits>. Tags are refused (D-17).
                    maxLength: 320
                    pattern: ^[^@]+@sha256:[0-9a-f]{64}$
                    type: string
                  manifest:
                    description: Manifest is what the plugin requests.
                    properties:
                      browserPath:
                        description: |-
                          BrowserPath is the path prefix a view plugin serves to browsers: the
                          core, the only entry point for browsers, proxies it to the plugin
                          (D-81). "/" means every path the core doesn't serve itself.
                        maxLength: 256
                        pattern: ^/[-a-z0-9_./]*$
                        type: string
                      capabilities:
                        description: Capabilities are what the plugin acts as.
                        items:
                          enum:
                          - connector
                          - view
                          type: string
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      configSchema:
                        description: ConfigSchema is the JSON Schema that spec.config
                          must satisfy.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      dataTiers:
                        description: DataTiers lists the classes of data the plugin
                          asks to see.
                        items:
                          maxLength: 32
                          type: string
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: set
                      egress:
                        description: |-
                          Egress lists the hosts the plugin reaches through the egress proxy, as
                          "host" (port 443) or "host:port". Never IP addresses or wildcards.
                        items:
                          maxLength: 259
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: set
                      secrets:
                        description: |-
                          Secrets lists the Kubernetes Secrets, in the openfief namespace, that
                          the plugin needs mounted read-only. The owner creates them (D-29).
                        items:
                          description: SecretMount asks for one Secret to be mounted
                            read-only at MountPath.
                          properties:
                            mountPath:
                              description: MountPath is an absolute path outside /var/run/secrets.
                              maxLength: 1024
                              minLength: 2
                              type: string
                            name:
                              description: Name is the Secret's name.
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - mountPath
                          - name
                          type: object
                        maxItems: 32
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                    required:
                    - capabilities
                    type: object
                required:
                - image
                - manifest
                type: object
              effective:
                description: |-
                  Effective is what the running version is allowed: only what it
                  requests and the PluginGrant approves (D-16). Its egress hosts are the
                  plugin's egress allow-list. Absent when nothing runs.
                properties:
                  browserPaths:
                    description: |-
                      BrowserPaths lists path prefixes a view plugin serves to browsers
                      through the core (D-81).
                    items:
                      maxLength: 256
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                  capabilities:
                    description: Capabilities are what the plugin may act as.
                    items:
                      enum:
                      - connector
                      - view
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  dataTiers:
                    description: DataTiers lists data tier names.
                    items:
                      maxLength: 32
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  egress:
                    description: Egress lists hosts as "host" (port 443) or "host:port".
                    items:
                      maxLength: 259
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                  secrets:
                    description: Secrets lists Secret names.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                type: object
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  describes.
                format: int64
                type: integer
              pendingApproval:
                description: |-
                  PendingApproval is what spec requests and the PluginGrant does not
                  approve. The owner approves it by adding it to the PluginGrant.
                properties:
                  browserPaths:
                    description: |-
                      BrowserPaths lists path prefixes a view plugin serves to browsers
                      through the core (D-81).
                    items:
                      maxLength: 256
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                  capabilities:
                    description: Capabilities are what the plugin may act as.
                    items:
                      enum:
                      - connector
                      - view
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  dataTiers:
                    description: DataTiers lists data tier names.
                    items:
                      maxLength: 32
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  egress:
                    description: Egress lists hosts as "host" (port 443) or "host:port".
                    items:
                      maxLength: 259
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                  secrets:
                    description: Secrets lists Secret names.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                type: object
              signature:
                description: |-
                  Signature says who signed spec.image and how far that is trusted
                  (D-45, D-56), while the SignatureVerified condition is True; absent
                  otherwise. The condition's reason tells verified from only signed;
                  this also names the signer and its kind, for the UI to show.
                properties:
                  signer:
                    description: |-
                      Signer is the trusted signer's name: openfief-ci, a catalog
                      publisher's or one the owner added.
                    maxLength: 253
                    type: string
                  signerKind:
                    description: SignerKind is the kind of trusted signer (D-45).
                    enum:
                    - OpenFiefCI
                    - Publisher
                    - Owner
                    type: string
                  trust:
                    description: |-
                      Trust is Verified when the catalog pins the image to the publisher
                      that signed it (D-44), Unverified when another trusted signer did.
                    enum:
                    - Verified
                    - Unverified
                    type: string
                required:
                - signer
                - signerKind
                - trust
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a lower-case DNS label of at most 56 characters that
            starts with a letter
          rule: self.metadata.name.size() <= 56 && self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
