# Cluster-admin part of the install (D-15): the openfief namespace and the Plugin and PluginGrant CRDs.
# The CRD files are generated by `task gen` from internal/plugins/operator/v1alpha1; never edit them by hand.
# Install: kubectl apply -k deploy/crds
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - openfief.io_plugins.yaml
  - openfief.io_plugingrants.yaml
