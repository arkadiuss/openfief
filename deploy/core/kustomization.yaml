# OpenFief core service (D-2): the read API (D-6, D-50), the River revaluation workers (D-36), script tokens
# (D-27) and the connector scheduler (D-49), which calls each running connector instance with a TokenRequest token
# of its own ServiceAccount (D-59; rbac.yaml). A self-contained kustomize base; an overlay pins the image by digest with `images:`, e.g.:
#   kustomize edit set image ghcr.io/arkadiuss/openfief/core=ghcr.io/arkadiuss/openfief/core@sha256:<digest>
#
# Services only (D-28): Service openfief-core is a ClusterIP with two ports on two listeners (D-115):
#   http     8080 -> 8080  the browser port: the front door to the built-in UI (D-81), the read API (REST under /v1,
#            Connect under /openfief.views.v1.ReadService) and /healthz and /readyz. The default way in is
#            `openfief enroll`, which port-forwards it to localhost:8080; anything else is the installation's own
#            route to this port, such as ../gateway's HTTPRoute (every read API call needs a session or a script token).
#   connect  8081 -> 8081  the plugin port, which only plugin pods reach (networkpolicy.yaml) and the operator gives
#            them (its --core-port=connect, D-49): the read API, the AuthService and the owner services.
# The operator reads this Service's selector and copies it into every plugin's NetworkPolicy, so the core pods'
# label app.kubernetes.io/name: openfief-core must stay unique to the core.
#
# The database URL comes from CloudNativePG's app secret <cluster>-app, key uri (D-14, D-29). The default cluster
# is openfief-db; an overlay with another cluster patches the secret name in deployment.yaml and the database
# selector in networkpolicy.yaml.
#
# The first passkey (D-60, D-80): `openfief enroll` prints a one-time link and port-forwards localhost:8080 to the
# core; `openfief enroll --origin https://fief.example.org` prints one for an origin in --auth-origin, through the
# owner's own route. By hand, the same link comes from:
#   kubectl -n openfief exec deploy/openfief-core -- /core enroll-link --host localhost:8080
#
# Script tokens come from a logged-in session in the UI; as a break-glass, the CLI issues them too (the image has
# no shell, so exec the binary itself):
#   kubectl -n openfief exec deploy/openfief-core -- /core token issue --name my-script --ttl 168h
#   kubectl -n openfief exec deploy/openfief-core -- /core token list
#   kubectl -n openfief exec deploy/openfief-core -- /core token revoke <id>
#
# A connector instance writes only to the accounts it is bound to, and the owner binds them:
#   kubectl -n openfief exec deploy/openfief-core -- /core connector bind --instance ibkr-main --account <account id>
#   kubectl -n openfief exec deploy/openfief-core -- /core connector sync --instance ibkr-main
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openfief
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
