# The core's identity: plugins accept only its TokenRequest tokens (D-59), and rbac.yaml grants it what it needs to
# sync connectors. The ServiceAccount mounts no API token by default; the Deployment opts in for the core's pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openfief-core
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-core
    app.kubernetes.io/part-of: openfief
automountServiceAccountToken: false
