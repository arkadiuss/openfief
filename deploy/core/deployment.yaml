apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfief-core
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-core
    app.kubernetes.io/part-of: openfief
spec:
  replicas: 1
  # One pod at a time: on a small machine a rolling update would briefly need two. River works the revaluation
  # queue safely from several pods, so more replicas are possible; each drains on shutdown.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openfief-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfief-core
        app.kubernetes.io/part-of: openfief
    spec:
      serviceAccountName: openfief-core
      # The core calls the Kubernetes API (rbac.yaml): TokenRequest for its own tokens to plugins (D-59) and reads
      # of Plugins and Services to find connector instances (D-49).
      automountServiceAccountToken: true
      # Longer than --shutdown-timeout, so requests and running revaluations can finish before the kill.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          # An overlay pins the image by digest with `images:` (see kustomization.yaml).
          image: ghcr.io/arkadiuss/openfief/core
          args:
            - serve
            # The browser port (Service port http) and the plugin port (Service port connect), D-115.
            - --listen=:8080
            - --plugin-listen=:8081
            - --reporting-currency=PLN
            - --time-zone=Europe/Warsaw
            - --end-of-day=23:30
            - --workers=2
            - --bond-basis=net_if_redeemed
            - --shutdown-timeout=25s
            # Connector syncs (D-49); on by default in a cluster, shown here with their defaults.
            - --connectors=true
            - --sync-every=6h
            - --sync-jitter=30m
            - --sync-timeout=5m
            - --service-account=openfief-core
            # The origins the owner's browser may use (D-60): port-forward to localhost:8080 by default. An
            # installation with its own Ingress adds its https origin; repeat the flag. Sessions: 12h idle, 7d at most.
            - --auth-origin=http://localhost:8080
            - --session-idle=12h
            - --session-max=168h
          env:
            - name: OPENFIEF_DSN
              valueFrom:
                secretKeyRef:
                  name: openfief-db-app
                  key: uri
          ports:
            - name: http
              containerPort: 8080
            - name: connect
              containerPort: 8081
          # /healthz answers as soon as the process listens, also while it waits for the database and migrates;
          # /readyz only once it is migrated and the database answers. Neither needs a token or returns data.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
