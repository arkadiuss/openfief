apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfief-core
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-core
    app.kubernetes.io/part-of: openfief
spec:
  replicas: 1
  # One pod at a time: on a small machine a rolling update would briefly need two. River works the revaluation
  # queue safely from several pods, so more replicas are possible; each drains on shutdown.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openfief-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfief-core
        app.kubernetes.io/part-of: openfief
    spec:
      serviceAccountName: openfief-core
      # The core calls the Kubernetes API (rbac.yaml): TokenRequest for its own tokens to plugins (D-59) and reads
      # of Plugins and Services to find connector instances (D-49).
      automountServiceAccountToken: true
      # Longer than --shutdown-timeout, so requests and running revaluations can finish before the kill.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          # An overlay pins the image by digest with `images:` (see kustomization.yaml).
          image: ghcr.io/arkadiuss/openfief/core
          args:
            - serve
            # The browser port (Service port http) and the plugin port (Service port connect), D-115.
            - --listen=:8080
            - --plugin-listen=:8081
            - --reporting-currency=PLN
            - --time-zone=Europe/Warsaw
            - --end-of-day=23:30
            - --workers=2
            - --shutdown-timeout=25s
            # Connector syncs (D-49); on by default in a cluster, shown here with their defaults.
            - --connectors=true
            - --sync-every=6h
            - --sync-jitter=30m
            - --sync-timeout=5m
            # One connector sync at a time (D-189): each holds its delivery in memory while it imports it. Raise it only
            # together with limits.memory below, and GOMEMLIMIT with it.
            - --sync-workers=1
            - --service-account=openfief-core
            # Sessions: 12h idle, 7d at most.
            - --session-idle=12h
            - --session-max=168h
          env:
            - name: OPENFIEF_DSN
              valueFrom:
                secretKeyRef:
                  name: openfief-db-app
                  key: uri
            # The origins the owner's browser may use (D-60), separated by commas: port-forward to localhost:8080 by
            # default. An installation with its own route adds its https origin (docs/guides/expose.md). One setting
            # that serving and `core enroll-link` both read, so the core refuses a link for any other origin (D-126).
            # Overlays replace env/1, after testing its name.
            - name: OPENFIEF_AUTH_ORIGINS
              value: http://localhost:8080
            # Go's GC aims below this, so a burst such as the largest connector answer the core takes (D-184) is
            # collected before the container's 256Mi limit kills it. Keep it about 80% of limits.memory.
            - name: GOMEMLIMIT
              value: 200MiB
            # SpiceDB's address (../spicedb, D-164), read only with --authz=spicedb: the default, --authz=policy, ignores
            # it. An overlay that opts in adds --authz=spicedb and --spicedb-insecure (plaintext gRPC on the Service
            # behind its NetworkPolicy) to the args. The preshared key is not here: it is the file mounted below.
            # Overlays add to this list, after env/2.
            - name: OPENFIEF_SPICEDB_ENDPOINT
              value: openfief-spicedb:50051
            # Tracing is off: nothing is recorded or sent without an OTLP endpoint. The standard OpenTelemetry
            # variables turn it on, best through the optional component ../tracing, which also lets the core reach
            # the collector through its NetworkPolicy (docs/guides/tracing.md). For example:
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://otel-collector.observability:4318
            # - name: OTEL_EXPORTER_OTLP_PROTOCOL       # http/protobuf (default) or grpc (port 4317)
            #   value: http/protobuf
            # - name: OTEL_TRACES_SAMPLER               # parentbased_always_on by default
            #   value: parentbased_traceidratio
            # - name: OTEL_TRACES_SAMPLER_ARG
            #   value: "0.25"
            # - name: OTEL_EXPORTER_OTLP_HEADERS        # may hold a credential: from a Secret, never a literal
            #   valueFrom:
            #     secretKeyRef:
            #       name: openfief-otlp
            #       key: headers
          ports:
            - name: http
              containerPort: 8080
            - name: connect
              containerPort: 8081
          # /healthz answers as soon as the process listens, also while it waits for the database and migrates;
          # /readyz only once it is migrated and the database answers. Neither needs a token or returns data.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          # SpiceDB's preshared key, the file /var/run/openfief/spicedb/key (--spicedb-key-file's default), read only
          # with --authz=spicedb. The volume is optional: the core starts before the credentials Job (../spicedb,
          # D-216) has created the Secret, serves its health endpoints, refuses every check and reports not ready, and
          # the kubelet puts the file there, within about a minute of the Secret, which the core then picks up. A
          # key in OPENFIEF_SPICEDB_PRESHARED_KEY, which an owner may add, wins over the file (D-29).
          volumeMounts:
            - name: spicedb-key
              mountPath: /var/run/openfief/spicedb
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: spicedb-key
          secret:
            secretName: openfief-spicedb-key
            optional: true
            items:
              - key: key
                path: key
