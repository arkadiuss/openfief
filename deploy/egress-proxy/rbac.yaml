apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-proxy
  labels:
    app.kubernetes.io/name: egress-proxy
    app.kubernetes.io/part-of: openfief
---
# Read the one ConfigMap the operator writes the egress allow-lists to.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-proxy
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openfief-egress-allowlist]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-proxy
subjects:
  - kind: ServiceAccount
    name: egress-proxy
---
# TokenReview is a cluster-scoped API, so verifying plugin tokens needs a ClusterRole even though the
# proxy only serves the openfief namespace. Narrower than system:auth-delegator: create tokenreviews only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openfief-egress-proxy-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openfief-egress-proxy-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openfief-egress-proxy-tokenreview
subjects:
  - kind: ServiceAccount
    name: egress-proxy
    namespace: openfief
