apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  labels:
    app.kubernetes.io/name: egress-proxy
    app.kubernetes.io/part-of: openfief
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: egress-proxy
  ports:
    - name: proxy
      port: 4750
      # A number, not the port's name: the operator copies it into every plugin's NetworkPolicy,
      # which matches pod ports.
      targetPort: 4750
