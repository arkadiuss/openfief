apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  labels:
    app.kubernetes.io/name: egress-proxy
    app.kubernetes.io/part-of: openfief
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-proxy
        app.kubernetes.io/part-of: openfief
    spec:
      serviceAccountName: egress-proxy
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress-proxy
          image: ghcr.io/arkadiuss/openfief/egress-proxy
          args: ["-listen=:4750"]
          ports:
            - name: proxy
              containerPort: 4750
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: proxy
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: proxy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
