apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  labels:
    app.kubernetes.io/name: egress-proxy
    app.kubernetes.io/part-of: openfief
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-proxy
        app.kubernetes.io/part-of: openfief
    spec:
      serviceAccountName: egress-proxy
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress-proxy
          image: ghcr.io/arkadiuss/openfief/egress-proxy
          args: ["-listen=:4750"]
          env:
            # The node's own address, which the proxy refuses as a destination like the private ranges (D-184).
            # A cluster whose pods, Services or nodes use public or global IPv6 ranges adds them with -deny-cidr.
            - name: OPENFIEF_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: proxy
              containerPort: 4750
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: proxy
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: proxy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
