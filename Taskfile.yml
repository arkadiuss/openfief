# OpenFief task runner: the single entry point for every local, hook and CI step (docs/dev/sdlc.md).
# First time: install Task at TASK_VERSION below (go install github.com/go-task/task/v3/cmd/task@<TASK_VERSION>),
# then run `task setup`. CI installs Task the same way and runs `task setup:ci` (.github/actions/setup).
version: '3'

vars:
  # Tool versions are pinned here; the `# renovate:` comments let Renovate update them (renovate.json).
  # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
  GOLANGCI_LINT_VERSION: v2.15.0
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.9.0
  # renovate: datasource=go depName=github.com/evilmartians/lefthook/v2
  LEFTHOOK_VERSION: v2.2.2
  # renovate: datasource=go depName=github.com/go-task/task/v3
  TASK_VERSION: v3.54.0
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # renovate: datasource=go depName=sigs.k8s.io/controller-tools
  CONTROLLER_GEN_VERSION: v0.23.0
  # The API server and etcd of the operator's envtest suite; scripts/envtest-assets.sh pins their checksums.
  ENVTEST_K8S_VERSION: 1.36.2
  # renovate: datasource=go depName=github.com/gohugoio/hugo
  HUGO_VERSION: v0.168.0
  # renovate: datasource=go depName=github.com/bufbuild/buf
  BUF_VERSION: v1.75.0
  # The code generators must match the runtime versions in sdk/go/go.mod (google.golang.org/protobuf, connectrpc.com/connect).
  # renovate: datasource=go depName=google.golang.org/protobuf
  PROTOC_GEN_GO_VERSION: v1.36.12
  # renovate: datasource=go depName=connectrpc.com/connect
  PROTOC_GEN_CONNECT_GO_VERSION: v1.21.1
  # Demo machine automation (docs/dev/demo.md): the Hetzner Cloud CLI, kustomize for the GitOps manifests,
  # and gojq for JSON and YAML in the scripts.
  # renovate: datasource=go depName=github.com/hetznercloud/cli
  HCLOUD_VERSION: v1.70.1
  # renovate: datasource=go depName=sigs.k8s.io/kustomize/kustomize/v5
  KUSTOMIZE_VERSION: v5.8.3
  # renovate: datasource=go depName=github.com/itchyny/gojq
  GOJQ_VERSION: v0.12.19
  # What a demo machine's cloud-init (deploy/demo/cloud-init.yaml) installs. A version bump needs the new
  # checksums too, or the machine stops at the first mismatch: docs/dev/demo.md#update-the-pinned-versions.
  # renovate: datasource=github-releases depName=k3s-io/k3s
  K3S_VERSION: v1.36.5+k3s1
  K3S_SHA256_ARM64: 135e34cb9e8a1cfae3cb55577789e93501efe7edc080a8b2630458a85b07721e
  K3S_SHA256_AMD64: d73847bcd3c5fccef0115b372e2f9a91f3032dc84bbf71518a4617565294d313
  K3S_INSTALL_SHA256: 46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
  # renovate: datasource=github-releases depName=fluxcd/flux2
  FLUX_VERSION: v2.9.6
  FLUX_INSTALL_SHA256: 9c1fda7e401429531ed1478f67ba06b3edff6513b75da7ee47bde9f1c4d4251c
  # The flux CLI (same release) publishes the demo's signed manifests artifact (task deploy:demo). Its module has
  # replace directives, so `go install` can't build it: the release archive is checked against these sha256s.
  FLUX_CLI_SHA256_LINUX_AMD64: b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5
  FLUX_CLI_SHA256_LINUX_ARM64: 6663c154755b732f43dc993d72321f71c2fc1ff0bcb94b2696e0a8638fa562b4
  # Generates the read API's OpenAPI document from its protobuf definitions (D-50).
  # renovate: datasource=go depName=github.com/sudorandom/protoc-gen-connect-openapi
  PROTOC_GEN_CONNECT_OPENAPI_VERSION: v0.28.0
  # Every Go module in the repository (go.work lists the same): the core, then the Apache-2.0 Go SDK (D-5).
  GO_MODULES: . sdk/go
  GO_GUARD: 'if [ ! -f go.mod ]; then echo "no Go module yet, skipping"; exit 0; fi;'
  PROTO_GUARD: 'if [ -z "$(find proto -name "*.proto" 2>/dev/null)" ]; then echo "no contracts yet, skipping"; exit 0; fi;'
  # Tools are called by explicit path: Task lets the OS environment override a Taskfile PATH.
  BIN: '{{.ROOT_DIR}}/.bin'
  # Go tools are built with go.mod's toolchain: golangci-lint refuses code that targets a newer Go than it was built with.
  GO_TOOLCHAIN:
    sh: sed -n 's/^toolchain //p' go.mod 2>/dev/null || true
  KIBI: '{{.ROOT_DIR}}/node_modules/.bin/kibi'

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - '{{.TASK_EXE}} --list'

  setup:
    desc: One-time setup per clone (pinned tools, kibi, git hooks, kibi merge driver)
    cmds:
      - task: tools
      - task: kibi:install
      - task: hooks
      - task: merge-driver

  setup:ci:
    desc: CI setup (pinned tools, kibi, this branch's knowledge base); no git hooks
    cmds:
      - task: tools:ci
      - task: kibi:install
      - task: kibi:sync

  tools:
    desc: Install the pinned Go tools into .bin/
    deps: [tool:golangci-lint, tool:govulncheck, tool:actionlint, tool:lefthook, tool:task, tool:controller-gen, tool:envtest, tool:proto, tool:hcloud, tool:kustomize, tool:gojq, tool:hugo]

  tools:ci:
    internal: true
    deps: [tool:golangci-lint, tool:govulncheck, tool:actionlint, tool:task, tool:controller-gen, tool:envtest, tool:proto, tool:kustomize, tool:gojq, tool:hugo]

  tool:hcloud:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install github.com/hetznercloud/cli/cmd/hcloud@{{.HCLOUD_VERSION}}
    status:
      - '{{.BIN}}/hcloud version 2>&1 | grep -q "^hcloud {{trimPrefix "v" .HCLOUD_VERSION}}"'

  tool:kustomize:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install sigs.k8s.io/kustomize/kustomize/v5@{{.KUSTOMIZE_VERSION}}
    status:
      - '{{.BIN}}/kustomize version 2>&1 | grep -qx "{{.KUSTOMIZE_VERSION}}"'

  tool:flux:
    internal: true
    cmds:
      - |
        set -e
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64) arch=amd64; sum='{{.FLUX_CLI_SHA256_LINUX_AMD64}}' ;;
          Linux/aarch64 | Linux/arm64) arch=arm64; sum='{{.FLUX_CLI_SHA256_LINUX_ARM64}}' ;;
          *) echo "tool:flux: only linux/amd64 and linux/arm64 are pinned (CI uses it)" >&2; exit 1 ;;
        esac
        version='{{trimPrefix "v" .FLUX_VERSION}}'
        work="$(mktemp -d)"
        trap 'rm -rf "$work"' EXIT
        curl -fsSL --retry 3 -o "$work/flux.tar.gz" "https://github.com/fluxcd/flux2/releases/download/v${version}/flux_${version}_linux_${arch}.tar.gz"
        echo "$sum  $work/flux.tar.gz" | sha256sum -c -
        tar -xzf "$work/flux.tar.gz" -C "$work" flux
        mkdir -p '{{.BIN}}'
        install -m 0755 "$work/flux" '{{.BIN}}/flux'
    status:
      - '{{.BIN}}/flux version --client 2>&1 | grep -q "{{trimPrefix "v" .FLUX_VERSION}}"'

  tool:gojq:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install github.com/itchyny/gojq/cmd/gojq@{{.GOJQ_VERSION}}
    status:
      - '{{.BIN}}/gojq --version 2>&1 | grep -q "^gojq {{trimPrefix "v" .GOJQ_VERSION}} "'

  tool:golangci-lint:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    status:
      - '{{.BIN}}/golangci-lint version 2>&1 | grep -q "version {{trimPrefix "v" .GOLANGCI_LINT_VERSION}} "'
      - '{{if .GO_TOOLCHAIN}}{{.BIN}}/golangci-lint version 2>&1 | grep -q "built with {{.GO_TOOLCHAIN}} "{{end}}'

  tool:govulncheck:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
    status:
      - '{{.BIN}}/govulncheck -version 2>&1 | grep -q "govulncheck@{{.GOVULNCHECK_VERSION}}"'
      - '{{if .GO_TOOLCHAIN}}go version {{.BIN}}/govulncheck 2>&1 | grep -q ": {{.GO_TOOLCHAIN}}$"{{end}}'

  tool:lefthook:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' go install github.com/evilmartians/lefthook/v2@{{.LEFTHOOK_VERSION}}
    status:
      - '{{.BIN}}/lefthook version 2>&1 | grep -qx "{{trimPrefix "v" .LEFTHOOK_VERSION}}"'

  tool:actionlint:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' go install github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
    status:
      - '{{.BIN}}/actionlint -version 2>&1 | head -n1 | grep -qx "{{.ACTIONLINT_VERSION}}"'

  tool:hugo:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' CGO_ENABLED=0 go install github.com/gohugoio/hugo@{{.HUGO_VERSION}}
    status:
      - '{{.BIN}}/hugo version 2>&1 | grep -q "hugo {{.HUGO_VERSION}} "'

  tool:proto:
    internal: true
    deps: [tool:buf, tool:protoc-gen-go, tool:protoc-gen-connect-go, tool:protoc-gen-connect-openapi]

  tool:buf:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}
    status:
      - '{{.BIN}}/buf --version 2>&1 | grep -qx "{{trimPrefix "v" .BUF_VERSION}}"'

  tool:protoc-gen-go:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
    status:
      - '{{.BIN}}/protoc-gen-go --version 2>&1 | grep -qx "protoc-gen-go {{.PROTOC_GEN_GO_VERSION}}"'

  tool:protoc-gen-connect-go:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install connectrpc.com/connect/cmd/protoc-gen-connect-go@{{.PROTOC_GEN_CONNECT_GO_VERSION}}
    status:
      - '{{.BIN}}/protoc-gen-connect-go --version 2>&1 | grep -qx "{{trimPrefix "v" .PROTOC_GEN_CONNECT_GO_VERSION}}"'

  tool:protoc-gen-connect-openapi:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install github.com/sudorandom/protoc-gen-connect-openapi@{{.PROTOC_GEN_CONNECT_OPENAPI_VERSION}}
    status:
      - '{{.BIN}}/protoc-gen-connect-openapi --version 2>&1 | grep -q "^protoc-gen-connect-openapi {{.PROTOC_GEN_CONNECT_OPENAPI_VERSION}} "'

  tool:task:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' go install github.com/go-task/task/v3/cmd/task@{{.TASK_VERSION}}
    status:
      - '{{.BIN}}/task --version 2>&1 | grep -qx "{{trimPrefix "v" .TASK_VERSION}}"'

  tool:controller-gen:
    internal: true
    cmds:
      - GOBIN='{{.BIN}}' GOTOOLCHAIN='{{.GO_TOOLCHAIN | default "local"}}' go install sigs.k8s.io/controller-tools/cmd/controller-gen@{{.CONTROLLER_GEN_VERSION}}
    status:
      - '{{.BIN}}/controller-gen --version 2>&1 | grep -qx "Version: {{.CONTROLLER_GEN_VERSION}}"'

  tool:envtest:
    internal: true
    cmds:
      - bash scripts/envtest-assets.sh '{{.ENVTEST_K8S_VERSION}}' '{{.BIN}}/envtest'
    status:
      - test -x '{{.BIN}}/envtest/{{.ENVTEST_K8S_VERSION}}/kube-apiserver'
      - test -x '{{.BIN}}/envtest/{{.ENVTEST_K8S_VERSION}}/etcd'

  hooks:
    desc: Install git hooks (lefthook); hooks only call task targets
    cmds:
      - '{{.BIN}}/lefthook install'

  merge-driver:
    desc: Register kibi's merge driver for the .kb files named in .gitattributes
    cmds:
      - git config merge.kibi.name "kibi record merge"
      - git config merge.kibi.driver "{{.KIBI}} merge-driver %O %A %B"

  check:
    desc: Full local pipeline, identical to CI
    cmds:
      - task: gen:check
      - task: fmt:check
      - task: lint
      - task: lint:ci
      - task: proto
      - task: vuln
      - task: test
      - task: docs:check
      - task: docs:build
      - task: docs:fresh
      - task: demo:validate
      - task: kibi:check

  check:commit:
    desc: Pre-commit pipeline (like check, with kibi on staged changes)
    cmds:
      - task: gen:check
      - task: fmt:check
      - task: lint
      - task: lint:ci
      - task: proto
      - task: vuln
      - task: test
      - task: docs:check
      - task: docs:build
      - task: demo:validate
      - task: kibi:staged

  gen:
    desc: Generate the operator's deepcopy code, CRDs (deploy/crds) and Role (deploy/operator) with controller-gen
    deps: [tool:controller-gen]
    cmds:
      - '{{.BIN}}/controller-gen object paths=./internal/plugins/operator/...'
      - '{{.BIN}}/controller-gen crd paths=./internal/plugins/operator/... output:crd:artifacts:config=deploy/crds'
      - '{{.BIN}}/controller-gen rbac:roleName=openfief-operator paths=./internal/plugins/operator/... output:rbac:artifacts:config=deploy/operator'

  gen:check:
    desc: Fail if generated code or manifests differ from what `task gen` writes
    cmds:
      - task: gen
      - bash scripts/gen-check.sh deploy/crds deploy/operator/role.yaml internal/plugins/operator/v1alpha1/zz_generated.deepcopy.go

  fmt:
    desc: Format Go code (gofumpt, goimports) in every Go module
    cmds:
      - for: {var: GO_MODULES}
        cmd: '{{.GO_GUARD}} cd {{.ITEM}} && {{.BIN}}/golangci-lint fmt'

  fmt:check:
    desc: Fail if Go code is not formatted
    cmds:
      - for: {var: GO_MODULES}
        cmd: '{{.GO_GUARD}} cd {{.ITEM}} && {{.BIN}}/golangci-lint fmt --diff'

  lint:
    desc: Strict lint (.golangci.yml) of every Go module
    cmds:
      - '{{.BIN}}/golangci-lint config verify'
      - for: {var: GO_MODULES}
        cmd: '{{.GO_GUARD}} cd {{.ITEM}} && {{.BIN}}/golangci-lint run'

  proto:
    desc: Contract checks (buf lint and format, breaking changes, generated code up to date)
    cmds:
      - task: proto:lint
      - task: proto:breaking
      - task: proto:check

  proto:lint:
    desc: Lint and format-check the protobuf contracts (buf, STANDARD rules)
    deps: [tool:buf]
    cmds:
      - '{{.PROTO_GUARD}} {{.BIN}}/buf lint'
      - '{{.PROTO_GUARD}} {{.BIN}}/buf format --diff --exit-code'

  proto:breaking:
    desc: 'Fail on breaking contract changes against a base revision (PROTO_BASE or DOCS_BASE, default HEAD), e.g. PROTO_BASE=origin/main task proto:breaking'
    deps: [tool:buf]
    cmds:
      - PATH='{{.BIN}}':"$PATH" bash scripts/proto-breaking.sh

  proto:gen:
    desc: Generate the Go code for the contracts into sdk/go/gen and the read API's OpenAPI into gen/openapi (pinned local plugins, no remote BSR)
    deps: [tool:proto]
    cmds:
      - '{{.PROTO_GUARD}} PATH="{{.BIN}}:$PATH" "{{.BIN}}/buf" generate'

  proto:check:
    desc: Fail if sdk/go/gen or gen/openapi is not what proto:gen generates
    deps: [tool:proto]
    cmds:
      - PATH='{{.BIN}}':"$PATH" bash scripts/proto-check.sh

  lint:ci:
    desc: Lint the GitHub Actions workflows (actionlint, offline)
    deps: [tool:actionlint]
    cmds:
      # The shellcheck and pyflakes integrations are off so the result never depends on what the machine has installed.
      - '{{.BIN}}/actionlint -shellcheck= -pyflakes='

  vuln:
    desc: Vulnerability checks (govulncheck, npm audit)
    cmds:
      - PATH='{{.BIN}}':"$PATH" bash scripts/vulncheck.sh {{.GO_MODULES}}

  test:
    desc: Unit, replay-integration, envtest and tooling tests (offline once `task tools` has run)
    deps: [tool:envtest, tool:kustomize, tool:gojq]
    cmds:
      - for: {var: GO_MODULES}
        cmd: '{{.GO_GUARD}} cd {{.ITEM}} && KUBEBUILDER_ASSETS="{{.BIN}}/envtest/{{.ENVTEST_K8S_VERSION}}" go test ./...'
      - bash scripts/tests/check-docs.test.sh
      - bash scripts/tests/vulncheck.test.sh
      - bash scripts/tests/ci-images.test.sh
      - bash scripts/tests/dco-check.test.sh
      - bash scripts/tests/release-version.test.sh
      - bash scripts/tests/release-notes.test.sh
      - PATH='{{.BIN}}':"$PATH" bash scripts/tests/proto-breaking.test.sh
      - PATH='{{.BIN}}':"$PATH" bash scripts/tests/demo.test.sh
      - PATH='{{.BIN}}':"$PATH" bash scripts/tests/demo-pin-images.test.sh
      - PATH='{{.BIN}}':"$PATH" bash scripts/tests/demo-validate.test.sh

  test:pg:
    desc: 'PostgreSQL integration tests on a disposable server (OPENFIEF_PG_DSN, or local PostgreSQL binaries), e.g. task test:pg -- -run TestAppend'
    cmds:
      - '{{.GO_GUARD}} bash scripts/test-pg.sh {{.CLI_ARGS}}'

  e2e:
    desc: End-to-end tests on a local k3s; refuses non-local clusters
    cmds:
      - bash scripts/assert-local-cluster.sh
      - 'if [ ! -d test/e2e ]; then echo "no e2e suite yet, skipping"; exit 0; fi; go test -tags e2e -count=1 ./test/e2e/...'

  dco:
    desc: 'DCO sign-off check (D-5) on the commits in BASE..HEAD, e.g. task dco BASE=origin/main HEAD=HEAD'
    requires:
      vars: [BASE, HEAD]
    cmds:
      - bash scripts/dco-check.sh '{{.BASE}}' '{{.HEAD}}'

  ci:images:
    desc: 'JSON list of the images CI builds (cmd/*/Dockerfile, plugins/*/Dockerfile), e.g. task ci:images PREFIX=ghcr.io/owner/openfief'
    silent: true
    cmds:
      - bash scripts/ci-images.sh '{{.PREFIX}}'

  image:sign:
    desc: 'Keyless cosign signature of a pushed image (CI only, D-17), e.g. task image:sign IMAGE=ghcr.io/owner/openfief/x@sha256:...'
    requires:
      vars: [IMAGE]
    cmds:
      # cosign v3's default: a Sigstore bundle (DSSE, predicate https://sigstore.dev/cosign/sign/v1) stored as an
      # OCI referrer of the digest. The operator reads only this format (internal/plugins/cosign); its certificate
      # subject is images.yml at refs/heads/main (plugins.OpenFiefCISubject), so keep signing in that workflow.
      - cosign sign --yes '{{.IMAGE}}'

  trustroot:update:
    desc: Refresh the operator's bundled Sigstore trust root (D-56) through TUF; review the diff and commit it
    cmds:
      - '{{.GO_GUARD}} go run ./cmd/sigstore-trusted-root -o internal/plugins/cosign/trusted_root.json'

  deploy:demo:
    desc: 'Publish deploy/demo/openfief, pinned to the signed digests of TAG, as the signed artifact Flux on the demo follows (CI only; needs cosign and a GHCR login), e.g. task deploy:demo TAG=sha-1a2b3c4 REPO=owner/openfief'
    deps: [tool:gojq, tool:kustomize, tool:flux]
    requires:
      vars: [TAG, REPO]
    env:
      TAG: '{{.TAG}}'
      REPO: '{{.REPO}}'
    cmds:
      - |
        set -e
        PATH='{{.BIN}}':"$PATH" bash scripts/demo/pin-images.sh "$TAG" "$REPO"
        PATH='{{.BIN}}':"$PATH" bash scripts/demo/validate.sh
        mkdir -p dist/demo-manifests
        '{{.BIN}}/kustomize' build deploy/demo/openfief >dist/demo-manifests/openfief.yaml
        artifact="oci://ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')/demo-manifests"
        pushed="$('{{.BIN}}/flux' push artifact "$artifact:$TAG" --path=dist/demo-manifests \
          --source="https://github.com/$REPO" --revision="$TAG@sha1:$(git rev-parse HEAD)" --output json)"
        ref="$(printf '%s' "$pushed" | '{{.BIN}}/gojq' -r '.repository + "@" + .digest')"
        cosign sign --yes "$ref"
        '{{.BIN}}/flux' tag artifact "$artifact:$TAG" --tag demo
        echo "deploy: $ref is the demo's app layer; Flux on the demo machine applies it within minutes"

  demo:plan:
    desc: 'What `task demo:up` would create in Hetzner Cloud and the monthly cost against DEMO_BUDGET_EUR, without changing anything, e.g. task demo:plan ENV=demo'
    requires:
      vars: [ENV]
    cmds:
      - task: demo:run
        vars: {ACTION: plan}

  demo:up:
    desc: 'Create the demo machine ENV in Hetzner Cloud, or what is missing of it, within DEMO_BUDGET_EUR (HCLOUD_TOKEN), e.g. task demo:up ENV=demo'
    requires:
      vars: [ENV]
    cmds:
      - task: demo:run
        vars: {ACTION: up}

  demo:status:
    desc: 'Show the demo machine ENV and the monthly cost of all OpenFief resources in the project, e.g. task demo:status ENV=demo'
    requires:
      vars: [ENV]
    cmds:
      - task: demo:run
        vars: {ACTION: status}

  demo:down:
    desc: 'Delete every resource of the demo ENV; needs CONFIRM=<ENV>, e.g. task demo:down ENV=demo CONFIRM=demo'
    requires:
      vars: [ENV]
    cmds:
      - task: demo:run
        vars: {ACTION: down}

  demo:recreate:
    desc: 'Delete and create the demo machine ENV again from the current cloud-init; needs CONFIRM=<ENV>, e.g. task demo:recreate ENV=demo CONFIRM=demo'
    requires:
      vars: [ENV]
    cmds:
      - task: demo:run
        vars: {ACTION: recreate}

  demo:run:
    internal: true
    deps: [tool:hcloud, tool:gojq]
    # HCLOUD_TOKEN is inherited from the environment and never templated here, so Task never prints it.
    env:
      ENV: '{{.ENV}}'
      CONFIRM: '{{.CONFIRM}}'
      # Settings from the shell or the command line; empty means the default in scripts/demo/demo.sh.
      DEMO_SERVER_TYPE: '{{.DEMO_SERVER_TYPE}}'
      DEMO_LOCATION: '{{.DEMO_LOCATION}}'
      DEMO_IMAGE: '{{.DEMO_IMAGE}}'
      DEMO_BUDGET_EUR: '{{.DEMO_BUDGET_EUR}}'
      DEMO_SSH_CIDRS: '{{.DEMO_SSH_CIDRS}}'
      DEMO_HTTP_CIDRS: '{{.DEMO_HTTP_CIDRS}}'
      DEMO_ACME: '{{.DEMO_ACME}}'
      DEMO_GIT_URL: '{{.DEMO_GIT_URL}}'
      DEMO_GIT_BRANCH: '{{.DEMO_GIT_BRANCH}}'
      K3S_VERSION: '{{.K3S_VERSION}}'
      K3S_SHA256_ARM64: '{{.K3S_SHA256_ARM64}}'
      K3S_SHA256_AMD64: '{{.K3S_SHA256_AMD64}}'
      K3S_INSTALL_SHA256: '{{.K3S_INSTALL_SHA256}}'
      FLUX_VERSION: '{{.FLUX_VERSION}}'
      FLUX_INSTALL_SHA256: '{{.FLUX_INSTALL_SHA256}}'
    cmds:
      - PATH='{{.BIN}}':"$PATH" bash scripts/demo/demo.sh '{{.ACTION}}'

  demo:validate:
    desc: Build the demo's GitOps manifests (deploy/demo) offline and check that every image is pinned by digest
    deps: [tool:kustomize, tool:gojq]
    cmds:
      - PATH='{{.BIN}}':"$PATH" bash scripts/demo/validate.sh

  release:check:
    desc: 'Validate a release version for its channel, e.g. task release:check CHANNEL=beta VERSION=2026.11.0-beta.1'
    requires:
      vars: [CHANNEL, VERSION]
    cmds:
      - bash scripts/release-version.sh '{{.CHANNEL}}' '{{.VERSION}}'

  release:notes:
    desc: 'Release notes from Conventional Commits since the previous release, e.g. task release:notes VERSION=2026.11.0'
    silent: true
    requires:
      vars: [VERSION]
    cmds:
      - bash scripts/release-notes.sh '{{.VERSION}}'

  release:assets:
    desc: Package the CRDs and bootstrap install from deploy/, and the docs site as of this version, into dist/
    requires:
      vars: [VERSION]
    cmds:
      - mkdir -p dist
      - 'if [ ! -d deploy ]; then echo "no deploy/ yet, no install assets"; exit 0; fi; tar -czf "dist/openfief-deploy-{{.VERSION}}.tar.gz" deploy'
      - task: docs:build
      - tar -czf "dist/openfief-docs-{{.VERSION}}.tar.gz" -C site/public .

  release:publish:
    desc: Tag the release and, for stable, publish the GitHub release (CI only, after the dry run)
    requires:
      vars: [CHANNEL, VERSION]
    cmds:
      - task: release:check
      - task: release:assets
      - bash scripts/release-notes.sh '{{.VERSION}}' >dist/release-notes.md
      - gh api 'repos/{owner}/{repo}/git/refs' -f ref='refs/tags/{{.VERSION}}' -f sha="$(git rev-parse HEAD)" >/dev/null
      - |
        if [ '{{.CHANNEL}}' != stable ]; then echo "beta {{.VERSION}}: tagged, no GitHub release"; exit 0; fi
        gh release create '{{.VERSION}}' --verify-tag --title '{{.VERSION}}' --notes-file dist/release-notes.md $(find dist -name '*.tar.gz')

  docs:check:
    desc: ID checks for the design documents
    cmds:
      - bash scripts/check-docs.sh

  docs:gen:
    desc: Generate the docs site's reference and status pages into site/.gen (docs/dev/docs.md)
    cmds:
      - mkdir -p site/.gen/content site/.gen/diagrams site/.gen/static
      - go list -json ./... >site/.gen/packages.json
      - '{{.TASK_EXE}} --list-all --json >site/.gen/tasks.json'
      - '{{.KIBI}} coverage --by req --include-passing --limit 100000 --format json >site/.gen/coverage.json'
      - go run ./tools/docgen reference -packages site/.gen/packages.json -tasks site/.gen/tasks.json -coverage site/.gen/coverage.json -out site/.gen/content
      - '{{.KIBI}} report --output site/.gen/static/requirements >/dev/null'

  docs:refs:
    desc: Fail if a docs page names a kibi entity or a task that doesn't exist
    cmds:
      - mkdir -p site/.gen
      - '{{.TASK_EXE}} --list-all --json >site/.gen/tasks.json'
      - go run ./tools/docgen refs -tasks site/.gen/tasks.json

  docs:build:
    desc: Build the docs site into site/public; fails on a broken link, a diagram that doesn't render or a stale reference
    deps: [tool:hugo]
    cmds:
      - task: docs:gen
      - task: docs:refs
      - rm -rf site/public
      - HUGO_PARAMS_DIAGRAMSCOLLECT=true {{.BIN}}/hugo --source . --config site/hugo.toml --quiet --panicOnWarning
      - node scripts/docs-diagrams.mjs site/public/diagrams.json site/.gen/diagrams
      - rm -rf site/public
      - HUGO_PARAMS_COMMIT="$(git rev-parse HEAD)" {{.BIN}}/hugo --source . --config site/hugo.toml --quiet --panicOnWarning --minify
      - rm -f site/public/diagrams.json

  docs:serve:
    desc: Preview the docs site at http://localhost:1313/openfief/ (run task docs:build first for diagrams and generated pages)
    deps: [tool:hugo]
    cmds:
      - '{{.BIN}}/hugo server --source . --config site/hugo.toml'

  docs:fresh:
    desc: 'Staleness gate over a pushed range: covered code changed only with its docs pages or a Docs-Unchanged trailer, e.g. task docs:fresh BASE=origin/main'
    vars:
      BASE: '{{.BASE | default .DOCS_BASE | default ""}}'
    cmds:
      - |
        base='{{.BASE}}'
        if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null || [ -z "${base//0/}" ]; then
          base="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD)"
        fi
        git log --no-merges --format='%x1e%H%x1f%B%x1f' --name-only "$base..HEAD" | go run ./tools/docgen fresh

  docs:fresh:commit:
    desc: Staleness gate for the commit being written (commit-msg hook), e.g. task docs:fresh:commit MSG=.git/COMMIT_EDITMSG
    requires:
      vars: [MSG]
    cmds:
      - |
        if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
          echo "docs: merge commit; the gate checks the merged commits one by one in CI"
          exit 0
        fi
        mkdir -p site/.gen
        cp '{{.MSG}}' site/.gen/commit-msg
        git diff --cached --name-only | go run ./tools/docgen fresh -message site/.gen/commit-msg

  kibi:install:
    desc: Install the pinned kibi packages (npm ci)
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  kibi:doctor:
    desc: Diagnose the kibi setup
    cmds:
      - '{{.KIBI}} doctor'

  kibi:status:
    desc: Show kibi branch and knowledge-base status
    cmds:
      - '{{.KIBI}} status'

  kibi:check:
    desc: Validate the whole requirements knowledge base
    cmds:
      - '{{.KIBI}} check'

  kibi:staged:
    desc: kibi checks on staged changes (what the pre-commit hook runs)
    cmds:
      - '{{.KIBI}} check-generated --staged --changed-only'
      - '{{.KIBI}} check --staged'

  kibi:sync:
    desc: Compile this branch's knowledge base (hooks run it after checkout, merge and rebase; CI sets KIBI_BRANCH)
    cmds:
      - '{{.KIBI}} sync'

  kibi:search:
    desc: 'Search requirements, e.g. task kibi:search -- egress proxy'
    cmds:
      - '{{.KIBI}} search {{.CLI_ARGS}}'

  kibi:report:
    desc: Requirement health report in kibi-report/ (the docs site publishes it at /requirements/)
    cmds:
      - '{{.KIBI}} report'
