# OpenFief docs site (docs/dev/docs.md). Built from the repository root by `task docs:build`:
#   hugo --source . --config site/hugo.toml
# so links to source files resolve against the real tree. docs/ is mounted unchanged under /docs/; the landing page
# (site/content/_index.md) is the site's home.
baseURL = 'https://openfief.dev/'
# Every link and asset is written relative to its page, so the same build works at the custom domain, at the
# GitHub Pages fallback URL, and opened from disk out of a release's docs tarball.
relativeURLs = true
title = 'OpenFief'
locale = 'en'
disableKinds = ['taxonomy', 'term', 'rss']
enableGitInfo = true
publishDir = 'site/public'
resourceDir = 'site/resources'
timeout = '120s'

[params]
  repoURL = 'https://github.com/arkadiuss/openfief'
  # Set by task docs:build: HUGO_PARAMS_COMMIT (links to source files pin this commit) and
  # HUGO_PARAMS_DIAGRAMSCOLLECT (the first pass collects Mermaid blocks instead of inlining SVGs).
  commit = 'main'
  diagramsCollect = false

# Sidebar groups, in reading order; the docs home (docshome.html) lays out the same groups as cards. A group lists
# pages, then a section's pages in weight-then-title order, or splits its pages under small headings (parts). A group
# with a section links its index first. Groups fold away, except those marked open and the one holding the current
# page. Any top-level page or section left out appears under "More", so a new page is never hidden.
[[params.nav]]
  title = 'Get started'
  open = true
  blurb = 'What OpenFief is, a tour of it running, and how its parts fit together.'
  pages = ['/docs/OVERVIEW.md', '/docs/quickstart.md', '/docs/architecture.md']
[[params.nav]]
  title = 'Guides'
  open = true
  blurb = 'Tasks, step by step: reach OpenFief from your network, and build a plugin of your own.'
  section = '/docs/guides'
[[params.nav]]
  title = 'Concepts'
  blurb = 'Each part as built, in depth: what it does, how it works, the decisions behind it and the tests that prove it.'
  section = '/docs/concepts'
  [[params.nav.parts]]
    title = 'Platform'
    pages = ['/docs/concepts/plugins.md', '/docs/concepts/operator.md', '/docs/concepts/egress.md', '/docs/concepts/identity.md', '/docs/concepts/read-api.md', '/docs/concepts/ui.md', '/docs/concepts/ghostfolio.md']
  [[params.nav.parts]]
    title = 'Money and records'
    pages = ['/docs/concepts/kernel.md', '/docs/concepts/ledger.md', '/docs/concepts/ingest.md', '/docs/concepts/valuation.md', '/docs/concepts/treasury-bonds.md', '/docs/concepts/portfolio.md']
[[params.nav]]
  title = 'Reference'
  blurb = 'Generated from the repository on every build: what is built and tested, the code map, resources and tasks.'
  pages = ['/docs/status.md']
  section = '/docs/reference'
[[params.nav]]
  title = 'Design'
  blurb = 'The decided design with its numbered decisions, the vocabulary, and the ideas still open.'
  pages = ['/docs/DESIGN.md', '/docs/glossary.md', '/docs/proposals', '/docs/research.md', '/docs/implementation-questions.md']
[[params.nav]]
  title = 'Contributing'
  blurb = 'How OpenFief is built: rules for contributors and coding agents, testing, the pipeline and the docs.'
  section = '/docs/dev'

# Short sidebar labels for pages whose title (their first heading) is long.
[params.navLabels]
  '/docs/overview.md' = 'Introduction'
  '/docs/architecture.md' = 'How it works'
  '/docs/design.md' = 'Decisions'
  '/docs/research.md' = 'Research'
  '/docs/proposals' = 'Proposals'
  '/docs/implementation-questions.md' = 'Open questions'

[module]
  [[module.mounts]]
    source = 'docs'
    target = 'content/docs'
  [[module.mounts]]
    source = 'site/content'
    target = 'content'
  [[module.mounts]]
    source = 'site/.gen/content'
    target = 'content/docs'
  [[module.mounts]]
    source = 'site/layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'site/assets'
    target = 'assets'
  [[module.mounts]]
    source = 'site/.gen/diagrams'
    target = 'assets/diagrams'
  [[module.mounts]]
    source = 'site/.gen/static'
    target = 'static/docs'
  # The design system (docs/dev/design-system.md): tokens.css into the assets, which head.html concatenates before
  # site.css; the whole folder into the static files at /docs/design/, so fonts, the favicon and the images that
  # docs pages link as ../../design/... resolve on the site as they do on GitHub. design.go, which embeds the folder for
# the built-in UI, stays out of both.
  [[module.mounts]]
    source = 'design'
    target = 'assets/design'
    files = ['! **.go']
  [[module.mounts]]
    source = 'design'
    target = 'static/docs/design'
    files = ['! **.go']

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[outputs]
  home = ['html', 'diagrams']

[outputFormats.diagrams]
  mediaType = 'application/json'
  baseName = 'diagrams'
  isPlainText = true
  notAlternative = true
