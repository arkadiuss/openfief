# The suite's HTTP client stands where the demo's Traefik stands: a pod in another namespace that a policy
# admits to the core's http port. Same shape as deploy/demo/openfief/core-from-traefik.yaml, other labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfief-core-from-e2e-client
  namespace: openfief
  labels:
    app.kubernetes.io/name: openfief-core
    app.kubernetes.io/part-of: openfief
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfief-core
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openfief-e2e
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openfief-e2e-client
      ports:
        - protocol: TCP
          port: 8080
