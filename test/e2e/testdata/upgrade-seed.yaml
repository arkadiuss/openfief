# Seeds the database of an installed 2026.11.0-alpha.1 with the synthetic demo dataset for the upgrade run
# (upgrade_test.go): alpha.1's own demo-seed image, which the run swaps in at the digest scripts/release-fetch.sh
# verified as images.yml signed it, loads the dataset the way alpha.1's code stores it. It is alpha.1's own
# deploy/demo-data (job and NetworkPolicy) less the demo marker's reset flag, with --offline so the loader uses its
# committed NBP rates and needs no egress. Nothing here is a real portfolio (GR-12).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfief-db-from-demo-seed
  namespace: openfief
  labels:
    app.kubernetes.io/name: demo-seed
    app.kubernetes.io/part-of: openfief
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: openfief-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: demo-seed
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-seed
  namespace: openfief
  labels:
    app.kubernetes.io/name: demo-seed
    app.kubernetes.io/part-of: openfief
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-seed
        app.kubernetes.io/part-of: openfief
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-seed
          # The run replaces this with alpha.1's demo-seed image by digest.
          image: ghcr.io/arkadiuss/openfief/demo-seed
          args: ["--offline"]
          env:
            - name: OPENFIEF_DEMO_DSN
              valueFrom:
                secretKeyRef:
                  name: openfief-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
